name: APK do Garçom

on:
  push:
    branches: [main]
    paths:
      - 'android-garcom/**'
      - '.github/workflows/apk-garcom.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Abrir a chave de assinatura
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Falta o segredo KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)." | tee "$RUNNER_TEMP/build.log"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android-garcom/garcom.jks.enc -out "$RUNNER_TEMP/garcom.jks" -pass env:KEYSTORE_PASSWORD

      - name: Montar o APK
        working-directory: android-garcom
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/garcom.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/garcom.apk"

      - name: Publicar (link fixo de download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view garcom-apk >/dev/null 2>&1 || gh release create garcom-apk --title "App do Garçom (Android)" --notes "Baixe o garcom.apk e instale no celular. Atualiza este mesmo link a cada versão."
          gh release upload garcom-apk "$RUNNER_TEMP/garcom.apk" --clobber
          gh release edit garcom-apk --notes "Versão 1.${{ github.run_number }} — $(date -u +%Y-%m-%dT%H:%MZ). Baixe o garcom.apk e instale no celular."

      - name: Avisar falha (log numa issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Build ${{ github.run_number }} (commit ${{ github.sha }}) falhou. Final do log:"; echo; echo '```'; tail -c 55000 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "(sem log)"; echo '```'; } > corpo.md
          gh issue create --title "APK do Garçom: build ${{ github.run_number }} falhou" --body-file corpo.md
