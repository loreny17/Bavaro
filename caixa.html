<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bávaro — Caixa (Totem)</title>
<link rel="manifest" href="/manifest-caixa.json">
<link rel="apple-touch-icon" href="/icone-caixa-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icone-caixa-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icone-caixa-512.png">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bávaro Caixa">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#0a0a0c;
    --surface:#16161c;
    --surface2:#1d1d24;
    --border:rgba(255,255,255,0.08);
    --text:#f5f5f7;
    --muted:#8a8a93;
    --accent:#d4a843;
    --verde:#22c55e;
    --vermelho:#ef4444;
  }
  html,body{height:100%;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  #app{height:100%;display:flex;flex-direction:column;}

  /* Cabeçalho */
  .topo{
    display:flex;align-items:center;
    padding:14px 22px;background:var(--surface);
    border-bottom:1px solid var(--border);gap:14px;
    flex-shrink:0;
  }
  .topo .logo{
    font-family:'Bebas Neue',sans-serif;
    font-size:1.8rem;color:var(--accent);letter-spacing:0.05em;line-height:1;
  }
  .topo .titulo{font-size:0.92rem;color:var(--muted);font-weight:600;}
  .topo .stats{
    margin-left:auto;display:flex;gap:18px;
    font-size:0.82rem;color:var(--muted);
  }
  .topo .stats b{color:var(--text);font-size:1rem;}

  /* Conteúdo: 2 colunas — fila à esquerda, detalhe à direita */
  .corpo{flex:1;display:flex;overflow:hidden;}

  /* FILA */
  .fila{
    width:340px;flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding:12px;
  }
  .fila::-webkit-scrollbar{width:8px;}
  .fila::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .fila h2{
    font-size:0.78rem;color:var(--muted);font-weight:700;
    text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;
  }
  .pedido-card{
    background:var(--bg);
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:8px;
    cursor:pointer;
    display:flex;align-items:center;gap:12px;
    transition:all 0.15s;
  }
  .pedido-card:hover{border-color:var(--accent);}
  .pedido-card.ativo{
    border-color:var(--accent);
    background:rgba(212,168,67,0.06);
  }
  .pedido-card .senha{
    font-family:'Bebas Neue',sans-serif;
    font-size:2.4rem;color:var(--accent);letter-spacing:0.02em;line-height:1;
    min-width:60px;text-align:center;
  }
  .pedido-card .info{flex:1;min-width:0;}
  .pedido-card .qtd-itens{font-size:0.82rem;color:var(--muted);}
  .pedido-card .total{
    color:var(--accent);font-weight:700;font-size:1.05rem;
  }
  .pedido-card .tempo{
    font-size:0.72rem;color:var(--muted);margin-top:2px;
  }
  .pedido-card .tempo.atrasado{color:var(--vermelho);font-weight:700;}

  .fila-vazia{
    text-align:center;padding:60px 20px;color:var(--muted);
  }
  .fila-vazia .ico{font-size:4rem;margin-bottom:14px;}
  .fila-vazia .titulo{font-size:1.05rem;font-weight:600;margin-bottom:4px;}
  .fila-vazia .desc{font-size:0.86rem;}

  /* DETALHE */
  .detalhe{
    flex:1;display:flex;flex-direction:column;
    overflow:hidden;
  }
  .detalhe-cab{
    padding:20px 26px;
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:18px;
    flex-shrink:0;
  }
  .detalhe-cab .senha-grande{
    font-family:'Bebas Neue',sans-serif;
    font-size:4rem;color:var(--accent);letter-spacing:0.02em;line-height:1;
  }
  .detalhe-cab .info{flex:1;}
  .detalhe-cab .lbl{font-size:0.78rem;color:var(--muted);}
  .detalhe-cab .hora{font-size:1rem;font-weight:600;}

  .detalhe-itens{
    flex:1;overflow-y:auto;
    padding:18px 26px;
  }
  .detalhe-itens::-webkit-scrollbar{width:8px;}
  .detalhe-itens::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .item-linha{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:8px;
    display:flex;align-items:flex-start;gap:14px;
  }
  .item-linha .qtd-x{
    background:var(--accent);color:#000;
    font-weight:800;font-size:0.9rem;
    padding:4px 10px;border-radius:7px;
    flex-shrink:0;
  }
  .item-linha .nome{
    flex:1;font-weight:600;font-size:1rem;
  }
  .item-linha .selecoes{
    font-size:0.78rem;color:var(--muted);margin-top:3px;
    line-height:1.35;
  }
  .item-linha .preco{
    font-weight:700;color:var(--accent);
    font-size:1rem;white-space:nowrap;
  }

  .detalhe-rodape{
    padding:18px 26px;
    border-top:1px solid var(--border);
    background:rgba(0,0,0,0.2);
    flex-shrink:0;
  }
  .total-linha{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:16px;
  }
  .total-lbl{font-size:1rem;color:var(--muted);}
  .total-val{
    font-family:'Bebas Neue',sans-serif;
    font-size:2.4rem;color:var(--accent);letter-spacing:0.02em;
  }
  .btns-rodape{display:flex;gap:10px;}
  .btn-cancelar{
    flex:1;padding:16px;
    background:transparent;border:1.5px solid var(--vermelho);
    color:var(--vermelho);border-radius:11px;
    font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit;
  }
  .btn-cancelar:hover{background:rgba(239,68,68,0.08);}
  .btn-editar{
    flex:1;padding:16px;
    background:var(--surface2);border:1.5px solid var(--accent);
    color:var(--accent);border-radius:11px;
    font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit;
  }
  .btn-editar:hover{background:rgba(212,168,67,0.08);}
  .btn-liberar{
    flex:2;padding:16px;
    background:var(--verde);border:none;
    color:#fff;border-radius:11px;
    font-weight:800;font-size:1.05rem;cursor:pointer;font-family:inherit;
  }
  .btn-liberar:hover{filter:brightness(1.1);}
  .btn-liberar:disabled{opacity:0.5;cursor:not-allowed;}

  .vazio-detalhe{
    flex:1;display:flex;align-items:center;justify-content:center;
    flex-direction:column;color:var(--muted);text-align:center;
    padding:20px;
  }
  .vazio-detalhe .ico{font-size:5rem;margin-bottom:16px;opacity:0.4;}
  .vazio-detalhe .titulo{font-size:1.2rem;font-weight:600;margin-bottom:6px;}

  /* Toast */
  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
    padding:14px 26px;border-radius:12px;
    font-weight:700;font-size:0.95rem;z-index:9999;
    box-shadow:0 6px 20px rgba(0,0,0,0.5);
    display:none;
  }

  /* Loading */
  .carregando{
    position:fixed;inset:0;z-index:90;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;
  }
  .carregando.escondido{display:none;}
  .spinner{
    width:50px;height:50px;border:4px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;
    animation:girar 0.8s linear infinite;
  }
  @keyframes girar{to{transform:rotate(360deg);}}

  /* Pedido novo: piscar */
  /* Botões de forma de pagamento e recibo */
  .opt-pagto, .opt-recibo {
    padding: 14px 8px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 9px;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .opt-pagto:hover, .opt-recibo:hover {
    border-color: var(--accent);
    background: rgba(212, 168, 67, 0.05);
  }
  .opt-pagto.selecionado, .opt-recibo.selecionado {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 800;
  }
  @keyframes fadeInTela{from{opacity:0;}to{opacity:1;}}
  @keyframes pulseNovo{
    0%,100%{box-shadow:0 0 0 0 rgba(212,168,67,0.5);}
    50%{box-shadow:0 0 0 8px rgba(212,168,67,0);}
  }
  .pedido-card.novo{
    animation:pulseNovo 1.5s ease infinite;
    border-color:var(--accent);
  }

  /* Responsivo (tablet em retrato/celular) */
  @media(max-width:700px){
    .corpo{flex-direction:column;}
    .fila{width:100%;max-height:40%;}
    .detalhe{flex:1;}
  }
</style>
</head>
<body>

<!-- Loading -->
<div class="carregando" id="carregando">
  <div class="spinner"></div>
  <div style="color:var(--muted);">Carregando caixa...</div>
</div>

<div id="app" style="display:none;">
  <!-- Cabeçalho -->
  <div class="topo">
    <div class="logo">BÁVARO</div>
    <div class="titulo">Caixa — Totem</div>
    <div class="stats">
      <div>Aguardando: <b id="stat-aguardando">0</b></div>
      <div>Pagos hoje: <b id="stat-pagos">0</b></div>
    </div>
    <button onclick="abrirBuffetCaixa()" style="margin-left:12px;background:var(--surface2);color:var(--accent);border:1.5px solid var(--accent);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-family:inherit;font-size:0.86rem;white-space:nowrap;">⚖️ Buffet</button>
    <button onclick="abrirRelatorioDireto()" style="margin-left:8px;background:var(--surface2);color:var(--accent);border:1.5px solid var(--accent);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-family:inherit;font-size:0.86rem;white-space:nowrap;">📊 Relatório</button>
    <button onclick="abrirHistorico()" style="margin-left:8px;background:var(--accent);color:#000;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-family:inherit;font-size:0.86rem;white-space:nowrap;">📋 Histórico</button>
  </div>

  <!-- Corpo: fila + detalhe -->
  <div class="corpo">
    <!-- FILA -->
    <div class="fila">
      <h2 id="fila-titulo">Pedidos aguardando pagamento</h2>
      <div id="fila-lista">
        <div class="fila-vazia">
          <div class="ico">⏳</div>
          <div class="titulo">Sem pedidos</div>
          <div class="desc">Quando um cliente finalizar no totem, aparecerá aqui.</div>
        </div>
      </div>
    </div>

    <!-- DETALHE -->
    <div class="detalhe" id="detalhe">
      <div class="vazio-detalhe">
        <div class="ico">👈</div>
        <div class="titulo">Selecione um pedido na lista</div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ════════════════════════════════════════════════════════════════
//  BÁVARO CAIXA — Tela do operador do caixa do totem
// ════════════════════════════════════════════════════════════════

var firebaseConfig = {
  apiKey: "AIzaSyBmuVAH50RHsNZ7nAcMCdzulJZf3e86f74",
  authDomain: "gestao-reataurante.firebaseapp.com",
  projectId: "gestao-reataurante",
  storageBucket: "gestao-reataurante.appspot.com",
  messagingSenderId: "1071289891873",
  appId: "1:1071289891873:web:bavaro-app"
};
var fbDb = null;

var _params = new URLSearchParams(window.location.search);
// Resolução de tenant/restaurante (mesmo padrão do totem):
// 1. Se veio na URL, USA e salva no localStorage (pro PWA lembrar)
// 2. Senão, lê do localStorage
// 3. Senão, usa o fallback
function _resolverTenantRest(){
  var urlTenant = _params.get('tenant');
  var urlRest = _params.get('rest');
  var STORAGE_KEY = 'bavaro_caixa_config';

  if(urlTenant && urlRest){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({tenant: urlTenant, rest: urlRest}));
    }catch(e){}
    return {tenant: urlTenant, rest: urlRest};
  }

  try{
    var salvo = localStorage.getItem(STORAGE_KEY);
    if(salvo){
      var obj = JSON.parse(salvo);
      if(obj && obj.tenant && obj.rest){
        return {tenant: obj.tenant, rest: obj.rest};
      }
    }
  }catch(e){}

  return {tenant: 'tnt_molrfz1k_rznlgl', rest: 'default'};
}
var _cfg = _resolverTenantRest();
var _tenantId = _cfg.tenant;
var _restauranteId = _cfg.rest;

var _pedidos = [];        // pedidos aguardando_pagamento
var _selecionadoId = null;
var _pagosHojeCount = 0;
var _primeiraCarga = true;
var _idsConhecidos = {};  // pra detectar pedidos novos (piscar)
var _somDesbloqueado = false;

// ── Cardápios (carregados sob demanda quando abre edição) ──
var _cardapioCarregado = false;
var _cardapioTotem = { itens:[], cats:[], grupos:[] };
var _cardapioPrincipal = { itens:[], cats:[], grupos:[] };
var _catsPrincipaisSelecionadas = []; // categorias do principal selecionadas no PDV
var _editandoPedidoId = null;
var _editandoItens = []; // cópia local pra editar
var _pagtoSelecionado = ''; // 'dinheiro'|'pix'|'debito'|'credito'
var _reciboSelecionado = false; // se cliente quer o recibo impresso

window.addEventListener('load', function(){
  // Registra o service worker (PWA)
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw-caixa.js').catch(function(e){
      console.warn('[PWA] erro ao registrar sw:', e);
    });
  }
  try{
    firebase.initializeApp(firebaseConfig);
    fbDb = firebase.firestore();
    iniciar();
  }catch(e){
    document.getElementById('carregando').textContent = 'Erro: ' + e.message;
  }
});

function iniciar(){
  document.getElementById('carregando').classList.add('escondido');
  document.getElementById('app').style.display = 'flex';
  escutarPedidos();
  contarPagosHoje();
  // Desbloqueia áudio no primeiro toque (mobile policy)
  document.addEventListener('click', function() {
    _somDesbloqueado = true;
  }, { once: true });
  // Atualiza o "tempo" dos cards a cada 30s
  setInterval(renderFila, 30000);
}

// Listener em tempo real dos pedidos aguardando pagamento
function escutarPedidos(){
  fbDb.collection('tenants').doc(_tenantId)
    .collection('restaurantes').doc(_restauranteId)
    .collection('pedidos_totem')
    .where('status','==','aguardando_pagamento')
    .onSnapshot(function(snap){
      _pedidos = [];
      var idsNovos = {};
      snap.forEach(function(d){
        var p = Object.assign({id:d.id}, d.data());
        _pedidos.push(p);
        idsNovos[p.id] = true;
      });
      // Ordena por criadoEm (mais antigos primeiro — fifo)
      _pedidos.sort(function(a,b){ return (a.criadoEm||0) - (b.criadoEm||0); });

      // Detecta pedidos NOVOS (chegaram agora, não estavam antes)
      if(!_primeiraCarga){
        var novos = _pedidos.filter(function(p){ return !_idsConhecidos[p.id]; });
        if(novos.length){
          // Toca som de alerta
          tocarSomNovo();
          mostrarToast('🔔 Novo pedido: senha #' + novos[0].senha, '#d4a843');
        }
      }
      _idsConhecidos = idsNovos;
      _primeiraCarga = false;

      renderFila();
      // Atualiza detalhe se o selecionado ainda está na lista
      if(_selecionadoId){
        var ainda = _pedidos.find(function(p){ return p.id === _selecionadoId; });
        if(ainda) renderDetalhe(ainda);
        else { _selecionadoId = null; renderDetalheVazio(); }
      }
    }, function(e){
      console.error('[CAIXA] erro:', e);
      mostrarToast('Erro de conexão: ' + (e.message||e.code), '#f87171');
    });
}

// Conta pedidos pagos hoje (informativo)
function contarPagosHoje(){
  var hoje = _dataHoje();
  fbDb.collection('tenants').doc(_tenantId)
    .collection('restaurantes').doc(_restauranteId)
    .collection('pedidos_totem')
    .where('data','==', hoje)
    .where('status','==','pago')
    .onSnapshot(function(snap){
      _pagosHojeCount = snap.size;
      document.getElementById('stat-pagos').textContent = _pagosHojeCount;
    }, function(e){ console.warn('[CAIXA] pagos hoje:', e.code); });
}

function renderFila(){
  var box = document.getElementById('fila-lista');
  document.getElementById('stat-aguardando').textContent = _pedidos.length;

  if(!_pedidos.length){
    box.innerHTML = '<div class="fila-vazia">' +
      '<div class="ico">⏳</div>' +
      '<div class="titulo">Sem pedidos</div>' +
      '<div class="desc">Quando um cliente finalizar no totem, aparecerá aqui.</div>' +
    '</div>';
    return;
  }

  box.innerHTML = _pedidos.map(function(p){
    var qtdItens = (p.itens||[]).reduce(function(s,i){ return s + (i.qtd||1); }, 0);
    var total = (p.total||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
    var minutos = Math.floor((Date.now() - (p.criadoEm||Date.now())) / 60000);
    var tempoTxt, tempoCls = '';
    if(minutos === 0) tempoTxt = 'agora';
    else if(minutos === 1) tempoTxt = 'há 1 min';
    else tempoTxt = 'há ' + minutos + ' min';
    if(minutos >= 5) tempoCls = ' atrasado';
    var clsNovo = (!_idsConhecidos[p.id] || (Date.now() - (p.criadoEm||0)) < 8000) ? ' novo' : '';
    var clsAtivo = (p.id === _selecionadoId) ? ' ativo' : '';
    return '<div class="pedido-card' + clsAtivo + clsNovo + '" onclick="selecionarPedido(\'' + p.id + '\')">' +
      '<div class="senha">#' + (p.senha||'?') + '</div>' +
      '<div class="info">' +
        '<div class="qtd-itens">' + qtdItens + (qtdItens === 1 ? ' item' : ' itens') + '</div>' +
        '<div class="total">R$ ' + total + '</div>' +
        '<div class="tempo' + tempoCls + '">' + tempoTxt + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function selecionarPedido(id){
  _selecionadoId = id;
  var p = _pedidos.find(function(x){ return x.id === id; });
  if(p) renderDetalhe(p);
  renderFila(); // pra atualizar o "ativo"
}

function renderDetalhe(p){
  var hora = new Date(p.criadoEm||Date.now()).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});

  var itensHtml = (p.itens||[]).map(function(it){
    var sub = (it.preco||0) * (it.qtd||1);
    var subTxt = sub.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
    var labelOpcoes = it.selecoesLabel
      ? '<div class="selecoes">' + escapar(it.selecoesLabel) + '</div>'
      : '';
    return '<div class="item-linha">' +
      '<div class="qtd-x">' + (it.qtd||1) + 'x</div>' +
      '<div style="flex:1;">' +
        '<div class="nome">' + escapar(it.nome||'') + '</div>' +
        labelOpcoes +
      '</div>' +
      '<div class="preco">R$ ' + subTxt + '</div>' +
    '</div>';
  }).join('');

  var totalTxt = (p.total||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});

  document.getElementById('detalhe').innerHTML =
    '<div class="detalhe-cab">' +
      '<div class="senha-grande">#' + (p.senha||'?') + '</div>' +
      '<div class="info">' +
        '<div class="lbl">Pedido recebido às</div>' +
        '<div class="hora">' + hora + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="detalhe-itens">' + itensHtml + '</div>' +
    '<div class="detalhe-rodape">' +
      '<div class="total-linha">' +
        '<span class="total-lbl">Total a receber</span>' +
        '<span class="total-val">R$ ' + totalTxt + '</span>' +
      '</div>' +
      '<div class="btns-rodape">' +
        '<button class="btn-cancelar" onclick="cancelarPedido(\'' + p.id + '\',' + (p.senha||0) + ')">Cancelar</button>' +
        '<button class="btn-editar" onclick="abrirEdicaoPedido(\'' + p.id + '\')">✏️ Editar</button>' +

function confirmarLiberar(id, senha){
  var p = _pedidos.find(function(x){ return x.id === id; });
  if(!p) return;
  // Forma de pagamento é opcional, mas se o caixa quer recibo precisa selecionar
  if(_reciboSelecionado && !_pagtoSelecionado){
    mostrarToast('Selecione a forma de pagamento pra emitir o recibo', '#f87171');
    return;
  }
  if(_notaSelecionada && !_pagtoSelecionado){
    mostrarToast('Selecione a forma de pagamento pra emitir a nota fiscal', '#f87171');
    return;
  }
  var _querNota = _notaSelecionada, _formaNota = _pagtoSelecionado;

  var btn = document.getElementById('btn-confirmar-liberar');
  if(btn){ btn.disabled = true; btn.textContent = 'Liberando...'; }

  // 1. ENRIQUECE cada item com sua categoria
  enriquecerItensComCategoria(p.itens || []).then(function(itensEnriquecidos){
    // 2. Cria um doc na coleção "pedidos" — o PDV escuta e dispara impressão automática
    var pedidoImpressao = {
      garcom: 'Totem',
      mesa: null,
      restauranteId: _restauranteId,
      tenantId: _tenantId,
      contaId: null,
      tipoConta: 'totem',
      cliente: 'Totem #' + senha,
      senhaTotem: senha,
      status: 'preparo',
      criadoEm: Date.now(),
      itens: itensEnriquecidos,
      total: p.total||0,
      imprimir: true,
      origemTotem: true,
      pedidoTotemId: id,
      // Novos campos: forma de pagamento + recibo
      formaPagamento: _pagtoSelecionado || '',
      imprimirRecibo: !!_reciboSelecionado,
      // a senha já saiu na hora do pedido (modo com caixa) → não imprime de novo
      pularCupomCliente: p.senhaImpressa === true
    };

    return fbDb.collection('pedidos').add(pedidoImpressao);
  })
  .then(function(){
    // 3. Marca pedido_totem como pago (com forma de pagamento)
    return fbDb.collection('tenants').doc(_tenantId)
      .collection('restaurantes').doc(_restauranteId)
      .collection('pedidos_totem').doc(id)
      .update({
        status:'pago',
        pagoEm: Date.now(),
        formaPagamento: _pagtoSelecionado || '',
        reciboImpresso: !!_reciboSelecionado
      });
  })
  .then(function(){
    mostrarToast('✓ Senha #' + senha + ' liberada!', '#22c55e');
    _selecionadoId = null;
    renderDetalheVazio();
    fecharModalLiberar();
    if(_querNota) abrirNfceTotem(Object.assign({}, p, { id:id, senha:senha, formaPagamento:_formaNota, status:'pago' }));
  })
  .catch(function(e){
    console.error('[CAIXA] liberar:', e);
    mostrarToast('Erro ao liberar: ' + (e.message||e.code), '#f87171');
    if(btn){ btn.disabled = false; btn.textContent = '✓ Liberar pra cozinha'; }
  });
}

// Busca a categoria de cada item conforme sua fonte (totem ou principal)
// e retorna a lista pronta pra criar em "pedidos"
function enriquecerItensComCategoria(itens){
  var base = fbDb.collection('tenants').doc(_tenantId)
    .collection('restaurantes').doc(_restauranteId);

  // Separa por fonte
  var idsTotem = [];
  var idsPrincipal = [];
  itens.forEach(function(it){
    if(it.fonte === 'totem') idsTotem.push(it.id);
    else idsPrincipal.push(it.id);
  });

  // Busca em paralelo os 2 cardápios (só os itens necessários)
  var promessas = [];
  var mapaItensTotem = {};
  var mapaItensPrincipal = {};

  if(idsTotem.length){
    promessas.push(
      base.collection('cardapio_totem').doc('data').collection('itens').get()
        .then(function(snap){
          snap.forEach(function(d){
            if(idsTotem.indexOf(d.id) >= 0){
              mapaItensTotem[d.id] = d.data();
            }
          });
        })
        .catch(function(e){ console.warn('[CAIXA] cardapio_totem itens:', e.code); })
    );
  }
  if(idsPrincipal.length){
    promessas.push(
      base.collection('cardapio').doc('data').collection('itens').get()
        .then(function(snap){
          snap.forEach(function(d){
            if(idsPrincipal.indexOf(d.id) >= 0){
              mapaItensPrincipal[d.id] = d.data();
            }
          });
        })
        .catch(function(e){ console.warn('[CAIXA] cardapio itens:', e.code); })
    );
  }

  return Promise.all(promessas).then(function(){
    return itens.map(function(it){
      var item = {
        id: it.id,
        nome: it.nome,
        preco: it.preco,
        precoBase: it.precoBase || it.preco,
        qtd: it.qtd,
        obs: it.selecoesLabel || '',
        selecoes: [],
        cozinhaCriadoEm: Date.now()
      };
      // Marca origem + categorias pra o filtro do PDV funcionar
      if(it.fonte === 'totem'){
        item.origemTotem = true;
        var def = mapaItensTotem[it.id];
        if(def){
          item.categoriaTotemId = def.categoriaId || '';
        }
      } else {
        var def2 = mapaItensPrincipal[it.id];
        if(def2){
          item.categoriaPrincipalId = def2.categoria || '';
        }
      }
      return item;
    });
  });
}

// Carrega cardápio (totem + principal) — chamado uma vez na 1ª edição
function carregarCardapioParaEdicao(){
  if(_cardapioCarregado) return Promise.resolve();
  var base = fbDb.collection('tenants').doc(_tenantId)
    .collection('restaurantes').doc(_restauranteId);

  var promessas = [];

  // Totem
  promessas.push(base.collection('cardapio_totem').doc('data').collection('categorias').get()
    .then(function(s){ var arr = []; s.forEach(function(d){ arr.push(Object.assign({id:d.id, fonte:'totem'}, d.data())); }); arr.sort(function(a,b){ return (a.ordem||0)-(b.ordem||0); }); _cardapioTotem.cats = arr; }));
  promessas.push(base.collection('cardapio_totem').doc('data').collection('itens').get()
    .then(function(s){ var arr = []; s.forEach(function(d){ var v = d.data(); if(v.ativo === false) return; arr.push(Object.assign({id:d.id, fonte:'totem'}, v)); }); _cardapioTotem.itens = arr; }));
  promessas.push(base.collection('cardapio_totem').doc('data').collection('grupos_opcoes').get()
    .then(function(s){ var arr = []; s.forEach(function(d){ arr.push(Object.assign({id:d.id, fonte:'totem'}, d.data())); }); _cardapioTotem.grupos = arr; }));

  // Principal
  promessas.push(base.collection('cardapio').doc('data').collection('categorias').get()
    .then(function(s){ var arr = []; s.forEach(function(d){ arr.push(Object.assign({id:d.id, fonte:'principal'}, d.data())); }); _cardapioPrincipal.cats = arr; }));
  promessas.push(base.collection('cardapio').doc('data').collection('itens').get()
    .then(function(s){ var arr = []; s.forEach(function(d){ var v = d.data(); if(v.disponivel === false) return; arr.push(Object.assign({id:d.id, fonte:'principal'}, v)); }); _cardapioPrincipal.itens = arr; }));
  promessas.push(base.collection('cardapio').doc('data').collection('grupos_opcoes').get()
    .then(function(s){ var arr = []; s.forEach(function(d){ arr.push(Object.assign({id:d.id, fonte:'principal'}, d.data())); }); _cardapioPrincipal.grupos = arr; }));

  // Config do totem — lê quais categorias do principal foram selecionadas
  promessas.push(base.collection('cardapio_totem').doc('config').get()
    .then(function(doc){
      _catsPrincipaisSelecionadas = doc.exists ? (doc.data().categoriasPrincipais || []) : [];
    }).catch(function(){ _catsPrincipaisSelecionadas = []; }));

  return Promise.all(promessas).then(function(){ _cardapioCarregado = true; });
}

        '</div>' +

          '<div style="font-size:0.74rem;color:var(--muted);">R$ ' + precoUnitTxt + ' un.</div>' +

          '<div style="font-weight:700;color:var(--accent);">R$ ' + subTxt + '</div>' +

    '</div>';
  }).join('');

}

function alterarQtdEdit(idx, delta){
  if(idx < 0 || idx >= _editandoItens.length) return;
  _editandoItens[idx].qtd = Math.max(1, (_editandoItens[idx].qtd||1) + delta);
  renderEditItens();
}

function removerItemEdit(idx){
  if(idx < 0 || idx >= _editandoItens.length) return;
  if(!confirm('Remover "' + (_editandoItens[idx].nome||'item') + '" do pedido?')) return;
  _editandoItens.splice(idx, 1);
  renderEditItens();
}

function atualizarObsEdit(idx, valor){
  if(idx < 0 || idx >= _editandoItens.length) return;
  _editandoItens[idx].obs = valor;
  _editandoItens[idx].selecoesLabel = valor; // pra aparecer no detalhe e impressão
}

function atualizarTotalEdicao(){
  var t = _editandoItens.reduce(function(s,it){ return s + (it.preco||0) * (it.qtd||1); }, 0);
  var el = document.getElementById('edit-total');
  if(el) el.textContent = 'R$ ' + t.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

// Som de alerta quando chega pedido novo (Web Audio — 2 bips)
function tocarSomNovo(){
  if(!_somDesbloqueado) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    var ctx = new AC();
    function bip(t, freq){
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0, ctx.currentTime + t);
      g.gain.linearRampToValueAtTime(0.3, ctx.currentTime + t + 0.02);
      g.gain.linearRampToValueAtTime(0, ctx.currentTime + t + 0.18);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + 0.2);
    }
    bip(0, 880);
    bip(0.22, 1175);
  }catch(e){}
}

}

//  RELATÓRIO DO TURNO (Histórico → 📊 Relatório) — mostra e imprime
// ════════════════════════════════════════
var _relCx = null;
function _relHoraMin(hhmm){ var p = String(hhmm||'').split(':'); return (parseInt(p[0],10)||0) * 60 + (parseInt(p[1],10)||0); }
function _relCalcular(deHHMM, ateHHMM){
  var de = _relHoraMin(deHHMM), ate = _relHoraMin(ateHHMM);
  var noTurno = function(p){
    var ts = p.pagoEm || p.criadoEm; if(!ts) return true;
    var d = new Date(ts), m = d.getHours() * 60 + d.getMinutes();
    return de <= ate ? (m >= de && m <= ate) : (m >= de || m <= ate); // turno que vira a meia-noite
  };
  var lista = (_historicoPedidos || []).filter(noTurno);
  var pagos = lista.filter(function(p){ return p.status === 'pago'; });
  var r = { qtd: pagos.length, total: 0, totem: {qtd:0, total:0}, buffet: {qtd:0, total:0}, formas: {}, notas: {qtd:0, total:0},
    cancelados: {qtd:0, total:0}, aguardando: {qtd:0, total:0}, itens: {} };
  pagos.forEach(function(p){
    var v = Number(p.total) || 0; r.total += v;
    var tp = p.tipo === 'buffet' ? r.buffet : r.totem; tp.qtd++; tp.total += v;
    var f = p.formaPagamento || 'sem'; r.formas[f] = (r.formas[f] || 0) + v;
    if(p.nfce && p.nfce.status === 'autorizado'){ r.notas.qtd++; r.notas.total += Number(p.nfce.total) || v; }
    (p.itens || []).forEach(function(it){ var k = it.nome || 'Item'; r.itens[k] = (r.itens[k] || 0) + (Number(it.qtd) || 1); });
  });
  lista.forEach(function(p){
    if(p.status === 'cancelado'){ r.cancelados.qtd++; r.cancelados.total += Number(p.total) || 0; }
    else if(p.status !== 'pago'){ r.aguardando.qtd++; r.aguardando.total += Number(p.total) || 0; }
  });
  r.ticket = r.qtd ? r.total / r.qtd : 0;
  r.topItens = Object.keys(r.itens).map(function(k){ return [k, r.itens[k]]; }).sort(function(a,b){ return b[1] - a[1]; });
  return r;
}

function imprimirRelatorioCaixa(){

  if(formas.length){ L.push('--'); L.push('#S POR FORMA DE PAGAMENTO'); formas.forEach(function(k){ L.push(nomes[k] + '|R$ ' + brl(r.formas[k])); }); }

  L.push('--'); L.push('#S OUTROS');

  L.push('Cancelados (' + r.cancelados.qtd + ')|R$ ' + brl(r.cancelados.total));
  if(r.aguardando.qtd) L.push('Nao pagos (' + r.aguardando.qtd + ')|R$ ' + brl(r.aguardando.total));

function fecharHistorico(){
  if(_historicoUnsub){ _historicoUnsub(); _historicoUnsub = null; }
  var m = document.getElementById('modal-historico');
  if(m) m.remove();
}

function trocarDataHistorico(data){
  _historicoData = data;
  var lbl = document.getElementById('hist-data-lbl');
  if(lbl) lbl.textContent = _formatarDataLbl(data);
  escutarHistorico(data);
}

function filtrarHistorico(termo){
  _historicoBusca = (termo||'').trim().toLowerCase();
  renderHistoricoLista();
}

function _formatarDataLbl(dataIso){
  try{
    var partes = dataIso.split('-');
    var d = new Date(parseInt(partes[0]), parseInt(partes[1])-1, parseInt(partes[2]));
    var hoje = new Date(); hoje.setHours(0,0,0,0);
    var diff = Math.round((hoje - d) / 86400000);
    var sufixo = '';
    if(diff === 0) sufixo = ' (Hoje)';
    else if(diff === 1) sufixo = ' (Ontem)';
    else {
      var dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
      sufixo = ' (' + dias[d.getDay()] + ')';
    }
    return d.toLocaleDateString('pt-BR') + sufixo;
  }catch(e){ return dataIso; }
}

function escutarHistorico(data){
  if(_historicoUnsub) _historicoUnsub();
  _historicoPedidos = [];
  var refBase = fbDb.collection('tenants').doc(_tenantId)
    .collection('restaurantes').doc(_restauranteId)
    .collection('pedidos_totem');
  _historicoUnsub = refBase.where('data','==',data)
    .onSnapshot(function(snap){
      _historicoPedidos = [];
      snap.forEach(function(d){ _historicoPedidos.push(Object.assign({id:d.id}, d.data())); });
      _historicoPedidos.sort(function(a,b){
        return (b.pagoEm || b.criadoEm || 0) - (a.pagoEm || a.criadoEm || 0);
      });
      atualizarResumoHistorico();
      renderHistoricoLista();
    }, function(e){
      console.error('[HIST] erro:', e);
      var lista = document.getElementById('hist-lista');
      if(lista) lista.innerHTML = '<div style="text-align:center;color:#f87171;padding:30px;">Erro: ' + (e.code||e.message) + '</div>';
    });
}

function atualizarResumoHistorico(){

  var pagos = _historicoPedidos.filter(function(p){ return p.status === 'pago'; });

  var totalGeral = pagos.reduce(function(s,p){ return s + (p.total||0); }, 0);
  var porForma = { dinheiro:0, pix:0, debito:0, credito:0, '':0 };
  pagos.forEach(function(p){
    var f = p.formaPagamento || '';

    porForma[f] += p.total||0;
  });
  var fmt = function(v){ return 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); };
  resumo.innerHTML =
    '<div style="display:flex;align-items:baseline;gap:14px;margin-bottom:10px;">' +
      '<div style="flex:1;">' +
        '<div style="font-size:0.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">Faturado no dia</div>' +
        '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:1.9rem;color:var(--accent);line-height:1.1;">' + fmt(totalGeral) + '</div>' +
      '</div>' +
      '<div style="text-align:right;">' +
        '<div style="font-size:1.1rem;font-weight:700;">' + pagos.length + '</div>' +
        '<div style="font-size:0.72rem;color:var(--muted);">pedidos pagos</div>' +
        (cancelados.length ? '<div style="font-size:0.72rem;color:#f87171;margin-top:2px;">' + cancelados.length + ' cancelado' + (cancelados.length>1?'s':'') + '</div>' : '') +
      '</div>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:0.82rem;">' +
      '<div style="background:var(--bg);padding:7px 10px;border-radius:7px;display:flex;justify-content:space-between;"><span>💵 Dinheiro</span><b>' + fmt(porForma.dinheiro) + '</b></div>' +
      '<div style="background:var(--bg);padding:7px 10px;border-radius:7px;display:flex;justify-content:space-between;"><span>📱 Pix</span><b>' + fmt(porForma.pix) + '</b></div>' +
      '<div style="background:var(--bg);padding:7px 10px;border-radius:7px;display:flex;justify-content:space-between;"><span>💳 Débito</span><b>' + fmt(porForma.debito) + '</b></div>' +
      '<div style="background:var(--bg);padding:7px 10px;border-radius:7px;display:flex;justify-content:space-between;"><span>💳 Crédito</span><b>' + fmt(porForma.credito) + '</b></div>' +
      (porForma[''] > 0 ? '<div style="grid-column:span 2;background:var(--bg);padding:7px 10px;border-radius:7px;display:flex;justify-content:space-between;color:var(--muted);"><span>Sem forma de pagamento</span><b>' + fmt(porForma['']) + '</b></div>' : '') +
    '</div>';
}

function renderHistoricoLista(){
  var lista = document.getElementById('hist-lista');
  if(!lista) return;
  var filtrados = _historicoPedidos;
  if(_historicoBusca){
    filtrados = _historicoPedidos.filter(function(p){
      return String(p.senha || '').indexOf(_historicoBusca) >= 0;
    });
  }
  if(!filtrados.length){
    lista.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px 20px;">' +
      (_historicoBusca ? 'Nenhuma senha #' + _historicoBusca + ' encontrada nesse dia' : 'Nenhum pedido nesse dia') +
    '</div>';
    return;
  }
  lista.innerHTML = filtrados.map(function(p){
    var hora = p.pagoEm ? new Date(p.pagoEm).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) :
               (p.criadoEm ? new Date(p.criadoEm).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : '');
    var totalTxt = (p.total||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
    var corBorda, statusLbl, statusCor;
    if(p.status === 'pago'){
      corBorda = 'var(--verde)';
      statusLbl = '✓ Pago';
      statusCor = 'var(--verde)';
    } else if(p.status === 'cancelado'){
      corBorda = '#f87171';
      statusLbl = '✕ Cancelado';
      statusCor = '#f87171';
    } else {
      corBorda = 'var(--accent)';
      statusLbl = '⏳ Aguardando';
      statusCor = 'var(--accent)';
    }
    var formaLbl = '';
    if(p.formaPagamento){
      var nomes = { dinheiro:'💵 Dinheiro', pix:'📱 Pix', debito:'💳 Débito', credito:'💳 Crédito' };
      formaLbl = '<span style="font-size:0.74rem;color:var(--muted);margin-left:8px;">• ' + (nomes[p.formaPagamento] || p.formaPagamento) + '</span>';
    }
    var itensResumo = (p.itens||[]).map(function(it){ return (it.qtd||1) + 'x ' + it.nome; }).join(', ');
    if(itensResumo.length > 80) itensResumo = itensResumo.substring(0, 80) + '...';

    return '<div onclick="abrirDetalheHistorico(\'' + p.id + '\')" style="background:var(--surface);border:1px solid var(--border);border-left:4px solid ' + corBorda + ';border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;">' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">' +
        '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:1.6rem;color:var(--accent);line-height:1;">#' + (p.senha||'?') + '</div>' +
        '<div style="flex:1;">' +
          '<div style="font-size:0.78rem;color:' + statusCor + ';font-weight:700;">' + statusLbl + formaLbl + '</div>' +
          '<div style="font-size:0.72rem;color:var(--muted);">' + hora + '</div>' +
        '</div>' +
        '<div style="font-weight:700;color:var(--accent);font-size:1.05rem;">R$ ' + totalTxt + '</div>' +
      '</div>' +
      '<div style="font-size:0.78rem;color:var(--muted);line-height:1.3;">' + escapar(itensResumo) + '</div>' +
    '</div>';
  }).join('');
}

function confirmarBuffetCaixa(){
  var msg = document.getElementById('buf-cx-msg'), btn = document.getElementById('buf-cx-btn');
  var bruto = String(document.getElementById('buf-cx-valor').value || '').trim();
  // aceita "35,90", "35.90" e "1.035,90"
  var v = bruto.indexOf(',') >= 0 ? bruto.replace(/\./g,'').replace(',', '.') : bruto;
  var valor = Math.round((parseFloat(v) || 0) * 100) / 100;
  if(!(valor > 0)){ msg.innerHTML = '<div style="color:#f87171;font-size:0.86rem;">Digite o valor do buffet.</div>'; return; }
  if(valor > 5000){ msg.innerHTML = '<div style="color:#f87171;font-size:0.86rem;">Valor muito alto — confira.</div>'; return; }
  if(!_bufCxForma){ msg.innerHTML = '<div style="color:#f87171;font-size:0.86rem;">Escolha a forma de pagamento.</div>'; return; }
  btn.disabled = true; btn.textContent = 'Lançando...';
  var agora = Date.now(), hoje = _dataHoje();
  var base = fbDb.collection('tenants').doc(_tenantId).collection('restaurantes').doc(_restauranteId);
  var ref = base.collection('pedidos_totem').doc();
  // número sequencial do buffet no dia (B1, B2…) só pra identificar no histórico
  var refSeq = base.collection('senhas_totem').doc(hoje + '_buffet');
  fbDb.runTransaction(function(tx){
    return tx.get(refSeq).then(function(d){
      var n = ((d.exists && d.data().ultima) || 0) + 1;
      tx.set(refSeq, { ultima: n, atualizadoEm: agora }, { merge: true });
      var pedido = {
        senha: 'B' + n, data: hoje, tipo: 'buffet', origemCaixa: true,
        itens: [{ id: 'buffet', nome: 'Buffet', preco: valor, precoBase: valor, qtd: 1 }],
        total: valor, status: 'pago', formaPagamento: _bufCxForma,
        criadoEm: agora, pagoEm: agora, reciboImpresso: false
      };
      tx.set(ref, pedido);
      return pedido;
    });
  }).then(function(pedido){
    var m = document.getElementById('modal-buffet-cx'); if(m) m.remove();
    mostrarToast('✓ Buffet ' + pedido.senha + ' — R$ ' + valor.toLocaleString('pt-BR', {minimumFractionDigits:2}) + ' lançado', '#22c55e');
    if(_bufCxNota) abrirNfceTotem(Object.assign({ id: ref.id }, pedido));
  }).catch(function(e){
    btn.disabled = false; btn.textContent = '✓ Lançar venda';
    msg.innerHTML = '<div style="color:#f87171;font-size:0.86rem;">Erro ao lançar: ' + escapar(e.message || e.code || '') + '</div>';
  });
}

var _nfceTotem = null, _nfceTotemForma = '';
var _NFCE_FORMAS_CX = [['dinheiro','💵 Dinheiro'],['pix','📱 Pix'],['debito','💳 Débito'],['credito','💳 Crédito']];

// ── Nota em PDF (gerada no aparelho) e compartilhada no WhatsApp ──
function _nfceScript(src, globo){
  if(window[globo]) return Promise.resolve();
  return new Promise(function(ok, falha){
    var sc = document.createElement('script'); sc.src = src;
    sc.onload = ok; sc.onerror = function(){ falha(new Error('Sem internet pra gerar o PDF.')); };
    document.head.appendChild(sc);
  });
}
function _nfceLibsPdf(){
  return Promise.all([
    _nfceScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'jspdf'),
    _nfceScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js', 'QRCode')
  ]);
}
function _nfceQrPng(txt){
  var d = document.createElement('div'); d.style.cssText = 'position:absolute;left:-9999px;top:0;';
  document.body.appendChild(d);
  try{ new QRCode(d, { text: txt, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M }); }catch(e){ d.remove(); return ''; }
  var c = d.querySelector('canvas'), url = c ? c.toDataURL('image/png') : '';
  d.remove(); return url;
}
// Monta o DANFE NFC-e em 80 mm (mesmo conteúdo do cupom impresso) — síncrono, pra não perder o toque no "compartilhar"
function _nfcePdfBlob(n){
  var i = n.impressao || {}, W = 80, M = 4, LW = W - 2 * M;
  var FORMAS = {'01':'Dinheiro','03':'Cartão de Crédito','04':'Cartão de Débito','10':'Vale Alimentação','11':'Vale Refeição','17':'PIX','99':'Outros'};
  function brl(v){ return (Number(v)||0).toFixed(2).replace('.', ','); }
  function dt(iso){ if(!iso) return ''; var x = new Date(iso); return isNaN(x) ? iso : x.toLocaleString('pt-BR', { timeZone:'America/Sao_Paulo' }); }
  var qr = _nfceQrPng(i.qrCode || n.qrcodeUrl || '');
  function desenhar(doc){
    var y = M + 2;
    function fonte(t, negrito){ doc.setFontSize(t); doc.setFont('helvetica', negrito ? 'bold' : 'normal'); }
    function linha(){ doc.setLineDashPattern([0.6, 0.6], 0); doc.line(M, y, W - M, y); doc.setLineDashPattern([], 0); y += 3; }
    function centro(txt, t, neg){ fonte(t || 7.5, neg); doc.splitTextToSize(String(txt), LW).forEach(function(l){ doc.text(l, W / 2, y, { align:'center' }); y += (t || 7.5) * 0.42; }); }
    function esq(txt, t, neg){ fonte(t || 7.5, neg); doc.splitTextToSize(String(txt), LW).forEach(function(l){ doc.text(l, M, y); y += (t || 7.5) * 0.42; }); }
    function par(a, b, t, neg){ fonte(t || 7.5, neg); doc.text(String(a), M, y); doc.text(String(b), W - M, y, { align:'right' }); y += (t || 7.5) * 0.42; }
    centro(i.emitNome || 'EMITENTE', 8.5, true);
    var cnpj = String(i.emitCnpj||'').replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
    centro('CNPJ ' + cnpj + (i.emitIe ? '   IE ' + i.emitIe : ''));
    if(i.emitEndereco) centro(i.emitEndereco);
    if(i.emitCidade) centro(i.emitCidade);
    y += 1; linha();
    centro('Documento Auxiliar da Nota Fiscal de Consumidor Eletrônica', 7.5, true);
    y += 1; linha();
    par('Descrição', 'Valor', 7, true);
    (i.itens||[]).forEach(function(it, k){
      esq(('00' + (k + 1)).slice(-3) + '  ' + it.desc, 7.5);
      par('      ' + it.qtd + ' ' + (it.un||'UN') + ' x ' + brl(it.unit), brl(it.total), 7.5);
    });
    y += 1; linha();
    par('Qtd. total de itens', String((i.itens||[]).length));
    if(Number(i.servico) > 0){ par('Valor total dos produtos R$', brl(i.produtos)); par('Acréscimos (taxa de serviço) R$', brl(i.servico)); }
    par('Valor a pagar R$', brl(n.total), 9, true);
    par('FORMA DE PAGAMENTO', 'VALOR PAGO R$', 7, true);
    (i.pagamentos||[]).forEach(function(p){ par(FORMAS[p.forma] || p.forma, brl(p.valor)); });
    y += 1; linha();
    if(n.ambiente === 'homologacao'){ centro('EMITIDA EM AMBIENTE DE HOMOLOGAÇÃO — SEM VALOR FISCAL', 7.5, true); y += 1; }
    centro('Consulte pela Chave de Acesso em', 7.5, true);
    centro(i.urlChave || n.consultaUrl || '', 7);
    centro(String(n.chave||'').replace(/\D/g,'').replace(/(\d{4})(?=\d)/g, '$1 '), 7.5);
    y += 1; linha();
    var d = String(n.documento||'');
    centro(d ? 'CONSUMIDOR ' + (d.length === 11 ? 'CPF: ' + d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4') : 'CNPJ: ' + d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5')) : 'CONSUMIDOR NÃO IDENTIFICADO', 7.5, true);
    centro('NFC-e nº ' + ('000000000' + (n.numero||'')).slice(-9) + '  Série ' + ('00' + (n.serie||'')).slice(-3) + '  ' + dt(i.dataEmissao), 7.5, true);
    if(i.protocolo) centro('Protocolo de autorização: ' + i.protocolo);
    if(i.dataAutorizacao) centro('Data de autorização: ' + dt(i.dataAutorizacao));
    if(qr){ y += 2; doc.addImage(qr, 'PNG', (W - 38) / 2, y, 38, 38); y += 42; }
    if(Number(i.tributos) > 0) centro('Tributos totais incidentes (Lei Federal 12.741/2012): R$ ' + brl(i.tributos), 6.5);
    return y + M;
  }
  var medida = new jspdf.jsPDF({ unit:'mm', format:[W, 600] });
  var H = Math.max(80, Math.ceil(desenhar(medida)));
  var doc = new jspdf.jsPDF({ unit:'mm', format:[W, H] });
  desenhar(doc);
  return doc.output('blob');
}
function _htmlNfceWhats(){
  _nfceLibsPdf().catch(function(){}); // já deixa as bibliotecas prontas pro toque
  return '<button onclick="_nfceEnviarPdf(this)" style="margin-top:12px;width:100%;background:#25d366;color:#fff;border:none;border-radius:10px;padding:13px;font-weight:800;font-size:0.92rem;cursor:pointer;font-family:inherit;">📄 Enviar nota em PDF</button>';
}
function _nfceEnviarPdf(btn){
  var n = window._nfceWhatsAtual; if(!n) return;
  var txtBtn = btn ? btn.textContent : '';
  function pronto(){ if(btn){ btn.disabled = false; btn.textContent = txtBtn; } }
  if(btn){ btn.disabled = true; btn.textContent = 'Gerando PDF…'; }
  _nfceLibsPdf().then(function(){
    var blob = _nfcePdfBlob(n);
    var nome = 'NFCe-' + (n.numero || 'nota') + '.pdf';
    var file = new File([blob], nome, { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      return navigator.share({ files:[file] }).then(pronto, function(e){
        pronto();
        if(e && e.name === 'AbortError') return; // fechou o compartilhar
        _nfceBaixar(blob, nome);
      });
    }
    _nfceBaixar(blob, nome); pronto();
  }).catch(function(e){ pronto(); alert('Não consegui gerar o PDF: ' + (e && e.message || e)); });
}
function _nfceBaixar(blob, nome){
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 60000);
  alert('Este aparelho não abre o compartilhar com arquivo — o PDF foi baixado (' + nome + '). Anexe ele na conversa do WhatsApp.');
}

  if(just.length < 15){ msg.innerHTML = '<div style="color:#f87171;font-size:0.84rem;">O motivo precisa ter pelo menos 15 letras.</div>'; return; }

  msg.innerHTML = '<div style="color:var(--muted);font-size:0.84rem;">Enviando para a SEFAZ…</div>';
  fetch('/api/nfce', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ acao:'cancelar', origem:'totem', tenantId:_tenantId, restauranteId:_restauranteId, pedidoId:p.id, justificativa:just, senhaGerente:senha, garcom:'Caixa' })
  }).then(function(r){ return r.json(); }).then(function(j){
    if(j.ok && j.nfce){
      p.nfce = j.nfce;
      var m = document.getElementById('modal-cancel-nfce'); if(m) m.remove();
      var bl = document.getElementById('hist-nfce-bloco'); if(bl) bl.innerHTML = _htmlNfceTotem(p);
      mostrarToast('✓ NFC-e nº ' + (j.nfce.numero || '') + ' cancelada', '#22c55e');
      return;
    }
    btn.disabled = false; btn.textContent = '✖ Cancelar nota';
    msg.innerHTML = '<div style="background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.3);color:#f87171;border-radius:10px;padding:10px;font-size:0.82rem;line-height:1.4;">❌ ' + escapar(j.error || 'Não foi possível cancelar') + '</div>';
  }).catch(function(){
    btn.disabled = false; btn.textContent = '✖ Cancelar nota';
    msg.innerHTML = '<div style="color:#f87171;font-size:0.84rem;">Sem conexão com o servidor. A nota não foi cancelada.</div>';
  });
}
function abrirNfceTotemPorId(id){

}

        '<button onclick="document.getElementById(\'modal-nfce-totem\').remove()" style="background:rgba(255,255,255,0.08);border:none;color:var(--text);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.3rem;">×</button>'+

        '<input id="nfce-totem-doc" inputmode="numeric" autocomplete="off" placeholder="Deixe vazio se o cliente não quiser" oninput="_nfceTotemMascara(this, event)" onblur="_nfceTotemMascara(this, null, true)" style="width:100%;box-sizing:border-box;background:var(--surface2);border:1.5px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font-size:1.05rem;font-family:inherit;outline:none;">'+
        '<div id="nfce-totem-doc-tipo" style="font-size:0.76rem;color:var(--muted);margin:5px 0 14px;">Sem CPF/CNPJ (consumidor não identificado)</div>'+
        '<div style="font-size:0.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">Forma de pagamento</div>'+

          return '<button class="opt-pagto opt-nfce-forma' + (_nfceTotemForma === f[0] ? ' selecionado' : '') + '" data-f="' + f[0] + '" onclick="_nfceTotemForma=\'' + f[0] + '\';document.querySelectorAll(\'.opt-nfce-forma\').forEach(function(b){b.classList.toggle(\'selecionado\',b.getAttribute(\'data-f\')===\'' + f[0] + '\');})">' + f[1] + '</button>';

        '<button id="nfce-totem-btn" onclick="emitirNfceTotem()" style="flex:1.4;padding:13px;background:var(--accent);border:none;color:#000;border-radius:10px;font-weight:800;cursor:pointer;font-family:inherit;">🧾 Emitir</button>'+

function _docCpfOk(c){ if(c.length !== 11 || /^(\d)\1+$/.test(c)) return false; for(var t = 9; t < 11; t++){ var s = 0; for(var i = 0; i < t; i++) s += +c[i] * (t + 1 - i); if(((s * 10) % 11) % 10 !== +c[t]) return false; } return true; }
function _docCnpjOk(c){ if(c.length !== 14 || /^(\d)\1+$/.test(c)) return false; function calc(n){ var s = 0, p = n - 7; for(var i = 0; i < n; i++){ s += +c[i] * p--; if(p < 2) p = 9; } var r = s % 11; return r < 2 ? 0 : 11 - r; } return calc(12) === +c[12] && calc(13) === +c[13]; }
function _docFormatar(d){
  return d.length <= 11
    ? d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d{1,2})$/,'.$1-$2')
    : d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2}).*/,'$1.$2.$3/$4-$5').replace(/\D+$/,'');
}
// '' = vazio (ok) · 'ok' = válido · 'parcial' = digitando · 'invalido'
function _docSituacao(d){
  if(!d) return '';
  if(d.length === 11) return _docCpfOk(d) ? 'ok' : (d.length < 14 ? 'invalido11' : 'invalido');
  if(d.length === 14) return _docCnpjOk(d) ? 'ok' : 'invalido';
  return 'parcial';
}
function _docRotulo(d){
  var s = _docSituacao(d);
  if(s === '') return ['Sem CPF/CNPJ (consumidor não identificado)', 'var(--muted)'];
  if(s === 'ok') return [(d.length === 11 ? 'CPF' : 'CNPJ') + ' válido ✓', '#4ade80'];
  if(s === 'invalido11') return ['CPF inválido — confira os números (se for CNPJ, continue digitando)', '#f87171'];
  if(s === 'invalido') return [(d.length === 11 ? 'CPF' : 'CNPJ') + ' inválido — confira os números', '#f87171'];
  return [d.length < 11 ? 'CPF: faltam ' + (11 - d.length) + ' números' : 'CNPJ: faltam ' + (14 - d.length) + ' números', 'var(--muted)'];
}
function _nfceTotemMascara(el, ev, final){
  var d = el.value.replace(/\D/g,'').slice(0,14);
  var antes = el.getAttribute('data-d') || '';
  var apagando = ev && ev.inputType && ev.inputType.indexOf('delete') === 0;
  // apagou só um ponto/traço/barra: apaga o número de antes também (senão a máscara põe o sinal de volta)
  if(apagando && d === antes && d.length) d = d.slice(0, -1);
  el.value = _docFormatar(d);
  el.setAttribute('data-d', d);
  var t = document.getElementById('nfce-totem-doc-tipo'), r = _docRotulo(d);
  if(t){ t.textContent = r[0]; t.style.color = r[1]; }
  el.style.borderColor = /invalido/.test(_docSituacao(d)) ? '#f87171' : (_docSituacao(d) === 'ok' ? '#4ade80' : 'var(--border)');
}
function emitirNfceTotem(){
  var p = _nfceTotem; if(!p) return;
  var msg = document.getElementById('nfce-totem-msg'), btn = document.getElementById('nfce-totem-btn');
  var doc = (document.getElementById('nfce-totem-doc').value||'').replace(/\D/g,'');
  var sit = _docSituacao(doc);
  if(sit === 'parcial'){ msg.innerHTML = '<div style="color:#f87171;font-size:0.84rem;">CPF tem 11 números e CNPJ tem 14.</div>'; return; }
  if(/invalido/.test(sit)){ msg.innerHTML = '<div style="color:#f87171;font-size:0.84rem;">' + (doc.length === 11 ? 'CPF' : 'CNPJ') + ' inválido — confira os números com o cliente (ou apague pra emitir sem).</div>'; return; }
  if(!_nfceTotemForma){ msg.innerHTML = '<div style="color:#f59e0b;font-size:0.84rem;">Escolha a forma de pagamento.</div>'; return; }
  btn.disabled = true; btn.textContent = 'Emitindo...';
  msg.innerHTML = '<div style="color:var(--muted);font-size:0.84rem;">Enviando para a SEFAZ…</div>';
  fetch('/api/nfce', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ acao:'emitir', origem:'totem', tenantId:_tenantId, restauranteId:_restauranteId, pedidoId:p.id, documento:doc, formaPagamento:_nfceTotemForma, garcom:'Caixa' })
  }).then(function(r){ return r.json(); }).then(function(j){
    if(j.ok && j.nfce){
      p.nfce = j.nfce;
      if(!j.jaEmitida) _enviarImpressaoNfce(p);
      document.getElementById('nfce-totem-corpo').innerHTML = '<div style="text-align:center;padding:8px 0;"><div style="font-size:2.2rem;">✅</div><div style="font-weight:800;font-size:1.05rem;margin:6px 0;">NFC-e nº ' + escapar(j.nfce.numero) + ' ' + (j.jaEmitida ? 'já tinha sido emitida' : 'autorizada') + '</div>' +
        (j.nfce.ambiente === 'homologacao' ? '<div style="color:#f59e0b;font-size:0.8rem;">Ambiente de TESTE — sem valor fiscal</div>' : '') +
        (j.jaEmitida ? '' : '<div style="font-size:0.82rem;color:var(--muted);margin-top:4px;">🖨️ Enviada pra impressora.</div>') + (window._nfceWhatsAtual = j.nfce, _htmlNfceWhats()) + '</div>';
      document.getElementById('nfce-totem-rodape').innerHTML =
        '<button onclick="_enviarImpressaoNfce(_nfceTotem)" style="flex:1;padding:13px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;">🖨️ Imprimir de novo</button>'+
        '<button onclick="document.getElementById(\'modal-nfce-totem\').remove()" style="flex:1;padding:13px;background:var(--accent);border:none;color:#000;border-radius:10px;font-weight:800;cursor:pointer;font-family:inherit;">OK</button>';
      var bl = document.getElementById('hist-nfce-bloco'); if(bl) bl.innerHTML = _htmlNfceTotem(p);
      return;
    }
    btn.disabled = false; btn.textContent = '🧾 Tentar de novo';
    msg.innerHTML = '<div style="background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.3);color:#f87171;border-radius:10px;padding:10px;font-size:0.82rem;line-height:1.4;">❌ Nota não autorizada:<br>' + escapar(j.error||'erro desconhecido') + '</div>';
  }).catch(function(){
    btn.disabled = false; btn.textContent = '🧾 Tentar de novo';
    msg.innerHTML = '<div style="color:#f87171;font-size:0.84rem;">Sem conexão com o servidor. A nota não foi emitida.</div>';
  });
}
function _enviarImpressaoNfce(p){
  if(!p || !p.nfce) return;
  fbDb.collection('comandos_impressao').add({ tipo:'nfce', buffet: p.origemTotemBalanca === true, restauranteId:_restauranteId, tenantId:_tenantId, pedidoTotemId:p.id, senhaTotem:p.senha||null, nfce:p.nfce, solicitadoPor:'Caixa', solicitadoEm:Date.now(), criadoEm:Date.now() })
    .then(function(){ mostrarToast('🖨️ Nota enviada pra impressora', '#22c55e'); })
    .catch(function(e){ mostrarToast('Erro ao imprimir: ' + (e.message||e.code), '#f87171'); });
}
function imprimirNfceTotem(id){
  var p = (_historicoPedidos||[]).find(function(x){ return x.id === id; });
  if(p) _enviarImpressaoNfce(p);
}

function reimprimirRecibo(pedidoId){
  var p = _historicoPedidos.find(function(x){ return x.id === pedidoId; });
  if(!p) return;
  _disparoReimpressao(p, 'recibo');
}

function reimprimirCozinha(pedidoId){
  var p = _historicoPedidos.find(function(x){ return x.id === pedidoId; });
  if(!p) return;
  _disparoReimpressao(p, 'cozinha');
}

function _disparoReimpressao(p, tipo){
  if(!confirm('Reimprimir ' + (tipo==='recibo'?'recibo':'cupom da cozinha') + ' da senha #' + p.senha + '?')) return;
  enriquecerItensComCategoria(p.itens||[]).then(function(itensEnriquecidos){
    var pedidoImpressao = {
      garcom: 'Totem (reimpressão)',
      mesa: null,
      restauranteId: _restauranteId,
      tenantId: _tenantId,
      contaId: null,
      tipoConta: 'totem',
      cliente: 'Totem #' + p.senha,
      senhaTotem: p.senha,
      status: 'preparo',
      criadoEm: Date.now(),
      itens: itensEnriquecidos,
      total: p.total||0,
      origemTotem: true,
      pedidoTotemId: p.id,
      formaPagamento: p.formaPagamento || '',
      reimpressao: true,
      tipoReimpressao: tipo
    };
    if(tipo === 'recibo'){
      pedidoImpressao.imprimir = false; // não imprime cozinha
      pedidoImpressao.imprimirRecibo = true;
    } else {
      pedidoImpressao.imprimir = true; // imprime cozinha
      pedidoImpressao.imprimirRecibo = false;
    }
    return fbDb.collection('pedidos').add(pedidoImpressao);
  }).then(function(){
    mostrarToast('✓ Reimpressão enviada', '#22c55e');
  }).catch(function(e){
    mostrarToast('Erro: ' + (e.message||e.code), '#f87171');
  });
}

</script>


<script>
// ═══ 🔄 AVISO DE VERSÃO NOVA ═══
// A cada 3 min confere se o sistema foi atualizado no servidor (sem baixar a página
// inteira: só o "carimbo" ETag). Se mudou, aparece uma faixa "toque para atualizar".
// Não recarrega sozinho (pode ter algo sendo feito na tela).
(function(){
  var MODO = 'caixa';
  var base = null, avisou = false;
  function carimbo(){
    return fetch(location.pathname + '?vchk=' + Date.now(), { method:'HEAD', cache:'no-store' }).then(function(r){
      var e = r.headers.get('etag') || r.headers.get('last-modified') || '';
      if(e) return e;
      return fetch(location.pathname + '?vchk=' + Date.now(), { cache:'no-store' }).then(function(r2){ return r2.text(); }).then(function(t){
        var h = 5381; for(var i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) >>> 0; return 'h' + t.length + ':' + h;
      });
    }).catch(function(){ return null; });
  }
  function podeRecarregarSozinho(){
    if(MODO !== 'totem') return false;
    try{
      var ti = document.getElementById('tela-inicial');
      var naInicial = ti && ti.style.display !== 'none' && !ti.classList.contains('escondida');
      return naInicial && !(window._carrinho && window._carrinho.length) && !document.getElementById('tela-cobranca') && !document.getElementById('tela-balanca');
    }catch(e){ return false; }
  }
  function avisar(){
    if(podeRecarregarSozinho()){ location.reload(); return; }
    if(MODO === 'totem'){ setTimeout(avisar, 30000); return; }   // totem: espera ficar livre e recarrega sozinho
    if(avisou) return; avisou = true;
    var f = document.createElement('div');
    f.id = 'faixa-versao-nova';
    f.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:2147483000;background:#d4a843;color:#000;font-family:inherit;font-weight:800;font-size:0.95rem;padding:12px 16px;padding-top:max(12px, env(safe-area-inset-top));display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(0,0,0,0.45);cursor:pointer;';
    f.innerHTML = '<span style="font-size:1.2rem;">🔄</span><span style="flex:1;">Tem versão nova do sistema — toque aqui pra atualizar</span><span onclick="event.stopPropagation();this.parentNode.remove();" style="font-size:1.3rem;padding:0 6px;">×</span>';
    f.onclick = function(){ location.reload(); };
    document.body.appendChild(f);
  }
  function conferir(){
    carimbo().then(function(c){
      if(!c) return;
      if(base === null){ base = c; return; }
      if(c !== base) avisar();
    });
  }
  setTimeout(conferir, 8000);
  setInterval(conferir, 3 * 60 * 1000);
})();
</script>
