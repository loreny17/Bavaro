<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozinha — KDS Profissional Final</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#0a0a0c;color:#f4f4f5;display:flex;flex-direction:column;}
.grade{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;}
.pedido{background:#16161a;border:1px solid #2a2a30;border-radius:14px;display:flex;flex-direction:column;}
.pedido-topo{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #2a2a30;font-family:'Bebas Neue';}
.pedido-info{display:flex;gap:10px;padding:6px 14px;border-bottom:1px solid #2a2a30;}
.itens{display:flex;flex-direction:column;}
.item{display:flex;align-items:center;gap:10px;padding:6px 14px;border-top:1px solid rgba(255,255,255,0.04);}
.item-qtd{font-weight:700;color:#d4a843;width:30px;text-align:center;}
.item-corpo{display:flex;flex-direction:column;}
.item-nome{font-weight:700;}
.item-obs{color:#f59e0b;font-size:0.85rem;}
.item-img{width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;}
.categoria-title{font-weight:700;color:#d4a843;margin-top:6px;margin-bottom:2px;font-size:0.85rem;}
.tempo{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:#d4a843;flex-shrink:0;}
.urgencia-bar{width:5px;border-radius:2px;flex-shrink:0;margin-right:6px;}
.pronto{opacity:0.55;}
.pedido-pronto{height:50px;overflow:hidden;}
</style>
</head>
<body>
<div class="grade" id="grade"></div>
<script>
var _pedidosAtivos = [
  {
    id:'p1', mesa:'23', numeroSequencial:1, garcom:'Rodrigo', criadoEm:Date.now()-600000,
    itens:[
      {id:'i1', nome:'File Argentino', qtd:1, categoria:'Carnes', prontoCozinha:false, foto:'https://i.imgur.com/0r6cRrQ.jpg'},
      {id:'i2', nome:'Batata Frita', qtd:2, categoria:'Acompanhamentos', prontoCozinha:false}
    ]
  },
  {
    id:'p2', mesa:'24', numeroSequencial:2, garcom:'Ana', criadoEm:Date.now()-360000,
    itens:[
      {id:'i3', nome:'Salada Caesar', qtd:1, categoria:'Saladas', prontoCozinha:true}
    ]
  }
];

function montarCardPedido(p){
  var todosProntos = p.itens.every(it=>it.prontoCozinha);
  var categorias = {};
  p.itens.forEach(it=>{if(!categorias[it.categoria]) categorias[it.categoria]=[]; categorias[it.categoria].push(it);});

  var itensHtml='';
  Object.keys(categorias).forEach(cat=>{
    itensHtml+='<div class="categoria-title">'+cat+'</div>';
    categorias[cat].forEach(it=>{
      var imgHtml = it.foto ? '<img src="'+it.foto+'" class="item-img">' : '';
      var minutos = Math.floor((Date.now() - p.criadoEm)/60000);
      var corUrgencia = minutos>=20 ? '#ef4444' : minutos>=10 ? '#f59e0b' : '#22c55e';
      itensHtml+='<div class="item'+(it.prontoCozinha?' pronto':'')+'">'+
                  '<div class="urgencia-bar" style="background:'+corUrgencia+';"></div>'+ 
                  '<div class="item-qtd">'+it.qtd+'</div>'+imgHtml+
                  '<div class="item-corpo"><div class="item-nome">'+it.nome+'</div></div>'+ 
                  '<div class="tempo">'+minutos+'min</div>'+ 
                '</div>';
    });
  });

  return '<div class="pedido '+(todosProntos?'pedido-pronto':'')+'">'+
           '<div class="pedido-topo">Mesa '+p.mesa+'</div>'+ 
           '<div class="pedido-info">#'+p.numeroSequencial+' • '+p.garcom+'</div>'+ 
           '<div class="itens">'+itensHtml+'</div>'+ 
         '</div>';
}

document.getElementById('grade').innerHTML = _pedidosAtivos.map(montarCardPedido).join('');
</script>
</body>
</html>
