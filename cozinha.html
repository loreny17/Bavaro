<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cozinha — Bávaro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#08090b;
    --surface:#101114;
    --surface-2:#15161a;
    --surface-3:#1b1c21;
    --line:#24252b;
    --line-soft:rgba(255,255,255,0.055);
    --texto:#f7f7f8;
    --muted:#8f929b;
    --muted-2:#62656f;
    --accent:#d4a843;
    --accent-soft:rgba(212,168,67,0.12);
    --verde:#22c55e;
    --laranja:#f59e0b;
    --vermelho:#ef4444;
    --ok:var(--verde);
    --warn:var(--laranja);
    --danger:var(--vermelho);
    --ready:#38d979;
  }
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at top left,rgba(212,168,67,0.055),transparent 32%),var(--bg);
    color:var(--texto);
    font-family:'Inter',sans-serif;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* ─── Cabeçalho limpo ─── */
  .topo{
    display:flex;align-items:center;gap:12px;
    padding:10px 16px;
    background:rgba(14,15,18,0.96);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .topo h1{
    display:flex;align-items:center;gap:9px;
    font-family:'Bebas Neue',sans-serif;
    font-size:1.8rem;letter-spacing:0.075em;
    color:var(--accent);
    line-height:1;
  }
  .topo .sub{font-size:0.74rem;color:var(--muted);margin-top:3px;}
  .icone-outline{width:25px;height:25px;display:inline-flex;color:var(--accent);}
  .icone-outline svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .topo-stats{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .stat{
    background:rgba(255,255,255,0.035);border:1px solid var(--line);
    border-radius:11px;padding:6px 12px;text-align:center;min-width:74px;
  }
  .stat .num{font-family:'Bebas Neue',sans-serif;font-size:1.45rem;line-height:1;color:var(--texto);}
  .stat .lbl{font-size:0.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.09em;margin-top:2px;}
  .relogio{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--texto);letter-spacing:0.045em;}
  .ponto-conexao{width:9px;height:9px;border-radius:50%;background:var(--verde);flex-shrink:0;box-shadow:0 0 10px var(--verde);}
  .ponto-conexao.off{background:var(--vermelho);box-shadow:0 0 10px var(--vermelho);}

  /* ─── Controles ─── */
  .seletor-visual{
    display:flex;background:#090a0c;border:1px solid var(--line);border-radius:11px;padding:2px;margin-right:2px;
  }
  .seletor-visual button{
    background:transparent;border:none;color:var(--muted);padding:7px 11px;font-size:0.72rem;font-weight:800;
    cursor:pointer;border-radius:9px;transition:all 0.15s;text-transform:uppercase;letter-spacing:0.055em;font-family:inherit;
  }
  .seletor-visual button.ativo{background:var(--surface-3);color:var(--accent);}
  #btn-som{
    background:rgba(255,255,255,0.035)!important;border:1px solid var(--line)!important;border-radius:11px!important;
    padding:0!important;width:42px;height:42px;cursor:pointer;color:var(--texto);display:flex!important;align-items:center!important;justify-content:center!important;
  }
  #btn-som svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ─── Métricas ─── */
  .painel-metricas{
    display:flex;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:rgba(12,13,15,0.9);flex-wrap:wrap;flex-shrink:0;
  }
  .metrica{background:rgba(255,255,255,0.032);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:118px;}
  .metrica .valor{font-family:'Bebas Neue',sans-serif;font-size:1.48rem;color:var(--accent);line-height:1;}
  .metrica .titulo{font-size:0.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:3px;}

  /* ─── Board KDS: PREPARO + ENTREGA lateral ─── */
  .grade{flex:1;min-height:0;overflow:hidden;padding:12px;display:block;}
  .kds-board{height:100%;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(285px,0.85fr);gap:12px;}
  .kds-coluna{min-height:0;display:flex;flex-direction:column;background:rgba(16,17,20,0.78);border:1px solid var(--line);border-radius:18px;overflow:hidden;}
  .coluna-head{height:46px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;background:rgba(255,255,255,0.026);border-bottom:1px solid var(--line);}
  .coluna-titulo{display:flex;align-items:center;gap:9px;font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:0.075em;color:var(--texto);line-height:1;}
  .coluna-titulo::before{content:'';width:7px;height:20px;border-radius:99px;background:var(--accent);display:block;}
  .coluna-entrega .coluna-titulo::before{background:var(--ready);}
  .coluna-total{font-size:0.68rem;font-weight:900;color:var(--muted);border:1px solid var(--line);background:#0c0d10;border-radius:999px;padding:4px 9px;text-transform:uppercase;letter-spacing:0.07em;}
  .lista-pedidos{min-height:0;overflow-y:auto;padding:10px;display:grid;gap:8px;align-content:start;}
  .lista-pedidos::-webkit-scrollbar{width:8px;}
  .lista-pedidos::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;}

  /* ─── Pedido: lista profissional compacta ─── */
  .pedido{
    --urgencia:var(--ok);
    background:linear-gradient(180deg,rgba(255,255,255,0.044),rgba(255,255,255,0.024));
    border:1px solid var(--line-soft);
    border-radius:13px;
    overflow:hidden;
    position:relative;
    display:grid;
    grid-template-columns:6px 78px minmax(0,1fr) auto;
    min-height:78px;
    box-shadow:none;
  }
  .pedido::before{content:'';grid-column:1;grid-row:1/-1;background:var(--urgencia);}
  .pedido.urgencia-ok{--urgencia:var(--ok);}
  .pedido.urgencia-medio{--urgencia:var(--warn);}
  .pedido.urgencia-alerta{--urgencia:var(--danger);}
  .pedido.urgencia-pronto{--urgencia:var(--ready);}
  @keyframes entrar{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .pedido.novo{animation:entrar 0.22s ease, piscarNovo 0.9s ease 3 0.2s;}
  @keyframes piscarNovo{0%,100%{border-color:var(--line-soft);}50%{border-color:var(--accent);box-shadow:0 0 0 1px rgba(212,168,67,0.25);}}

  .tempo-bloco{
    grid-column:2;grid-row:1/-1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-right:1px solid var(--line-soft);padding:7px 6px;color:var(--urgencia);background:rgba(0,0,0,0.13);
  }
  .tempo-num{font-family:'Bebas Neue',sans-serif;font-size:2.75rem;line-height:0.82;letter-spacing:0.02em;color:currentColor;}
  .tempo-label{font-size:0.64rem;font-weight:900;letter-spacing:0.16em;color:currentColor;margin-top:5px;}
  .pedido-corpo{grid-column:3;min-width:0;padding:9px 10px 8px;display:flex;flex-direction:column;justify-content:center;gap:6px;}
  .pedido-cabecalho{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;}
  .pedido-ident{display:flex;align-items:center;gap:6px;min-width:0;font-weight:900;letter-spacing:0.015em;color:var(--texto);}
  .mesa-chip{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:0.05em;color:var(--accent);line-height:1;white-space:nowrap;}
  .pedido-responsavel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e7e7ea;font-size:0.86rem;}
  .pedido-ponto{color:var(--muted-2);font-weight:900;}
  .tag-teste{display:inline-block;background:rgba(239,68,68,0.14);color:#f87171;font-size:0.56rem;font-weight:900;padding:2px 6px;border-radius:999px;text-transform:uppercase;letter-spacing:0.06em;vertical-align:middle;white-space:nowrap;}
  .pedido-progresso{font-size:0.68rem;color:var(--muted);font-weight:800;white-space:nowrap;text-transform:uppercase;letter-spacing:0.045em;}
  .pedido-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:0.68rem;font-weight:750;letter-spacing:0.02em;}
  .pedido-meta .num-ped{color:var(--accent);}

  .itens{display:grid;gap:4px;min-width:0;}
  .item{
    display:grid;grid-template-columns:minmax(0,1fr) 26px;align-items:center;gap:8px;
    padding:6px 7px;border-radius:9px;cursor:pointer;transition:background 0.15s,opacity 0.15s;border:1px solid transparent;min-width:0;
  }
  .item:hover{background:rgba(255,255,255,0.035);border-color:rgba(255,255,255,0.035);}
  .item:active{background:rgba(255,255,255,0.07);}
  .item-principal{background:rgba(212,168,67,0.065);border-color:rgba(212,168,67,0.1);}
  .item-linha{min-width:0;}
  .item-nome{font-size:0.98rem;font-weight:950;line-height:1.15;letter-spacing:0.01em;color:var(--texto);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-principal .item-nome{font-size:1.08rem;}
  .item-qtd-inline{font-family:'Bebas Neue',sans-serif;color:var(--accent);font-size:1.2em;letter-spacing:0.035em;margin-right:5px;}
  .item-obs{font-size:0.72rem;color:var(--laranja);margin-top:2px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-sel{font-size:0.69rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;}
  .item-check svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
  .item.pronto{opacity:0.46;}
  .item.pronto .item-nome{text-decoration:line-through;}
  .item.pronto .item-check{background:var(--verde);border-color:var(--verde);}

  .pedido-acao{grid-column:4;grid-row:1/-1;display:flex;align-items:center;justify-content:center;padding:0 10px;border-left:1px solid var(--line-soft);color:var(--muted);}
  .status-pill{font-size:0.63rem;font-weight:950;letter-spacing:0.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted);background:#0c0d10;white-space:nowrap;}
  .pedido.completo{min-height:56px;grid-template-columns:5px 54px minmax(0,1fr) auto;background:rgba(34,197,94,0.065);opacity:0.88;}
  .pedido.completo .tempo-bloco{color:var(--ready);padding:5px 4px;}
  .pedido.completo .tempo-num{font-size:1.55rem;}
  .pedido.completo .tempo-label{font-size:0.53rem;margin-top:3px;}
  .pedido.completo .pedido-corpo{padding:7px 9px;gap:3px;}
  .pedido.completo .mesa-chip{font-size:1.05rem;color:var(--ready);}
  .pedido.completo .pedido-responsavel{font-size:0.78rem;}
  .pedido.completo .item{padding:3px 5px;grid-template-columns:minmax(0,1fr) 20px;}
  .pedido.completo .item:not(.item-principal){display:none;}
  .pedido.completo .item-nome{font-size:0.74rem;}
  .pedido.completo .item-check{width:19px;height:19px;}
  .pedido.completo .status-pill{color:var(--ready);border-color:rgba(34,197,94,0.22);background:rgba(34,197,94,0.08);}

  /* Modo cards ainda existe, porém mais limpo */
  .grade.modo-cards .coluna-preparo .lista-pedidos{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));}
  .grade.modo-cards .pedido{grid-template-columns:6px 70px minmax(0,1fr);min-height:112px;}
  .grade.modo-cards .pedido-acao{display:none;}
  .grade.modo-cards .pedido-corpo{padding:10px;}
  .grade.modo-cards .tempo-num{font-size:2.35rem;}
  .grade.modo-cards .item-nome{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

  /* ─── Empty/loading/erro ─── */
  .vazio,.vazio-coluna{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);}
  .vazio{height:100%;padding:40px 20px;}
  .vazio-coluna{min-height:140px;border:1px dashed var(--line);border-radius:14px;padding:20px;background:rgba(255,255,255,0.018);}
  .icone-vazio{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;position:relative;opacity:0.72;}
  .icone-vazio::before,.icone-vazio::after{content:'';position:absolute;background:var(--muted-2);border-radius:999px;}
  .icone-vazio::before{width:22px;height:2px;left:10px;top:15px;}
  .icone-vazio::after{width:16px;height:2px;left:10px;top:25px;}
  .vazio .titulo,.vazio-coluna .titulo{font-size:1rem;font-weight:900;color:var(--texto);}
  .vazio .desc,.vazio-coluna .desc{font-size:0.82rem;margin-top:5px;color:var(--muted);}
  #carregando{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
  .spinner{width:46px;height:46px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:girar 0.8s linear infinite;}
  @keyframes girar{to{transform:rotate(360deg);}}
  #carregando .txt{color:var(--muted);font-size:0.9rem;}
  #carregando.escondido{display:none;}
  .erro-box{max-width:400px;text-align:center;padding:24px;}
  .erro-box .icone{width:48px;height:48px;border:1px solid rgba(239,68,68,0.28);border-radius:16px;margin:0 auto 12px;position:relative;}
  .erro-box .icone::before{content:'!';font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--vermelho);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .erro-box .titulo{font-size:1.15rem;font-weight:900;color:var(--vermelho);margin-bottom:8px;}
  .erro-box .desc{font-size:0.88rem;color:var(--muted);line-height:1.6;}
  .erro-box button{margin-top:16px;width:100%;padding:12px;background:var(--accent);border:none;color:#000;border-radius:10px;font-weight:900;font-size:0.95rem;cursor:pointer;font-family:inherit;}

  /* Histórico menor para não roubar foco */
  .historico-box{margin-top:8px;background:rgba(255,255,255,0.022);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .historico-topo{padding:9px 12px;border-bottom:1px solid var(--line);font-family:'Bebas Neue',sans-serif;font-size:1.08rem;letter-spacing:0.06em;color:var(--muted);}
  .historico-item{padding:7px 12px;border-top:1px solid rgba(255,255,255,0.035);display:flex;justify-content:space-between;gap:10px;font-size:0.78rem;color:var(--muted);}

  @media(max-width:1050px){
    .kds-board{grid-template-columns:1fr;overflow-y:auto;}
    .kds-coluna{min-height:280px;}
    .grade{overflow-y:auto;}
  }
  @media(max-width:720px){
    body{overflow:auto;}
    .topo{align-items:flex-start;flex-wrap:wrap;}
    .topo-stats{width:100%;margin-left:0;overflow-x:auto;padding-bottom:2px;}
    .painel-metricas{display:none;}
    .grade{padding:10px;overflow:visible;}
    .pedido{grid-template-columns:5px 62px minmax(0,1fr);}
    .pedido-acao{display:none;}
    .tempo-num{font-size:2.15rem;}
    .pedido-responsavel{max-width:150px;}
    .stat{min-width:68px;}
  }
</style>

</head>
<body>

<!-- Carregamento -->
<div id="carregando">
  <div class="spinner"></div>
  <div class="txt">Conectando à cozinha...</div>
</div>

<!-- Cabeçalho -->
<div class="topo">
  <div class="ponto-conexao" id="ponto-conexao"></div>
  <div>
    <h1><span class="icone-outline" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 10h12"/><path d="M6 10v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M9 14h6"/></svg></span>COZINHA</h1>
    <div class="sub" id="sub-restaurante">Toque no prato quando ficar pronto</div>
  </div>
  <div class="topo-stats">

    <div class="seletor-visual">
      <button id="btn-modo-cards" class="ativo" onclick="definirModoVisual('cards')">Cards</button>
      <button id="btn-modo-lista" onclick="definirModoVisual('lista')">Lista</button>
    </div>

    <button id="btn-som" onclick="alternarSom()" aria-label="Som ligado"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 1 0 8"/><path d="M20.5 5.5a10 10 0 0 1 0 13"/><path d="M4 10v4h4l5 4V6l-5 4H4z"/></svg></button>
    <div class="stat">
      <div class="num" id="stat-pedidos">0</div>
      <div class="lbl">Pedidos</div>
    </div>
    <div class="stat">
      <div class="num" id="stat-itens">0</div>
      <div class="lbl">Pratos</div>
    </div>
    <div class="stat">
      <div class="num relogio" id="relogio">--:--</div>
      <div class="lbl">Agora</div>
    </div>
  </div>
</div>


<div class="painel-metricas">
  <div class="metrica">
    <div class="valor" id="tempo-medio">0min</div>
    <div class="titulo">Tempo Médio</div>
  </div>

  <div class="metrica">
    <div class="valor" id="maior-atraso">0min</div>
    <div class="titulo">Maior Atraso</div>
  </div>

  <div class="metrica">
    <div class="valor" id="pedidos-finalizados">0</div>
    <div class="titulo">Finalizados Hoje</div>
  </div>
</div>


<!-- Grade de pedidos -->
<div class="grade modo-cards" id="grade">
  <div class="vazio">
    <div class="icone-vazio"></div>
    <div class="titulo">Aguardando pedidos</div>
    <div class="desc">Os pedidos da cozinha vão aparecer aqui</div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ═══════════════════════════════════════════════
//  TELA DE COZINHA — Bávaro
//  Mostra os pedidos da cozinha em tempo real.
//  Etapa 1: só visualização (a impressão continua normal).
// ═══════════════════════════════════════════════

var firebaseConfig = {
  apiKey: "AIzaSyBmuVAH50RHsNZ7nAcMCdzulJZf3e86f74",
  authDomain: "gestao-reataurante.firebaseapp.com",
  projectId: "gestao-reataurante",
  storageBucket: "gestao-reataurante.firebasestorage.app",
  messagingSenderId: "510785409925",
  appId: "1:510785409925:web:e687e387509fb0605b6aec"
};

// Configuração do restaurante — pode vir pela URL (?rest=default&tenant=xxx)
var _params = new URLSearchParams(window.location.search);
var _restauranteId = _params.get('rest') || 'default';
var _tenantId = _params.get('tenant') || 'tnt_molrfz1k_rznlgl';

var fbDb = null;
var _modelosCozinha = [];
var _itensCardapio = [];
var _categorias = [];
var _pedidosAtivos = [];
var _contasAbertas = {};   // {contaId: true} — contas ainda abertas
var _idsConhecidos = {};   // pra detectar pedido novo (piscar)
var _primeiraCarga = true;
var _somLigado = true;     // alerta sonoro de pedido novo
var _modoVisual = 'lista';

var _historicoFinalizados = [];
var _pedidosFinalizadosHoje = 0;
var _idsHistoricoFinalizados = {};


// ─── Inicialização ───
window.addEventListener('load', function(){
  try{
    firebase.initializeApp(firebaseConfig);
    fbDb = firebase.firestore();
  // Recupera layout salvo do novo KDS compacto
  var layoutSalvo = localStorage.getItem('bavaro_layout_v2');
  if(layoutSalvo){
    _modoVisual = layoutSalvo;
  }

  sincronizarModoVisual();

    iniciar();
  }catch(e){
    mostrarErro('Erro ao iniciar', e.message || String(e));
  }
});

function iniciar(){
  document.getElementById('sub-restaurante').textContent =
    'Toque no prato quando ficar pronto · ' + _restauranteId;
  // Relógio
  atualizarRelogio();
  setInterval(atualizarRelogio, 1000);
  // Atualiza os tempos dos cards a cada 30s
  setInterval(renderPedidos, 30000);
  // Carrega cardápio e modelos, depois escuta os pedidos
  carregarConfiguracao().then(function(){
    escutarContasAbertas();
    escutarPedidos();
    document.getElementById('carregando').classList.add('escondido');
  }).catch(function(e){
    mostrarErro('Erro ao carregar', e.message || String(e));
  });
  // Detecta conexão
  window.addEventListener('online', function(){ atualizarPontoConexao(true); });
  window.addEventListener('offline', function(){ atualizarPontoConexao(false); });
  atualizarPontoConexao(navigator.onLine !== false);
}


// ─── Alternador de visualização ───
function definirModoVisual(modo){
  _modoVisual = modo;
  localStorage.setItem('bavaro_layout_v2', modo);
  sincronizarModoVisual();
}

function sincronizarModoVisual(){
  var grade = document.getElementById('grade');
  var btnCards = document.getElementById('btn-modo-cards');
  var btnLista = document.getElementById('btn-modo-lista');

  if(!grade) return;

  if(_modoVisual === 'lista'){
    grade.classList.remove('modo-cards');
    grade.classList.add('modo-lista');

    if(btnLista) btnLista.classList.add('ativo');
    if(btnCards) btnCards.classList.remove('ativo');
  }else{
    grade.classList.remove('modo-lista');
    grade.classList.add('modo-cards');

    if(btnCards) btnCards.classList.add('ativo');
    if(btnLista) btnLista.classList.remove('ativo');
  }
}


// ─── Carrega cardápio, categorias e modelos de impressão ───
function carregarConfiguracao(){
  var base = fbDb.collection('tenants').doc(_tenantId)
    .collection('restaurantes').doc(_restauranteId);

  var p1 = base.collection('cardapio').doc('data').collection('itens').get()
    .then(function(snap){
      _itensCardapio = [];
      snap.forEach(function(d){
        var v = d.data();
        _itensCardapio.push({
          id:d.id, nome:v.nome||'',
          categoriaId: v.categoriaId || v.categoria || ''
        });
      });
    }).catch(function(){ _itensCardapio = []; });

  var p2 = base.collection('cardapio').doc('data').collection('categorias').get()
    .then(function(snap){
      _categorias = [];
      snap.forEach(function(d){ _categorias.push(Object.assign({id:d.id}, d.data())); });
    }).catch(function(){ _categorias = []; });

  // Modelos de impressão (pra saber o que é "da cozinha")
  // Caminho: impressao/config/modelos (subcoleção)
  var p3 = base.collection('impressao').doc('config').collection('modelos').get()
    .then(function(snap){
      _modelosCozinha = [];
      snap.forEach(function(d){
        var v = d.data() || {};
        if(v.apareceSininho){
          _modelosCozinha.push({
            id: d.id,
            nome: v.nome || '',
            filtro: v.filtro || 'categoria',
            categorias: v.categorias || [],
            itens: v.itens || []
          });
        }
      });
    }).catch(function(){ _modelosCozinha = []; });

  return Promise.all([p1, p2, p3]);
}

// ─── Escuta as contas de mesa abertas ───
function escutarContasAbertas(){
  fbDb.collection('contas_mesa')
    .where('restauranteId','==', _restauranteId)
    .onSnapshot(function(snap){
      _contasAbertas = {};
      snap.forEach(function(d){
        var c = d.data();
        if(c.status === 'aberta' || !c.status){
          _contasAbertas[d.id] = true;
        }
      });
      verificarHistoricoFinalizados();
      renderPedidos();
    }, function(e){
      console.warn('[COZINHA] erro contas:', e);
    });
}

// ─── Escuta os pedidos em tempo real ───
function escutarPedidos(){
  fbDb.collection('pedidos')
    .where('restauranteId','==', _restauranteId)
    .onSnapshot(function(snap){
      var lista = [];
      snap.forEach(function(d){
        lista.push(Object.assign({id:d.id}, d.data()));
      });

      // Detecta pedidos NOVOS de cozinha (pra tocar o som)
      if(!_primeiraCarga){
        var temPedidoNovoCozinha = false;
        snap.docChanges().forEach(function(ch){
          if(ch.type === 'added'){
            var p = Object.assign({id:ch.doc.id}, ch.doc.data());
            // Só conta se tem item de cozinha e está em preparo
            var temItemCoz = (p.itens||[]).some(function(it){
              return it.status !== 'cancelado' && itemEhDaCozinha(it);
            });
            var emPreparo = !p.status || p.status === 'preparo' || p.status === 'novo';
            if(temItemCoz && emPreparo){ temPedidoNovoCozinha = true; }
          }
        });
        if(temPedidoNovoCozinha){
          _tocarAlertaPedido();
        }
      }

      _pedidosAtivos = lista;
      atualizarPontoConexao(true);
      renderPedidos();
      _primeiraCarga = false;
    }, function(e){
      console.error('[COZINHA] erro pedidos:', e);
      atualizarPontoConexao(false);
    });
}

// ─── Som de alerta quando chega pedido novo ───
var _audioCtx = null;
function _tocarAlertaPedido(){
  if(!_somLigado) return;
  try{
    if(!_audioCtx){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      _audioCtx = new Ctx();
    }
    // Toca 2 "bips" curtos — um som de campainha simples
    var agora = _audioCtx.currentTime;
    [0, 0.18].forEach(function(offset){
      var osc = _audioCtx.createOscillator();
      var gain = _audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, agora + offset);
      gain.gain.setValueAtTime(0.0001, agora + offset);
      gain.gain.exponentialRampToValueAtTime(0.35, agora + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, agora + offset + 0.15);
      osc.connect(gain);
      gain.connect(_audioCtx.destination);
      osc.start(agora + offset);
      osc.stop(agora + offset + 0.16);
    });
  }catch(e){
    console.warn('[COZINHA] erro ao tocar som:', e);
  }
}

// ─── Decide se um item é "da cozinha" ───
function itemEhDaCozinha(item){
  if(!_modelosCozinha.length) return true; // sem config = mostra tudo
  return _modelosCozinha.some(function(m){
    if(m.filtro === 'item'){
      return (m.itens||[]).indexOf(item.id) >= 0;
    } else {
      // filtro por categoria
      var def = _itensCardapio.find(function(i){ return i.id === item.id; });
      var catId = def ? def.categoriaId : (item.categoriaId || '');
      return (m.categorias||[]).indexOf(catId) >= 0;
    }
  });
}

// ─── Verifica se todos os itens de cozinha de um pedido estão prontos ───
function _pedidoEstaCompleto(p){
  var itensCoz = (p.itens||[]).filter(function(it){
    return it.status !== 'cancelado' && itemEhDaCozinha(it);
  });
  if(!itensCoz.length) return false;
  return itensCoz.every(function(it){ return it.prontoCozinha === true; });
}

// ─── Monta a tela ───
function renderPedidos(){
  var grade = document.getElementById('grade');

  // Filtra: pedidos que ainda estão em preparo, de contas abertas,
  // e que tenham itens da cozinha
  var pedidosCozinha = _pedidosAtivos.filter(function(p){
    if(p.status && p.status !== 'preparo' && p.status !== 'novo') return false;
    if(p.contaId && !_contasAbertas[p.contaId]) return false;
    var itensCoz = (p.itens||[]).filter(function(it){
      return it.status !== 'cancelado' && itemEhDaCozinha(it);
    });
    return itensCoz.length > 0;
  });

  // Ordena: urgentes primeiro; prontos ficam na coluna lateral.
  pedidosCozinha.sort(function(a,b){
    var aCompleto = _pedidoEstaCompleto(a);
    var bCompleto = _pedidoEstaCompleto(b);
    if(aCompleto !== bCompleto) return aCompleto ? 1 : -1;
    return (a.criadoEm||0) - (b.criadoEm||0);
  });

  verificarHistoricoFinalizados();

  // Estatísticas
  var totalItens = 0;
  pedidosCozinha.forEach(function(p){
    (p.itens||[]).forEach(function(it){
      if(it.status !== 'cancelado' && itemEhDaCozinha(it)){
        totalItens += (it.qtd || 1);
      }
    });
  });
  document.getElementById('stat-pedidos').textContent = pedidosCozinha.length;
  document.getElementById('stat-itens').textContent = totalItens;

  var tempos = pedidosCozinha.map(function(p){
    return Math.max(0, Math.floor((Date.now() - (p.criadoEm||Date.now())) / 60000));
  });

  var media = tempos.length
    ? Math.round(tempos.reduce(function(a,b){ return a+b; },0) / tempos.length)
    : 0;

  var maior = tempos.length ? Math.max.apply(null, tempos) : 0;

  var elMedia = document.getElementById('tempo-medio');
  var elMaior = document.getElementById('maior-atraso');
  var elFinalizados = document.getElementById('pedidos-finalizados');

  if(elMedia) elMedia.textContent = media + 'min';
  if(elMaior) elMaior.textContent = maior + 'min';
  if(elFinalizados) elFinalizados.textContent = _pedidosFinalizadosHoje;

  var pedidosPreparo = pedidosCozinha.filter(function(p){
    return !_pedidoEstaCompleto(p);
  });

  var pedidosProntos = pedidosCozinha.filter(function(p){
    return _pedidoEstaCompleto(p);
  });

  var htmlPreparo = pedidosPreparo.length
    ? pedidosPreparo.map(function(p){ return montarCardPedido(p); }).join('')
    : montarVazioColuna('Sem preparo agora', 'Novos pedidos aparecem aqui automaticamente.');

  var htmlEntrega = pedidosProntos.length
    ? pedidosProntos.map(function(p){ return montarCardPedido(p); }).join('')
    : montarVazioColuna('Nada pronto', 'Quando todos os itens forem marcados, o pedido vem para cá.');

  htmlEntrega += montarHistorico();

  grade.innerHTML =
    '<div class="kds-board">' +
      montarColuna('coluna-preparo', 'PREPARO', pedidosPreparo.length, htmlPreparo) +
      montarColuna('coluna-entrega', 'ENTREGA', pedidosProntos.length, htmlEntrega) +
    '</div>';

  pedidosCozinha.forEach(function(p){ _idsConhecidos[p.id] = true; });
}

function montarColuna(classe, titulo, total, conteudo){
  return '<section class="kds-coluna ' + classe + '">' +
    '<div class="coluna-head">' +
      '<div class="coluna-titulo">' + escapar(titulo) + '</div>' +
      '<div class="coluna-total">' + total + ' pedido' + (total === 1 ? '' : 's') + '</div>' +
    '</div>' +
    '<div class="lista-pedidos">' + conteudo + '</div>' +
  '</section>';
}

function montarVazioColuna(titulo, desc){
  return '<div class="vazio-coluna">' +
    '<div class="icone-vazio"></div>' +
    '<div class="titulo">' + escapar(titulo) + '</div>' +
    '<div class="desc">' + escapar(desc) + '</div>' +
  '</div>';
}

function _classeUrgencia(minutos, completo){
  if(completo) return 'urgencia-pronto';
  if(minutos >= 20) return 'urgencia-alerta';
  if(minutos >= 10) return 'urgencia-medio';
  return 'urgencia-ok';
}

function _iconeCheck(){
  return '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
}

function _iconeSom(ligado){
  if(ligado){
    return '<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 1 0 8"/><path d="M20.5 5.5a10 10 0 0 1 0 13"/><path d="M4 10v4h4l5 4V6l-5 4H4z"/></svg>';
  }
  return '<svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="m19 9-4 4"/><path d="m15 9 4 4"/></svg>';
}

function _textoConta(p){
  var codigo;
  if(p.tipoConta === 'avulsa' || p.tipoConta === 'comanda'){
    codigo = 'C' + (p.numeroSequencial || '');
    if(codigo === 'C') codigo = 'CMD';
  }else{
    codigo = 'M' + (p.mesa || '?');
  }

  var responsavel = p.cliente || p.garcom || '';
  return { codigo: codigo, responsavel: responsavel };
}

function _textoSelecoes(it){
  if(!it.selecoes || !it.selecoes.length) return '';
  return it.selecoes.map(function(s){
    return typeof s === 'string' ? s : (s.nome || s.opcao || '');
  }).filter(Boolean).join(', ');
}

// ─── Monta um card de pedido ───
function montarCardPedido(p){
  var itensCoz = [];
  (p.itens||[]).forEach(function(it, idxReal){
    if(it.status !== 'cancelado' && itemEhDaCozinha(it)){
      itensCoz.push({ item: it, idx: idxReal });
    }
  });
  if(!itensCoz.length) return '';

  var todosProntos = itensCoz.every(function(o){ return o.item.prontoCozinha === true; });
  var qtdProntos = itensCoz.filter(function(o){ return o.item.prontoCozinha === true; }).length;
  var minutos = Math.max(0, Math.floor((Date.now() - (p.criadoEm||Date.now())) / 60000));
  var classeUrgencia = _classeUrgencia(minutos, todosProntos);
  var ehNovo = !_primeiraCarga && !_idsConhecidos[p.id];
  var classeNovo = ehNovo ? ' novo' : '';
  var classeCompleto = todosProntos ? ' completo' : '';

  var conta = _textoConta(p);
  var tagTeste = p.teste ? '<span class="tag-teste">Teste</span>' : '';
  var numPed = p.numeroSequencial ? '#' + p.numeroSequencial : '';
  var pidJs = escapar(JSON.stringify(String(p.id)));

  var indicePrincipal = itensCoz.findIndex(function(o){ return o.item.prontoCozinha !== true; });
  if(indicePrincipal < 0) indicePrincipal = 0;

  var itensHtml = itensCoz.map(function(o, idxMapa){
    var it = o.item;
    var pronto = it.prontoCozinha === true;
    var nome = String(it.nome || '').toUpperCase();
    var obs = it.obs ? '<div class="item-obs">OBS: ' + escapar(it.obs) + '</div>' : '';
    var txtSel = _textoSelecoes(it);
    var sel = txtSel ? '<div class="item-sel">' + escapar(txtSel) + '</div>' : '';
    var classeItem = 'item' + (idxMapa === indicePrincipal ? ' item-principal' : '') + (pronto ? ' pronto' : '');
    return '<div class="' + classeItem + '" data-idx="' + o.idx + '" ' +
      'onclick="marcarItem(' + pidJs + ',' + o.idx + ',' + (pronto?'false':'true') + ')">' +
      '<div class="item-linha">' +
        '<div class="item-nome"><span class="item-qtd-inline">' + (it.qtd||1) + 'x</span>' + escapar(nome) + '</div>' +
        sel + obs +
      '</div>' +
      '<div class="item-check">' + (pronto ? _iconeCheck() : '') + '</div>' +
    '</div>';
  }).join('');

  var responsavelHtml = conta.responsavel
    ? '<span class="pedido-ponto">·</span><span class="pedido-responsavel">' + escapar(conta.responsavel) + '</span>'
    : '';

  var metaHtml = '<div class="pedido-meta">' +
      (numPed ? '<span class="num-ped">' + numPed + '</span>' : '') +
      '<span>' + itensCoz.length + ' ite' + (itensCoz.length === 1 ? 'm' : 'ns') + '</span>' +
    '</div>';

  return '<div class="pedido ' + classeUrgencia + classeNovo + classeCompleto + '" data-pid="' + escapar(p.id) + '">' +
    '<div class="tempo-bloco">' +
      '<div class="tempo-num">' + minutos + '</div>' +
      '<div class="tempo-label">MIN</div>' +
    '</div>' +
    '<div class="pedido-corpo">' +
      '<div class="pedido-cabecalho">' +
        '<div class="pedido-ident">' +
          '<span class="mesa-chip">' + escapar(conta.codigo) + '</span>' + responsavelHtml + tagTeste +
        '</div>' +
        '<div class="pedido-progresso">' + qtdProntos + '/' + itensCoz.length + '</div>' +
      '</div>' +
      metaHtml +
      '<div class="itens">' + itensHtml + '</div>' +
    '</div>' +
    '<div class="pedido-acao"><span class="status-pill">' + (todosProntos ? 'Entrega' : 'Preparo') + '</span></div>' +
  '</div>';
}

// ─── Marca/desmarca um item como pronto no Firestore ───
var _marcandoItem = false;
function marcarItem(pedidoId, idxItem, marcar){
  if(_marcandoItem) return;
  _marcandoItem = true;

  // Acha o pedido na lista local
  var pedido = _pedidosAtivos.find(function(p){ return p.id === pedidoId; });
  if(!pedido || !pedido.itens || !pedido.itens[idxItem]){
    _marcandoItem = false;
    return;
  }

  // Atualiza o array de itens (cópia) com o novo estado
  var novosItens = pedido.itens.map(function(it, i){
    if(i === idxItem){
      return Object.assign({}, it, { prontoCozinha: marcar });
    }
    return it;
  });

  // Atualiza o estado local na hora (pro onSnapshot não "voltar" o item)
  pedido.itens = novosItens;

  // Atualiza SÓ o item tocado na tela — sem recriar os cards (evita piscar)
  _atualizarItemNaTela(pedidoId, idxItem, marcar);
  try{ if(navigator.vibrate) navigator.vibrate(marcar ? 40 : 20); }catch(e){}

  // Salva no Firestore (em background — o onSnapshot confirma depois)
  fbDb.collection('pedidos').doc(pedidoId).update({
    itens: novosItens
  }).then(function(){
    _marcandoItem = false;
  }).catch(function(e){
    _marcandoItem = false;
    console.error('[COZINHA] erro ao marcar item:', e);
    // Reverte visualmente se falhou
    pedido.itens[idxItem].prontoCozinha = !marcar;
    _atualizarItemNaTela(pedidoId, idxItem, !marcar);
  });
}

// Atualiza visualmente UM item (e o estado do card) sem recriar tudo
function _atualizarItemNaTela(pedidoId, idxItem, marcar){
  var card = document.querySelector('.pedido[data-pid="' + pedidoId + '"]');
  if(!card){ renderPedidos(); return; }
  var itemEl = card.querySelector('.item[data-idx="' + idxItem + '"]');
  if(itemEl){
    var chk = itemEl.querySelector('.item-check');
    if(marcar){
      itemEl.classList.add('pronto');
      if(chk) chk.innerHTML = _iconeCheck();
    } else {
      itemEl.classList.remove('pronto');
      if(chk) chk.innerHTML = '';
    }
    itemEl.setAttribute('onclick',
      'marcarItem(' + JSON.stringify(String(pedidoId)) + ',' + idxItem + ',' + (marcar?'false':'true') + ')');
  }

  var pedido = _pedidosAtivos.find(function(p){ return p.id === pedidoId; });
  if(pedido){
    var completo = _pedidoEstaCompleto(pedido);
    var jaCompleto = card.classList.contains('completo');
    if(completo !== jaCompleto){
      renderPedidos();
      return;
    }
    var progressoEl = card.querySelector('.pedido-progresso');
    if(progressoEl){
      var itensCoz = (pedido.itens||[]).filter(function(it){
        return it.status !== 'cancelado' && itemEhDaCozinha(it);
      });
      var prontos = itensCoz.filter(function(it){ return it.prontoCozinha; }).length;
      progressoEl.textContent = prontos + '/' + itensCoz.length;
    }
  }
}


function montarHistorico(){
  if(!_historicoFinalizados.length) return '';

  return '<div class="historico-box">' +
    '<div class="historico-topo">Últimos finalizados</div>' +
    _historicoFinalizados.map(function(h){
      return '<div class="historico-item">' +
        '<span>' + escapar(h.nome) + '</span>' +
        '<span>' + escapar(h.hora) + '</span>' +
      '</div>';
    }).join('') +
  '</div>';
}

// Detecta pedidos concluídos
function verificarHistoricoFinalizados(){
  _pedidosAtivos.forEach(function(p){
    if(_pedidoEstaCompleto(p) && !_idsHistoricoFinalizados[p.id]){
      _idsHistoricoFinalizados[p.id] = true;

      var agora = new Date();
      var hora = String(agora.getHours()).padStart(2,'0') + ':' +
                 String(agora.getMinutes()).padStart(2,'0');

      _historicoFinalizados.unshift({
        nome: p.mesa ? ('Mesa ' + p.mesa) : (p.cliente || 'Pedido'),
        hora: hora
      });

      _pedidosFinalizadosHoje++;

      if(_historicoFinalizados.length > 6){
        _historicoFinalizados.pop();
      }
    }
  });
}


// ─── Utilidades ───
function escapar(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function atualizarRelogio(){
  var agora = new Date();
  var h = String(agora.getHours()).padStart(2,'0');
  var m = String(agora.getMinutes()).padStart(2,'0');
  document.getElementById('relogio').textContent = h + ':' + m;
}

function atualizarPontoConexao(online){
  var ponto = document.getElementById('ponto-conexao');
  if(ponto) ponto.className = 'ponto-conexao' + (online ? '' : ' off');
}

// Liga/desliga o som de alerta
function alternarSom(){
  _somLigado = !_somLigado;
  var btn = document.getElementById('btn-som');
  if(btn){
    btn.innerHTML = _iconeSom(_somLigado);
    btn.setAttribute('aria-label', _somLigado ? 'Som ligado' : 'Som desligado');
    btn.style.opacity = _somLigado ? '1' : '0.55';
  }
  // Os navegadores exigem um clique do usuário pra "liberar" o áudio.
  // Esse clique no botão já serve — toca um bip curtinho de confirmação.
  if(_somLigado){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(Ctx){
        if(!_audioCtx) _audioCtx = new Ctx();
        if(_audioCtx.state === 'suspended') _audioCtx.resume();
        _tocarAlertaPedido();
      }
    }catch(e){}
  }
}

function mostrarErro(titulo, desc){
  var carr = document.getElementById('carregando');
  carr.classList.remove('escondido');
  carr.innerHTML =
    '<div class="erro-box">' +
      '<div class="icone"></div>' +
      '<div class="titulo">' + escapar(titulo) + '</div>' +
      '<div class="desc">' + escapar(desc) + '</div>' +
      '<button onclick="location.reload()">Tentar de novo</button>' +
    '</div>';
}
