<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Ponto Bávaro — Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080808;--surface:#101010;--surface2:#161616;--surface3:#1c1c1c;
  --border:#222;--border2:#2a2a2a;
  --accent:#d4a843;--accent-dim:rgba(212,168,67,0.1);--accent-glow:rgba(212,168,67,0.2);
  --danger:#ff4444;--success:#22c55e;--warning:#f59e0b;--blue:#60a5fa;
  --text:#f0f0f0;--muted:#555;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-font-smoothing:antialiased;}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;}
.ld-logo{width:90px;height:90px;object-fit:contain;filter:drop-shadow(0 0 20px var(--accent-glow));}
.ld-dots{display:flex;gap:6px;}
.ld-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0.3;animation:ldp 1.2s ease-in-out infinite;}
.ld-dot:nth-child(2){animation-delay:0.2s;}.ld-dot:nth-child(3){animation-delay:0.4s;}
@keyframes ldp{0%,100%{opacity:0.2;transform:scale(0.7);}50%{opacity:1;transform:scale(1.1);}}

/* LOGIN */
#login-screen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% -10%,#1e1500 0%,#0d0d0d 45%,#080808 100%);}
.login-box{background:var(--surface);border:1px solid rgba(212,168,67,0.2);border-radius:18px;padding:32px 28px;width:100%;max-width:380px;}
.login-logo{width:70px;height:70px;object-fit:contain;display:block;margin:0 auto 16px;filter:drop-shadow(0 0 12px var(--accent-glow));}
.login-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:0.12em;text-align:center;margin-bottom:2px;}
.login-title span{color:var(--accent);}
.login-sub{font-size:0.68rem;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:24px;}
.campo{margin-bottom:12px;}
.campo label{display:block;font-size:0.62rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px;}
.campo input,.campo select{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:0.92rem;padding:12px 13px;outline:none;transition:border-color 0.2s;}
.campo input:focus,.campo select:focus{border-color:var(--accent);background:var(--surface3);}
.btn-primary{width:100%;background:var(--accent);color:#000;border:none;border-radius:var(--radius);padding:13px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:0.92rem;cursor:pointer;transition:opacity 0.15s;letter-spacing:0.04em;}
.btn-primary:active{opacity:0.8;}
.login-erro{font-size:0.78rem;color:var(--danger);text-align:center;margin-top:10px;min-height:18px;}

/* HEADER */
.header{background:rgba(8,8,8,0.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:10px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;}
.header-logo{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 0 8px var(--accent-glow));}
.header-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:0.1em;flex:1;}
.header-title span{color:var(--accent);}
.header-actions{display:flex;gap:8px;}
.btn-sm{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:8px 14px;font-family:'Space Grotesk',sans-serif;font-size:0.78rem;font-weight:600;cursor:pointer;transition:background 0.15s;white-space:nowrap;}
.btn-sm:hover{background:var(--surface3);}
.btn-sm.accent{background:var(--accent);color:#000;border-color:var(--accent);}
.btn-sm.danger{color:var(--danger);border-color:rgba(255,68,68,0.25);}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 20px;overflow-x:auto;}
.tabs::-webkit-scrollbar{display:none;}
.tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Bebas Neue',sans-serif;font-size:0.95rem;letter-spacing:0.08em;padding:12px 16px;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* CONTEÚDO */
.conteudo{padding:20px;max-width:1200px;margin:0 auto;}

/* CARDS RESUMO */
.resumo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:24px;}
.resumo-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:14px 16px;}
.resumo-label{font-size:0.6rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px;}
.resumo-val{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:0.04em;}

/* CARDS FUNCIONÁRIOS (agora) */
.func-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:24px;}
.func-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;}
.func-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.func-dot.on{background:var(--success);box-shadow:0 0 8px rgba(34,197,94,0.4);animation:sb 2s ease-in-out infinite;}
.func-dot.int{background:var(--warning);}
.func-dot.off{background:var(--muted);}
@keyframes sb{0%,100%{opacity:1;}50%{opacity:0.4;}}
.func-nome{font-weight:600;font-size:0.9rem;}
.func-status{font-size:0.68rem;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.04em;}
.func-horas{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:0.04em;color:var(--muted);margin-left:auto;}

/* FILTROS */
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px;}
.filtro-input{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:9px 12px;font-family:'Space Grotesk',sans-serif;font-size:0.85rem;outline:none;transition:border-color 0.2s;}
.filtro-input:focus{border-color:var(--accent);}

/* TABELA */
.tabela-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border2);}
table{width:100%;border-collapse:collapse;}
thead th{background:var(--surface);padding:11px 14px;text-align:left;font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;border-bottom:1px solid var(--border2);}
tbody td{padding:12px 14px;font-size:0.86rem;border-bottom:1px solid rgba(255,255,255,0.03);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:rgba(212,168,67,0.03);}
.td-mono{font-family:'Bebas Neue',sans-serif;letter-spacing:0.04em;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:0.68rem;font-weight:600;letter-spacing:0.04em;}
.bg-green{background:rgba(34,197,94,0.12);color:var(--success);}
.bg-red{background:rgba(255,68,68,0.12);color:var(--danger);}
.bg-orange{background:rgba(245,158,11,0.12);color:var(--warning);}
.bg-muted{background:var(--surface2);color:var(--muted);}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--surface);border:1px solid rgba(212,168,67,0.2);border-radius:16px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
.modal-titulo{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:0.08em;margin-bottom:18px;color:var(--accent);}
.modal-footer{display:flex;gap:10px;margin-top:18px;}
.modal-footer button{flex:1;}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px 18px;font-size:0.82rem;font-weight:600;opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap;z-index:999;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="loading">
  <img class="ld-logo" src="/icon-192.png" alt="" onerror="this.style.display='none'">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:0.12em;color:var(--accent);">CARREGANDO</div>
  <div class="ld-dots"><div class="ld-dot"></div><div class="ld-dot"></div><div class="ld-dot"></div></div>
</div>

<div id="login-screen">
  <div class="login-box">
    <img class="login-logo" src="/icon-192.png" alt="" onerror="this.style.display='none'">
    <div class="login-title">PONTO <span>BÁVARO</span></div>
    <div class="login-sub">// Painel do Gestor</div>
    <div class="campo"><label>Email</label><input id="g-email" type="email" placeholder="gestor@email.com" autocomplete="email"></div>
    <div class="campo"><label>Senha</label><input id="g-senha" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn-primary" onclick="loginGestor()">Entrar →</button>
    <div class="login-erro" id="g-erro"></div>
  </div>
</div>

<div id="app-gestor" style="display:none;">
  <div class="header">
    <img class="header-logo" src="/icon-192.png" alt="" onerror="this.style.display='none'">
    <div class="header-title">PONTO <span>BÁVARO</span></div>
    <div class="header-actions">
      <button class="btn-sm accent" onclick="abrirModalFunc()">+ Funcionário</button>
      <button class="btn-sm" onclick="exportarCSV()">↓ Exportar</button>
      <button class="btn-sm danger" onclick="logoutGestor()">Sair</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-agora" onclick="trocarTab('agora')">Agora</button>
    <button class="tab" id="tab-historico" onclick="trocarTab('historico')">Histórico</button>
    <button class="tab" id="tab-banco" onclick="trocarTab('banco')">Banco de Horas</button>
    <button class="tab" id="tab-funcionarios" onclick="trocarTab('funcionarios')">Funcionários</button>
  </div>

  <div id="aba-agora" class="conteudo">
    <div class="resumo-grid" id="resumo-agora"></div>
    <div class="func-grid" id="lista-agora"></div>
  </div>

  <div id="aba-historico" class="conteudo" style="display:none;">
    <div class="filtros">
      <input class="filtro-input" id="filt-func" placeholder="Filtrar funcionário..." oninput="renderHistorico()" style="min-width:180px;">
      <input class="filtro-input" id="filt-ini" type="date" onchange="renderHistorico()">
      <input class="filtro-input" id="filt-fim" type="date" onchange="renderHistorico()">
      <button class="btn-sm" onclick="fHoje()">Hoje</button>
      <button class="btn-sm" onclick="fSemana()">Semana</button>
      <button class="btn-sm" onclick="fMes()">Mês</button>
    </div>
    <div class="tabela-wrap">
      <table><thead><tr><th>Funcionário</th><th>Data</th><th>Tipo</th><th>Hora</th><th>Localização</th></tr></thead>
      <tbody id="tbody-historico"></tbody></table>
    </div>
  </div>

  <div id="aba-banco" class="conteudo" style="display:none;">
    <div class="filtros">
      <input class="filtro-input" id="banco-ini" type="date" onchange="renderBanco()">
      <input class="filtro-input" id="banco-fim" type="date" onchange="renderBanco()">
      <button class="btn-sm" onclick="bMes()">Este mês</button>
    </div>
    <div class="tabela-wrap">
      <table><thead><tr><th>Funcionário</th><th>Dias trab.</th><th>Total horas</th><th>Carga esperada</th><th>Saldo</th><th>H. extras</th></tr></thead>
      <tbody id="tbody-banco"></tbody></table>
    </div>
  </div>

  <div id="aba-funcionarios" class="conteudo" style="display:none;">
    <div class="func-grid" id="lista-func"></div>
  </div>
</div>

<!-- Modal funcionário -->
<div class="modal-overlay" id="modal-func">
  <div class="modal-box">
    <div class="modal-titulo" id="modal-func-titulo">NOVO FUNCIONÁRIO</div>
    <div class="campo"><label>Nome completo *</label><input id="f-nome" type="text" placeholder="João Silva"></div>
    <div class="campo"><label>Nome de login * <span style="color:var(--muted);font-style:italic;font-size:0.75em;">(minúsculo, sem espaço)</span></label><input id="f-login" type="text" placeholder="joao"></div>
    <div class="campo"><label>Cargo</label><input id="f-cargo" type="text" placeholder="Garçom, Cozinheiro..."></div>
    <div class="campo"><label>Senha *</label><input id="f-senha" type="text" placeholder="senha123"></div>
    <div class="campo"><label>Carga diária (min) — padrão 440 = 7h20</label><input id="f-carga" type="number" value="440"></div>
    <div class="modal-footer">
      <button class="btn-sm" onclick="fecharModalFunc()">Cancelar</button>
      <button class="btn-sm accent" onclick="salvarFunc()">Salvar</button>
    </div>
    <input type="hidden" id="f-id">
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
var firebaseConfig={apiKey:"AIzaSyBmuVAH50RHsNZ7nAcMCdzulJZf3e86f74",authDomain:"gestao-reataurante.firebaseapp.com",projectId:"gestao-reataurante",storageBucket:"gestao-reataurante.firebasestorage.app",messagingSenderId:"510785409925",appId:"1:510785409925:web:e687e387509fb0605b6aec"};
var CARGA_PAD=440;
var fbDb,fbAuth,_funcs=[],_regs=[],_tab='agora';

window.addEventListener('load',function(){
  firebase.initializeApp(firebaseConfig);
  fbDb=firebase.firestore();
  fbAuth=firebase.auth();
  fbAuth.onAuthStateChanged(function(user){
    document.getElementById('loading').style.display='none';
    if(user){ iniciarGestor(); }
    else{ document.getElementById('login-screen').style.display='flex'; }
  });
  var hoje=dKey(new Date());
  document.getElementById('filt-ini').value=hoje;
  document.getElementById('filt-fim').value=hoje;
  bMes();
});

function loginGestor(){
  var e=document.getElementById('g-email').value.trim();
  var s=document.getElementById('g-senha').value;
  var er=document.getElementById('g-erro');
  er.textContent='';
  fbAuth.signInWithEmailAndPassword(e,s).catch(function(err){
    var m={'auth/wrong-password':'Senha incorreta.','auth/user-not-found':'Email não encontrado.','auth/invalid-email':'Email inválido.'};
    er.textContent=m[err.code]||err.message;
  });
}
function logoutGestor(){ fbAuth.signOut().then(function(){ location.reload(); }); }

function iniciarGestor(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-gestor').style.display='block';
  fbDb.collection('ponto_funcionarios').onSnapshot(function(snap){
    _funcs=[];
    snap.forEach(function(d){ _funcs.push(Object.assign({id:d.id},d.data())); });
    renderFuncs(); renderAgora(); renderBanco();
  });
  var lim=Date.now()-60*24*60*60*1000;
  fbDb.collection('ponto_registros').where('ts','>=',lim).orderBy('ts','desc').onSnapshot(function(snap){
    _regs=[];
    snap.forEach(function(d){ _regs.push(Object.assign({id:d.id},d.data())); });
    renderAgora(); renderHistorico(); renderBanco();
  });
}

function trocarTab(t){
  _tab=t;
  ['agora','historico','banco','funcionarios'].forEach(function(a){
    document.getElementById('aba-'+a).style.display=a===t?'':'none';
    document.getElementById('tab-'+a).classList.toggle('active',a===t);
  });
  if(t==='agora') renderAgora();
  if(t==='historico') renderHistorico();
  if(t==='banco') renderBanco();
  if(t==='funcionarios') renderFuncs();
}

function renderAgora(){
  if(_tab!=='agora') return;
  var hoje=dKey(new Date());
  var regH=_regs.filter(function(r){ return r.diaKey===hoje; });
  var smMap={};
  _funcs.forEach(function(f){ smMap[f.id]={st:'livre',ts:null}; });
  regH.slice().sort(function(a,b){return a.ts-b.ts;}).forEach(function(r){
    if(!smMap[r.funcId]) return;
    var s='livre';
    if(r.tipo==='entrada'||r.tipo==='fim_intervalo') s='trabalhando';
    else if(r.tipo==='ini_intervalo') s='intervalo';
    else if(r.tipo==='saida') s='saiu';
    smMap[r.funcId]={st:s,ts:r.ts};
  });
  var on=_funcs.filter(function(f){return smMap[f.id]&&smMap[f.id].st==='trabalhando';}).length;
  var int=_funcs.filter(function(f){return smMap[f.id]&&smMap[f.id].st==='intervalo';}).length;
  var off=_funcs.filter(function(f){return smMap[f.id]&&['livre','saiu'].includes(smMap[f.id].st);}).length;
  document.getElementById('resumo-agora').innerHTML=
    '<div class="resumo-card"><div class="resumo-label">Trabalhando</div><div class="resumo-val" style="color:var(--success);">'+on+'</div></div>'+
    '<div class="resumo-card"><div class="resumo-label">Intervalo</div><div class="resumo-val" style="color:var(--warning);">'+int+'</div></div>'+
    '<div class="resumo-card"><div class="resumo-label">Fora</div><div class="resumo-val" style="color:var(--muted);">'+off+'</div></div>'+
    '<div class="resumo-card"><div class="resumo-label">Total</div><div class="resumo-val">'+_funcs.length+'</div></div>';
  var labels={trabalhando:'trabalhando',intervalo:'intervalo',livre:'fora',saiu:'saiu'};
  document.getElementById('lista-agora').innerHTML=_funcs.map(function(f){
    var s=smMap[f.id]||{st:'livre',ts:null};
    var dc=s.st==='trabalhando'?'on':s.st==='intervalo'?'int':'off';
    var hr=calcH(regH.filter(function(r){return r.funcId===f.id;}).sort(function(a,b){return a.ts-b.ts;}),s.st);
    return '<div class="func-card">'+
      '<div class="func-dot '+dc+'"></div>'+
      '<div style="flex:1;"><div class="func-nome">'+esc(f.nome||f.nomeLogin)+'</div>'+
      '<div class="func-status">'+(labels[s.st]||'fora')+(s.ts?' · '+fH(new Date(s.ts)):'')+'</div></div>'+
      '<div class="func-horas">'+fMin(hr)+'</div>'+
    '</div>';
  }).join('');
}
setInterval(function(){if(_tab==='agora')renderAgora();},30000);

function renderHistorico(){
  if(_tab!=='historico') return;
  var ff=(document.getElementById('filt-func').value||'').toLowerCase().trim();
  var ini=document.getElementById('filt-ini').value;
  var fim=document.getElementById('filt-fim').value;
  var r=_regs.filter(function(x){
    if(ff&&!(x.funcNome||'').toLowerCase().includes(ff)) return false;
    if(ini&&x.diaKey<ini) return false;
    if(fim&&x.diaKey>fim) return false;
    return true;
  }).sort(function(a,b){return b.ts-a.ts;});
  var labels={entrada:'Entrada',saida:'Saída',ini_intervalo:'Início intervalo',fim_intervalo:'Fim intervalo'};
  var cores={entrada:'bg-green',saida:'bg-red',ini_intervalo:'bg-orange',fim_intervalo:'bg-muted'};
  document.getElementById('tbody-historico').innerHTML=r.map(function(x){
    var loc=x.lat?x.lat.toFixed(4)+', '+x.lng.toFixed(4):'—';
    return '<tr><td>'+esc(x.funcNome||'?')+'</td><td class="td-mono">'+x.diaKey+'</td>'+
      '<td><span class="badge '+(cores[x.tipo]||'bg-muted')+'">'+(labels[x.tipo]||x.tipo)+'</span></td>'+
      '<td class="td-mono">'+fH(new Date(x.ts))+'</td>'+
      '<td style="font-size:0.74rem;color:var(--muted);">'+loc+'</td></tr>';
  }).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px;">Nenhum registro no período.</td></tr>';
}

function fHoje(){ var h=dKey(new Date()); document.getElementById('filt-ini').value=h; document.getElementById('filt-fim').value=h; renderHistorico(); }
function fSemana(){ var n=new Date(),d=new Date(n); d.setDate(n.getDate()-n.getDay()); document.getElementById('filt-ini').value=dKey(d); document.getElementById('filt-fim').value=dKey(n); renderHistorico(); }
function fMes(){ var n=new Date(); document.getElementById('filt-ini').value=n.getFullYear()+'-'+pad(n.getMonth()+1)+'-01'; document.getElementById('filt-fim').value=dKey(n); renderHistorico(); }

function bMes(){ var n=new Date(); document.getElementById('banco-ini').value=n.getFullYear()+'-'+pad(n.getMonth()+1)+'-01'; document.getElementById('banco-fim').value=dKey(n); renderBanco(); }

function renderBanco(){
  if(_tab!=='banco') return;
  var ini=document.getElementById('banco-ini').value;
  var fim=document.getElementById('banco-fim').value;
  if(!ini||!fim) return;
  var diasP=diasUteis(ini,fim);
  document.getElementById('tbody-banco').innerHTML=_funcs.map(function(f){
    var carga=f.cargaMin||CARGA_PAD;
    var rf=_regs.filter(function(r){return r.funcId===f.id&&r.diaKey>=ini&&r.diaKey<=fim;}).sort(function(a,b){return a.ts-b.ts;});
    var porDia={};
    rf.forEach(function(r){if(!porDia[r.diaKey])porDia[r.diaKey]=[];porDia[r.diaKey].push(r);});
    var diasT=Object.keys(porDia).length;
    var totMin=0;
    Object.values(porDia).forEach(function(regs){totMin+=calcH(regs,'saiu');});
    var cargaT=diasP*carga;
    var saldo=totMin-cargaT;
    var extra=Math.max(0,saldo);
    return '<tr><td>'+esc(f.nome||f.nomeLogin)+'</td>'+
      '<td class="td-mono">'+diasT+' / '+diasP+'</td>'+
      '<td class="td-mono">'+fMin(totMin)+'</td>'+
      '<td class="td-mono" style="color:var(--muted);">'+fMin(cargaT)+'</td>'+
      '<td class="td-mono" style="color:'+(saldo>=0?'var(--success)':'var(--danger)')+';">'+(saldo>=0?'+':'')+fMin(saldo)+'</td>'+
      '<td class="td-mono" style="color:'+(extra>0?'var(--warning)':'var(--muted)')+';">'+fMin(extra)+'</td></tr>';
  }).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px;">Nenhum dado.</td></tr>';
}

function diasUteis(ini,fim){
  var a=new Date(ini+'T00:00:00'),b=new Date(fim+'T00:00:00'),c=0,x=new Date(a);
  while(x<=b){if(x.getDay()!==0)c++;x.setDate(x.getDate()+1);}
  return c;
}

function renderFuncs(){
  if(_tab!=='funcionarios') return;
  var h=_funcs.map(function(f){
    return '<div class="func-card" style="flex-direction:column;align-items:flex-start;gap:10px;">'+
      '<div style="width:100%;"><div class="func-nome">'+esc(f.nome||f.nomeLogin)+'</div>'+
      '<div class="func-status">'+esc(f.cargo||'funcionário')+' · login: '+esc(f.nomeLogin)+'</div></div>'+
      '<div style="display:flex;gap:8px;width:100%;">'+
        '<button class="btn-sm" style="flex:1;" onclick="editarFunc(\''+f.id+'\')">Editar</button>'+
        '<button class="btn-sm danger" onclick="excluirFunc(\''+f.id+'\',\''+esc(f.nome||f.nomeLogin)+'\')">Excluir</button>'+
      '</div>'+
    '</div>';
  }).join('');
  document.getElementById('lista-func').innerHTML=h||'<div style="color:var(--muted);padding:40px;text-align:center;grid-column:1/-1;">Nenhum funcionário. Toque em "+ Funcionário" pra começar.</div>';
}

function abrirModalFunc(){
  ['f-id','f-nome','f-login','f-cargo','f-senha'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('f-carga').value='440';
  document.getElementById('modal-func-titulo').textContent='NOVO FUNCIONÁRIO';
  document.getElementById('modal-func').classList.add('show');
}
function fecharModalFunc(){ document.getElementById('modal-func').classList.remove('show'); }
function editarFunc(id){
  var f=_funcs.find(function(x){return x.id===id;});
  if(!f) return;
  document.getElementById('f-id').value=f.id;
  document.getElementById('f-nome').value=f.nome||'';
  document.getElementById('f-login').value=f.nomeLogin||'';
  document.getElementById('f-cargo').value=f.cargo||'';
  document.getElementById('f-senha').value=f.senha||'';
  document.getElementById('f-carga').value=f.cargaMin||440;
  document.getElementById('modal-func-titulo').textContent='EDITAR FUNCIONÁRIO';
  document.getElementById('modal-func').classList.add('show');
}
function salvarFunc(){
  var id=document.getElementById('f-id').value;
  var nome=document.getElementById('f-nome').value.trim();
  var login=document.getElementById('f-login').value.trim().toLowerCase().replace(/\s+/g,'-');
  var cargo=document.getElementById('f-cargo').value.trim();
  var senha=document.getElementById('f-senha').value.trim();
  var carga=parseInt(document.getElementById('f-carga').value)||440;
  if(!nome||!login||!senha){ showToast('Preencha nome, login e senha',true); return; }
  var d={nome:nome,nomeLogin:login,cargo:cargo,senha:senha,cargaMin:carga,ativo:true};
  var p=id?fbDb.collection('ponto_funcionarios').doc(id).update(d):fbDb.collection('ponto_funcionarios').add(d);
  p.then(function(){ fecharModalFunc(); showToast(id?'Atualizado ✓':'Cadastrado ✓'); }).catch(function(e){ showToast('Erro: '+e.message,true); });
}
function excluirFunc(id,nome){
  if(!confirm('Excluir "'+nome+'"? Os registros serão mantidos.')) return;
  fbDb.collection('ponto_funcionarios').doc(id).delete().then(function(){ showToast('Excluído'); }).catch(function(e){ showToast('Erro: '+e.message,true); });
}

function exportarCSV(){
  var ini=document.getElementById('filt-ini').value||dKey(new Date());
  var fim=document.getElementById('filt-fim').value||dKey(new Date());
  var r=_regs.filter(function(x){return x.diaKey>=ini&&x.diaKey<=fim;}).sort(function(a,b){return a.ts-b.ts;});
  var labels={entrada:'Entrada',saida:'Saída',ini_intervalo:'Início intervalo',fim_intervalo:'Fim intervalo'};
  var csv=['Funcionário,Data,Tipo,Hora,Latitude,Longitude'].concat(r.map(function(x){
    return['"'+(x.funcNome||'')+'"',x.diaKey,labels[x.tipo]||x.tipo,fH(new Date(x.ts)),x.lat||'',x.lng||''].join(',');
  })).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download='ponto_'+ini+'_'+fim+'.csv';
  a.click();
  showToast('CSV exportado ✓');
}

function calcH(regs,statusAtual){
  var tot=0,entTs=null,iniInt=null,agora=Date.now();
  regs.forEach(function(r){
    if(r.tipo==='entrada'){entTs=r.ts;}
    else if(r.tipo==='ini_intervalo'&&entTs){tot+=(r.ts-entTs)/60000;iniInt=r.ts;entTs=null;}
    else if(r.tipo==='fim_intervalo'){iniInt=null;entTs=r.ts;}
    else if(r.tipo==='saida'&&entTs){tot+=(r.ts-entTs)/60000;entTs=null;}
  });
  if(statusAtual==='trabalhando'&&entTs) tot+=(agora-entTs)/60000;
  return Math.floor(tot);
}

function dKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fH(d){return pad(d.getHours())+':'+pad(d.getMinutes());}
function pad(n){return String(n).padStart(2,'0');}
function fMin(m){
  var abs=Math.abs(Math.round(m));var h=Math.floor(abs/60);var min=abs%60;
  return(m<0?'-':'')+(h>0?h+'h ':'')+pad(min)+'m';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg,erro){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.style.borderColor=erro?'var(--danger)':'var(--accent)';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},3000);
}
</script>
