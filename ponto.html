<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ponto Bávaro">
<title>Ponto — Bávaro</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080808;--surface:#101010;--surface2:#161616;--surface3:#1c1c1c;
  --border:#222;--border2:#2a2a2a;
  --accent:#d4a843;--accent-dim:rgba(212,168,67,0.1);--accent-glow:rgba(212,168,67,0.25);
  --danger:#ff4444;--success:#22c55e;--warning:#f59e0b;--blue:#60a5fa;
  --text:#f0f0f0;--muted:#666;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-font-smoothing:antialiased;}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden;}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:20px;}
.ld-logo{width:100px;height:100px;object-fit:contain;filter:drop-shadow(0 0 20px var(--accent-glow));}
.ld-dots{display:flex;gap:6px;}
.ld-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0.3;animation:ldp 1.2s ease-in-out infinite;}
.ld-dot:nth-child(2){animation-delay:0.2s;} .ld-dot:nth-child(3){animation-delay:0.4s;}
@keyframes ldp{0%,100%{opacity:0.2;transform:scale(0.7);}50%{opacity:1;transform:scale(1.1);}}

/* ── LOGIN ── */
#login-screen{display:none;flex-direction:column;min-height:100dvh;background:radial-gradient(ellipse at 50% -10%,#1e1500 0%,#0d0d0d 45%,#080808 100%);}
.login-hero{display:flex;flex-direction:column;align-items:center;padding:56px 24px 32px;}
.login-logo{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 0 24px var(--accent-glow));margin-bottom:16px;}
.login-titulo{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:0.14em;text-align:center;line-height:1;}
.login-titulo span{color:var(--accent);}
.login-sub{font-size:0.72rem;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-top:6px;}
.login-form{padding:8px 24px 40px;display:flex;flex-direction:column;gap:14px;max-width:400px;width:100%;margin:0 auto;}
.form-label{font-size:0.62rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;display:block;margin-bottom:5px;}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:0.95rem;padding:13px 14px;outline:none;transition:border-color 0.2s;}
.form-input:focus{border-color:var(--accent);background:var(--surface3);}
.btn-primary{width:100%;background:var(--accent);color:#000;border:none;border-radius:var(--radius);padding:14px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:0.95rem;cursor:pointer;transition:opacity 0.15s;letter-spacing:0.04em;}
.btn-primary:active{opacity:0.8;}
.login-erro{font-size:0.8rem;color:var(--danger);text-align:center;min-height:18px;}

/* ── APP ── */
#app{display:none;flex-direction:column;min-height:100dvh;}
.app-header{
  background:rgba(8,8,8,0.97);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:10px 16px;position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:12px;
}
.app-header-logo{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 0 8px var(--accent-glow));}
.app-header-info{flex:1;}
.app-header-nome{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:0.08em;line-height:1;color:var(--accent);}
.app-header-cargo{font-size:0.66rem;color:var(--muted);letter-spacing:0.04em;text-transform:uppercase;}
.btn-sair{background:transparent;border:1px solid var(--border2);color:var(--muted);border-radius:8px;padding:7px 14px;font-family:'Space Grotesk',sans-serif;font-size:0.75rem;cursor:pointer;transition:border-color 0.15s;}
.btn-sair:hover{border-color:var(--danger);color:var(--danger);}

/* Relógio */
.relogio-wrap{padding:32px 20px 20px;text-align:center;background:radial-gradient(ellipse at 50% 0%,rgba(212,168,67,0.06) 0%,transparent 60%);}
.relogio{font-family:'Bebas Neue',sans-serif;font-size:4.5rem;letter-spacing:0.04em;line-height:1;color:var(--text);}
.data-hoje{font-size:0.75rem;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:0.1em;}

/* Status */
.status-card{margin:0 16px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:16px 18px;}
.status-label{font-size:0.6rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;}
.status-row{display:flex;align-items:center;gap:10px;}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.status-dot.livre{background:var(--muted);}
.status-dot.trabalhando{background:var(--success);box-shadow:0 0 8px rgba(34,197,94,0.5);animation:sb 2s ease-in-out infinite;}
.status-dot.intervalo{background:var(--warning);box-shadow:0 0 8px rgba(245,158,11,0.5);}
@keyframes sb{0%,100%{opacity:1;}50%{opacity:0.4;}}
.status-text{font-weight:600;font-size:0.92rem;}
.status-since{font-size:0.72rem;color:var(--muted);margin-top:4px;}

/* Horas grid */
.horas-grid{margin:12px 16px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.hora-item{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:12px 10px;text-align:center;}
.hora-item-label{font-size:0.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-bottom:5px;}
.hora-item-val{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:0.04em;}

/* Botões ação */
.acoes{padding:20px 16px;display:flex;flex-direction:column;gap:10px;}
.btn-acao{
  width:100%;border:none;border-radius:var(--radius);padding:18px;
  font-family:'Bebas Neue',sans-serif;letter-spacing:0.08em;font-size:1.15rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform 0.1s,opacity 0.15s;
}
.btn-acao:active{transform:scale(0.97);}
.btn-acao:disabled{opacity:0.35;cursor:not-allowed;}
.btn-entrada{background:var(--success);color:#000;}
.btn-saida{background:var(--danger);color:#fff;}
.btn-intervalo-ini{background:var(--warning);color:#000;}
.btn-intervalo-fim{background:var(--blue);color:#000;}

/* Histórico */
.historico{padding:0 16px 40px;}
.historico-title{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:0.08em;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.historico-title::after{content:'';flex:1;height:1px;background:var(--border);}
.reg-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.reg-item:last-child{border-bottom:none;}
.reg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.reg-info{flex:1;}
.reg-tipo{font-size:0.84rem;font-weight:600;}
.reg-loc{font-size:0.68rem;color:var(--muted);margin-top:2px;}
.reg-hora{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:0.04em;color:var(--muted);}

/* Modal selfie */
#modal-selfie{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.96);z-index:800;
  flex-direction:column;align-items:center;justify-content:center;padding:24px;
}
#modal-selfie.show{display:flex;}
.selfie-logo{width:50px;height:50px;object-fit:contain;margin-bottom:16px;opacity:0.6;}
.selfie-titulo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:0.1em;margin-bottom:4px;}
.selfie-sub{font-size:0.78rem;color:var(--muted);text-align:center;margin-bottom:20px;line-height:1.5;}
.selfie-ring{
  position:relative;width:260px;height:260px;border-radius:50%;
  border:3px solid var(--accent);
  box-shadow:0 0 30px var(--accent-glow),inset 0 0 30px rgba(0,0,0,0.5);
  overflow:hidden;margin-bottom:24px;
}
#selfie-video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
#selfie-canvas{display:none;}
.btn-capturar{
  background:var(--accent);color:#000;border:none;border-radius:var(--radius);
  padding:15px 40px;font-family:'Bebas Neue',sans-serif;letter-spacing:0.08em;font-size:1.1rem;
  cursor:pointer;margin-bottom:12px;transition:opacity 0.15s;
}
.btn-capturar:active{opacity:0.8;}
.btn-cancelar-selfie{background:transparent;border:1px solid var(--border2);color:var(--muted);border-radius:10px;padding:11px 28px;font-family:'Space Grotesk',sans-serif;font-size:0.85rem;cursor:pointer;}

/* Toast */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:11px 20px;font-size:0.85rem;font-weight:600;opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap;z-index:900;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="loading">
  <img class="ld-logo" src="/icon-192.png" alt="Bávaro" onerror="this.style.display='none'">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:0.12em;color:var(--accent);">PONTO BÁVARO</div>
  <div class="ld-dots"><div class="ld-dot"></div><div class="ld-dot"></div><div class="ld-dot"></div></div>
</div>

<div id="login-screen">
  <div class="login-hero">
    <img class="login-logo" src="/icon-192.png" alt="Bávaro" onerror="this.style.display='none'">
    <div class="login-titulo">PONTO <span>BÁVARO</span></div>
    <div class="login-sub">Registro de ponto eletrônico</div>
  </div>
  <div class="login-form">
    <div><label class="form-label">Seu nome</label><input class="form-input" id="login-nome" type="text" placeholder="Como você é chamado" autocomplete="name" autocapitalize="words"></div>
    <div><label class="form-label">Senha</label><input class="form-input" id="login-senha" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn-primary" onclick="fazerLogin()">Entrar →</button>
    <div class="login-erro" id="login-erro"></div>
  </div>
</div>

<div id="app">
  <div class="app-header">
    <img class="app-header-logo" src="/icon-192.png" alt="" onerror="this.style.display='none'">
    <div class="app-header-info">
      <div class="app-header-nome" id="app-nome">—</div>
      <div class="app-header-cargo" id="app-cargo">funcionário</div>
    </div>
    <button class="btn-sair" onclick="fazerLogout()">Sair</button>
  </div>

  <div class="relogio-wrap">
    <div class="relogio" id="relogio">00:00:00</div>
    <div class="data-hoje" id="data-hoje">—</div>
  </div>

  <div class="status-card">
    <div class="status-label">Status atual</div>
    <div class="status-row">
      <div class="status-dot livre" id="status-dot"></div>
      <div class="status-text" id="status-text">Fora do trabalho</div>
    </div>
    <div class="status-since" id="status-since"></div>
  </div>

  <div class="horas-grid">
    <div class="hora-item"><div class="hora-item-label">Trabalhadas</div><div class="hora-item-val" id="h-trabalhadas">—</div></div>
    <div class="hora-item"><div class="hora-item-label">Intervalo</div><div class="hora-item-val" id="h-intervalo">—</div></div>
    <div class="hora-item"><div class="hora-item-label">Saldo</div><div class="hora-item-val" id="h-saldo" style="color:var(--muted);">—</div></div>
  </div>

  <div class="acoes" id="acoes"></div>

  <div class="historico">
    <div class="historico-title">Registros de hoje</div>
    <div id="historico-lista"><div style="color:var(--muted);font-size:0.82rem;padding:12px 0;">Nenhum registro ainda.</div></div>
  </div>
</div>

<div id="modal-selfie">
  <img class="selfie-logo" src="/icon-192.png" alt="" onerror="this.style.display='none'">
  <div class="selfie-titulo">CONFIRME SUA PRESENÇA</div>
  <div class="selfie-sub">Posicione seu rosto dentro do círculo<br>e toque em "Registrar"</div>
  <div class="selfie-ring"><video id="selfie-video" autoplay playsinline muted></video></div>
  <canvas id="selfie-canvas" width="260" height="260"></canvas>
  <button class="btn-capturar" onclick="capturarSelfie()">📸 REGISTRAR</button>
  <button class="btn-cancelar-selfie" onclick="cancelarSelfie()">Cancelar</button>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
var firebaseConfig={apiKey:"AIzaSyBmuVAH50RHsNZ7nAcMCdzulJZf3e86f74",authDomain:"gestao-reataurante.firebaseapp.com",projectId:"gestao-reataurante",storageBucket:"gestao-reataurante.firebasestorage.app",messagingSenderId:"510785409925",appId:"1:510785409925:web:e687e387509fb0605b6aec"};
var CARGA_MIN=440;
var fbDb,fbAuth,_func=null,_registroHoje=[],_unsubReg=null,_acaoPendente=null,_streamSelfie=null;

window.addEventListener('load',function(){
  firebase.initializeApp(firebaseConfig);
  fbDb=firebase.firestore();
  fbAuth=firebase.auth();
  iniciarRelogio();
  // Verifica se já tem sessão salva no localStorage
  var funcId=localStorage.getItem('ponto_funcId');
  if(funcId){
    carregarFuncPorId(funcId);
  } else {
    esconderLoad();
    mostrarLogin();
  }
});

function esconderLoad(){ document.getElementById('loading').style.display='none'; }
function mostrarLogin(){ document.getElementById('login-screen').style.display='flex'; }
function mostrarApp(){ document.getElementById('login-screen').style.display='none'; document.getElementById('app').style.display='flex'; }

function iniciarRelogio(){
  var dias=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  var meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  function tick(){
    var n=new Date();
    document.getElementById('relogio').textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
    document.getElementById('data-hoje').textContent=dias[n.getDay()]+', '+n.getDate()+' '+meses[n.getMonth()]+' '+n.getFullYear();
    atualizarHoras();
  }
  tick(); setInterval(tick,1000);
}

function fazerLogin(){
  var nome=document.getElementById('login-nome').value.trim();
  var senha=document.getElementById('login-senha').value;
  var erro=document.getElementById('login-erro');
  erro.textContent='';
  if(!nome||!senha){ erro.textContent='Preencha nome e senha.'; return; }
  erro.textContent='Verificando...';
  // Busca pelo nome de login (case-insensitive)
  fbDb.collection('ponto_funcionarios')
    .where('nomeLogin','==',nome.toLowerCase())
    .limit(1).get()
    .then(function(snap){
      if(snap.empty){
        // Tenta também pelo nome completo em minúsculo
        return fbDb.collection('ponto_funcionarios')
          .where('nomeLogin','==',nome.trim().toLowerCase().replace(/\s+/g,'-'))
          .limit(1).get()
          .then(function(snap2){
            if(snap2.empty){ erro.textContent='Funcionário não encontrado.'; return null; }
            return snap2.docs[0];
          });
      }
      return snap.docs[0];
    })
    .then(function(doc){
      if(!doc) return;
      var d=doc.data();
      if(d.senha!==senha){ erro.textContent='Senha incorreta.'; return; }
      // Salva sessão no localStorage (simples e sem depender de Auth anônimo)
      _func=Object.assign({id:doc.id},d);
      localStorage.setItem('ponto_funcId', doc.id);
      erro.textContent='';
      esconderLoad();
      mostrarApp();
      iniciarAppFunc();
    })
    .catch(function(e){ erro.textContent='Erro: '+e.message; });
}

function carregarFuncPorId(id){
  fbDb.collection('ponto_funcionarios').doc(id).get()
    .then(function(doc){
      esconderLoad();
      if(!doc.exists){ localStorage.removeItem('ponto_funcId'); mostrarLogin(); return; }
      _func=Object.assign({id:doc.id},doc.data());
      mostrarApp();
      iniciarAppFunc();
    })
    .catch(function(){ esconderLoad(); mostrarLogin(); });
}

function fazerLogout(){
  if(_unsubReg) _unsubReg();
  localStorage.removeItem('ponto_funcId');
  location.reload();
}

function iniciarAppFunc(){
  document.getElementById('app-nome').textContent=_func.nome||_func.nomeLogin;
  document.getElementById('app-cargo').textContent=_func.cargo||'funcionário';
  // Renderiza botões imediatamente (status = livre por padrão)
  // enquanto o listener carrega os dados do dia
  renderStatus(); renderBotoes(); renderHistorico();
  escutarRegistros();
}

function escutarRegistros(){
  if(_unsubReg) _unsubReg();
  var hoje=diaKey(new Date());
  // Sem orderBy pra não exigir índice composto no Firestore
  // Ordena em JS depois de receber
  _unsubReg=fbDb.collection('ponto_registros')
    .where('funcId','==',_func.id)
    .where('diaKey','==',hoje)
    .onSnapshot(function(snap){
      _registroHoje=[];
      snap.forEach(function(d){ _registroHoje.push(Object.assign({id:d.id},d.data())); });
      // Ordena por timestamp crescente em JS
      _registroHoje.sort(function(a,b){ return a.ts-b.ts; });
      renderStatus(); renderBotoes(); renderHistorico();
    },function(e){
      console.warn('Erro listener registros:',e);
      // Mesmo com erro, mantém os botões visíveis
      renderStatus(); renderBotoes();
    });
}

function getStatus(){
  if(!_registroHoje.length) return 'livre';
  var u=_registroHoje[_registroHoje.length-1];
  if(u.tipo==='entrada'||u.tipo==='fim_intervalo') return 'trabalhando';
  if(u.tipo==='ini_intervalo') return 'intervalo';
  if(u.tipo==='saida') return 'saiu';
  return 'livre';
}

function renderStatus(){
  var st=getStatus();
  var dot=document.getElementById('status-dot');
  dot.className='status-dot '+(st==='trabalhando'?'trabalhando':st==='intervalo'?'intervalo':'livre');
  var labels={livre:'Fora do trabalho',trabalhando:'Trabalhando',intervalo:'Em intervalo',saiu:'Turno encerrado'};
  document.getElementById('status-text').textContent=labels[st]||'Fora do trabalho';
  var ts=_registroHoje.length?_registroHoje[_registroHoje.length-1].ts:null;
  document.getElementById('status-since').textContent=ts?'desde '+fmtH(new Date(ts)):'';
}

function renderBotoes(){
  var st=getStatus();
  var d=document.getElementById('acoes');
  var h='';
  if(st==='livre') h='<button class="btn-acao btn-entrada" onclick="iniciarAcao(\'entrada\')">▶ REGISTRAR ENTRADA</button>';
  else if(st==='trabalhando') h='<button class="btn-acao btn-intervalo-ini" onclick="iniciarAcao(\'ini_intervalo\')">⏸ INICIAR INTERVALO</button><button class="btn-acao btn-saida" onclick="iniciarAcao(\'saida\')">■ REGISTRAR SAÍDA</button>';
  else if(st==='intervalo') h='<button class="btn-acao btn-intervalo-fim" onclick="iniciarAcao(\'fim_intervalo\')">▶ VOLTAR DO INTERVALO</button>';
  else if(st==='saiu') h='<div style="text-align:center;padding:20px;color:var(--muted);font-size:0.88rem;">Turno encerrado. Até amanhã! 👋</div>';
  d.innerHTML=h;
}

function calcHoras(){
  var totMs=0,intMs=0,entTs=null,iniIntTs=null,agora=Date.now();
  _registroHoje.forEach(function(r){
    if(r.tipo==='entrada'){ entTs=r.ts; }
    else if(r.tipo==='ini_intervalo'&&entTs){ totMs+=r.ts-entTs; iniIntTs=r.ts; entTs=null; }
    else if(r.tipo==='fim_intervalo'){ if(iniIntTs) intMs+=r.ts-iniIntTs; iniIntTs=null; entTs=r.ts; }
    else if(r.tipo==='saida'&&entTs){ totMs+=r.ts-entTs; entTs=null; }
  });
  var st=getStatus();
  if(st==='trabalhando'&&entTs) totMs+=agora-entTs;
  if(st==='intervalo'&&iniIntTs) intMs+=agora-iniIntTs;
  return{trab:Math.floor(totMs/60000),int:Math.floor(intMs/60000)};
}

function atualizarHoras(){
  if(!_func) return;
  var c=calcHoras();
  document.getElementById('h-trabalhadas').textContent=c.trab>0?fmtMin(c.trab):'—';
  document.getElementById('h-intervalo').textContent=c.int>0?fmtMin(c.int):'—';
  var saldo=c.trab-CARGA_MIN;
  var sEl=document.getElementById('h-saldo');
  if(c.trab===0){ sEl.textContent='—'; sEl.style.color='var(--muted)'; return; }
  sEl.textContent=(saldo>=0?'+':'')+fmtMin(saldo);
  sEl.style.color=saldo>=0?'var(--success)':'var(--danger)';
}

function renderHistorico(){
  var lista=document.getElementById('historico-lista');
  if(!_registroHoje.length){ lista.innerHTML='<div style="color:var(--muted);font-size:0.82rem;padding:12px 0;">Nenhum registro ainda.</div>'; return; }
  var labels={entrada:'Entrada',saida:'Saída',ini_intervalo:'Início intervalo',fim_intervalo:'Fim intervalo'};
  var cores={entrada:'var(--success)',saida:'var(--danger)',ini_intervalo:'var(--warning)',fim_intervalo:'var(--blue)'};
  lista.innerHTML=_registroHoje.map(function(r){
    var loc=r.lat?'📍 '+r.lat.toFixed(4)+', '+r.lng.toFixed(4):'';
    return '<div class="reg-item">'+
      '<div class="reg-dot" style="background:'+(cores[r.tipo]||'var(--muted)')+'"></div>'+
      '<div class="reg-info"><div class="reg-tipo">'+(labels[r.tipo]||r.tipo)+'</div>'+(loc?'<div class="reg-loc">'+loc+'</div>':'')+'</div>'+
      '<div class="reg-hora">'+fmtH(new Date(r.ts))+'</div>'+
    '</div>';
  }).join('');
}

function iniciarAcao(tipo){ _acaoPendente={tipo:tipo}; abrirSelfie(); }

function abrirSelfie(){
  document.getElementById('modal-selfie').classList.add('show');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false})
    .then(function(s){ _streamSelfie=s; document.getElementById('selfie-video').srcObject=s; })
    .catch(function(){ document.getElementById('modal-selfie').classList.remove('show'); registrarPonto(null,null); });
}

function cancelarSelfie(){ pararCam(); document.getElementById('modal-selfie').classList.remove('show'); _acaoPendente=null; }
function pararCam(){ if(_streamSelfie){ _streamSelfie.getTracks().forEach(function(t){t.stop();}); _streamSelfie=null; } }

function capturarSelfie(){
  var v=document.getElementById('selfie-video');
  var c=document.getElementById('selfie-canvas');
  var ctx=c.getContext('2d');
  ctx.save(); ctx.scale(-1,1); ctx.drawImage(v,-260,0,260,260); ctx.restore();
  var foto=c.toDataURL('image/jpeg',0.6);
  pararCam(); document.getElementById('modal-selfie').classList.remove('show');
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      function(p){ registrarPonto(foto,{lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}); },
      function(){ registrarPonto(foto,null); },
      {timeout:8000,maximumAge:30000}
    );
  } else { registrarPonto(foto,null); }
}

function registrarPonto(foto,coords){
  if(!_acaoPendente||!_func) return;
  var tipo=_acaoPendente.tipo; _acaoPendente=null;
  var agora=Date.now(); var hoje=diaKey(new Date());
  var reg={funcId:_func.id,funcNome:_func.nome||_func.nomeLogin,tipo:tipo,ts:agora,diaKey:hoje,registradoEm:agora};
  if(coords){ reg.lat=coords.lat; reg.lng=coords.lng; reg.acc=coords.acc; }
  if(foto) reg.foto=foto;
  fbDb.collection('ponto_registros').add(reg).then(function(){
    var labels={entrada:'Entrada registrada ✓',saida:'Saída registrada ✓',ini_intervalo:'Intervalo iniciado',fim_intervalo:'Voltou do intervalo ✓'};
    showToast(labels[tipo]||'Registrado ✓');
  }).catch(function(e){ showToast('Erro: '+e.message,true); });
}

function diaKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtH(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtMin(m){
  var abs=Math.abs(m); var h=Math.floor(abs/60); var min=abs%60;
  return (m<0?'-':'')+(h>0?h+'h ':'')+pad(min)+'m';
}
function showToast(msg,erro){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.style.borderColor=erro?'var(--danger)':'var(--accent)';
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); },3000);
}
</script>
