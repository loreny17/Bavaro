<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Prinzen · Relatórios</title>
<link rel="manifest" id="pwa-manifest">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Relatórios">
<link rel="apple-touch-icon" href="relatorios-icon-512.png">
<script>
// Injeta manifest dinamicamente com ícone base64
var iconB64 = new URL('relatorios-icon-512.png', location.href).href;
var manifest = {
  name: 'Prinzen · Relatórios',
  short_name: 'Relatórios',
  description: 'Relatórios de vendas Prinzen',
  start_url: '.',
  display: 'standalone',
  background_color: '#080808',
  theme_color: '#080808',
  orientation: 'portrait',
  icons: [
    {src: iconB64, sizes: '512x512', type: 'image/png', purpose: 'any maskable'},
    {src: iconB64, sizes: '192x192', type: 'image/png'}
  ]
};
var blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);
</script>
<link rel="apple-touch-icon" href="relatorios-icon-512.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Bebas+Neue&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#080808;--surface:#121212;--surface2:#1a1a1a;--surface3:#222;
    --border:#242424;--border2:#333;--text:#f0ede8;--muted:#8a8a8a;
    --accent:#d4a843;--accent2:#b8922e;--success:#4ade80;--danger:#f87171;
    --blue1:#3b82f6;--blue2:#1d4ed8;--green1:#22c55e;--green2:#15803d;
    --font:'Space Grotesk',sans-serif;--display:'Bebas Neue',sans-serif;
  }
  html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased;}

  /* ── HEADER ── */
  .app-header{
    background:rgba(8,8,8,0.85);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:14px 18px;display:flex;align-items:center;gap:12px;
    position:sticky;top:0;z-index:50;
  }
  .app-logo{font-family:var(--display);font-size:1.6rem;color:var(--accent);letter-spacing:0.04em;line-height:1;}
  .app-sub{font-size:0.72rem;color:var(--muted);margin-top:2px;}
  .app-header-right{margin-left:auto;display:flex;align-items:center;gap:10px;}

  /* ── CONTAINER ── */
  .container{max-width:480px;margin:0 auto;padding:18px 16px 60px;}

  /* ── RESTAURANTE ── */
  .restaurante-bar{
    display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin-bottom:6px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--border);
  }
  .restaurante-bar::-webkit-scrollbar{display:none;}
  .rest-btn{
    flex:0 0 auto;display:flex;align-items:center;gap:7px;
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    border-radius:14px;padding:9px 14px;font-family:var(--font);font-size:0.85rem;font-weight:600;
    cursor:pointer;white-space:nowrap;transition:all .15s;
  }
  .rest-btn:hover{border-color:var(--border2);}
  .rest-btn.active{
    background:linear-gradient(135deg,var(--blue1),var(--blue2));border-color:transparent;color:#fff;
    box-shadow:0 6px 18px -8px rgba(37,99,235,0.6);
  }
  .rest-count{
    font-size:0.7rem;font-weight:700;background:rgba(255,255,255,0.18);color:inherit;
    padding:1px 7px;border-radius:9px;line-height:1.5;
  }
  .rest-btn:not(.active) .rest-count{background:var(--surface3);color:var(--muted);}

  /* ── PERÍODO ── */
  .periodo-bar{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .periodo-bar::-webkit-scrollbar{display:none;}
  .periodo-btn{
    flex:0 0 auto;background:var(--surface2);border:1px solid var(--border);
    color:var(--muted);border-radius:999px;padding:8px 16px;font-family:var(--font);
    font-size:0.8rem;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s;
  }
  .periodo-btn:hover{border-color:var(--border2);color:var(--text);}
  .periodo-btn.active{
    background:var(--accent);border-color:var(--accent);color:#0a0a0a;font-weight:600;
  }
  .periodo-custom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);
    border:1px solid var(--border);border-radius:14px;padding:12px;}
  .periodo-custom input[type=date]{
    background:var(--surface2);border:1px solid var(--border2);color:var(--text);
    border-radius:8px;padding:8px 10px;font-family:var(--font);font-size:0.8rem;color-scheme:dark;
  }
  .btn-buscar{background:var(--accent);border:none;color:#0a0a0a;border-radius:8px;
    padding:9px 16px;font-family:var(--font);font-size:0.8rem;font-weight:600;cursor:pointer;}

  /* ── KPI CARDS ── */
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;}
  .kpi-card{
    position:relative;overflow:hidden;border-radius:20px;padding:18px;
    background:var(--surface);border:1px solid var(--border);
    display:flex;flex-direction:column;justify-content:space-between;min-height:104px;
  }
  .kpi-card.full{grid-column:1 / -1;min-height:130px;
    background:linear-gradient(135deg,var(--blue1),var(--blue2));border:none;
    box-shadow:0 8px 28px -10px rgba(37,99,235,0.55);}
  .kpi-card.green{
    background:linear-gradient(135deg,var(--green1),var(--green2));border:none;
    box-shadow:0 8px 28px -12px rgba(34,197,94,0.5);}
  .kpi-card:not(.full):not(.green){
    background:linear-gradient(135deg,#2a2415,#181612);border:1px solid #3a3322;}
  .kpi-card.full::after,.kpi-card.green::after{
    content:'';position:absolute;top:-40%;right:-20%;width:160px;height:160px;border-radius:50%;
    background:rgba(255,255,255,0.12);}
  .kpi-label{font-size:0.74rem;font-weight:500;letter-spacing:0.02em;opacity:0.85;position:relative;}
  .kpi-card.full .kpi-label,.kpi-card.green .kpi-label{color:rgba(255,255,255,0.9);}
  .kpi-card:not(.full):not(.green) .kpi-label{color:var(--accent);}
  .kpi-value{font-family:var(--display);font-size:2rem;line-height:1;margin-top:10px;position:relative;letter-spacing:0.01em;}
  .kpi-card.full .kpi-value{font-size:2.6rem;color:#fff;}
  .kpi-card.green .kpi-value,.kpi-card:not(.full):not(.green) .kpi-value{color:#fff;}
  .kpi-sub{font-size:0.74rem;margin-top:8px;color:rgba(255,255,255,0.8);position:relative;}

  /* ── CAIXA DO DIA (Almoço/Janta/Total) ── */
  .caixa-dia{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:2px 0 4px;}
  .cd-cell{border-radius:15px;padding:13px 8px;border:1px solid var(--border);background:var(--surface);text-align:center;}
  .cd-cell.alm{background:linear-gradient(135deg,rgba(251,191,36,0.16),rgba(251,191,36,0.04));border-color:rgba(251,191,36,0.35);}
  .cd-cell.jan{background:linear-gradient(135deg,rgba(129,140,248,0.16),rgba(129,140,248,0.04));border-color:rgba(129,140,248,0.35);}
  .cd-cell.tot{background:linear-gradient(135deg,var(--blue1),var(--blue2));border-color:transparent;box-shadow:0 6px 18px -10px rgba(37,99,235,0.6);}
  .cd-lbl{font-size:0.7rem;color:var(--muted);font-weight:600;margin-bottom:5px;}
  .cd-cell.tot .cd-lbl{color:rgba(255,255,255,0.85);}
  .cd-val{font-family:var(--display);font-size:1.15rem;letter-spacing:0.01em;color:var(--text);line-height:1.1;}
  .cd-cell.alm .cd-val{color:#fbbf24;}
  .cd-cell.jan .cd-val{color:#a5b4fc;}
  .cd-cell.tot .cd-val{color:#fff;font-size:1.3rem;}

  /* ── SEÇÃO ── */
  .secao{
    background:var(--surface);border:1px solid var(--border);border-radius:20px;
    padding:18px;margin-top:14px;
  }
  .secao-titulo{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:0.95rem;font-weight:600;margin-bottom:16px;color:var(--text);
  }

  /* ── BAR CHART ── */
  .bar-chart{display:flex;flex-direction:column;gap:11px;}
  .bar-row{display:flex;align-items:center;gap:10px;}
  .bar-label{flex:0 0 42px;font-size:0.72rem;color:var(--muted);font-weight:500;}
  .bar-label.wide{flex:0 0 84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
  .bar-track{flex:1;position:relative;height:22px;background:var(--surface2);border-radius:7px;overflow:visible;}
  .bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--accent2),var(--accent));
    display:flex;align-items:center;justify-content:flex-end;padding-right:8px;min-width:7px;transition:width .5s ease;}
  .bar-val{font-size:0.68rem;font-weight:600;color:#0a0a0a;white-space:nowrap;}
  .bar-val.outside{position:absolute;top:50%;transform:translateY(-50%);left:calc(var(--w) + 8px);color:var(--text);}

  /* ── TABELA ── */
  .tabela{width:100%;border-collapse:collapse;}
  .tabela th{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);
    font-weight:600;text-align:left;padding:0 0 10px;border-bottom:1px solid var(--border);}
  .tabela td{padding:11px 0;border-bottom:1px solid var(--border);font-size:0.85rem;}
  .tabela tr:last-child td{border-bottom:none;}
  .tabela td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .tabela td.rank{color:var(--accent);font-weight:700;width:26px;font-family:var(--display);font-size:1rem;}

  /* ── COMPARATIVO ── */
  .comp-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .comp-row:last-child{border-bottom:none;}
  .comp-dia{font-size:0.82rem;font-weight:600;}
  .comp-val{font-family:var(--display);font-size:1.05rem;color:var(--accent);}
  .comp-delta{font-size:0.7rem;padding:2px 7px;border-radius:10px;font-weight:600;}
  .comp-delta.up{background:rgba(74,222,128,0.15);color:var(--success);}
  .comp-delta.down{background:rgba(248,113,113,0.15);color:var(--danger);}
  .comp-delta.eq{background:var(--surface2);color:var(--muted);}

  /* ── LOADING ── */
  .loading{text-align:center;padding:48px 20px;color:var(--muted);font-size:0.9rem;line-height:1.6;}
  .spinner{width:34px;height:34px;border:3px solid var(--surface3);border-top-color:var(--accent);
    border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── TOAST ── */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--surface2);border:1px solid var(--border2);color:var(--text);
    padding:12px 20px;border-radius:12px;font-size:0.85rem;opacity:0;pointer-events:none;
    transition:all .3s;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.4);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ── COMPARAÇÃO (▲/▼ vs. período anterior) ── */
  .kpi-delta{display:inline-flex;align-items:center;gap:4px;margin-top:9px;font-size:0.7rem;font-weight:700;padding:3px 8px;border-radius:999px;position:relative;width:max-content;max-width:100%;}
  .kpi-delta small{font-weight:500;opacity:0.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi-card.full .kpi-delta,.kpi-card.green .kpi-delta{background:rgba(255,255,255,0.18);color:#fff;}
  .kpi-card:not(.full):not(.green) .kpi-delta.up{background:rgba(74,222,128,0.15);color:var(--success);}
  .kpi-card:not(.full):not(.green) .kpi-delta.down{background:rgba(248,113,113,0.15);color:var(--danger);}
  .kpi-card:not(.full):not(.green) .kpi-delta.eq{background:var(--surface2);color:var(--muted);}
  .dlt{font-size:0.72rem;font-weight:700;}
  .dlt.up{color:var(--success);} .dlt.down{color:var(--danger);} .dlt.eq{color:var(--muted);}
  /* ── BUFFET ── */
  .secao.destaque{border-color:rgba(212,168,67,0.45);background:linear-gradient(180deg,#17140c,#121212 60%);}
  .mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .mini{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:11px 12px;min-width:0;}
  .mini .l{font-size:0.7rem;color:var(--muted);font-weight:600;}
  .mini .v{font-family:var(--display);font-size:1.45rem;margin-top:5px;line-height:1.05;letter-spacing:0.01em;}
  .mini .s{font-size:0.68rem;color:var(--muted);margin-top:3px;line-height:1.35;}
  .mini.ok .v{color:var(--accent);}
  .sub-tit{font-size:0.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin:14px 0 6px;}
  .linha{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.82rem;}
  .linha:last-child{border-bottom:none;}
  .linha .n{flex:1;font-weight:600;min-width:0;}
  .linha .m{color:var(--muted);font-size:0.72rem;white-space:nowrap;}
  .linha .t{font-weight:700;color:var(--success);font-variant-numeric:tabular-nums;white-space:nowrap;}
  /* ── POR HORA ── */
  .horas{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:6px;}
  .hcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;min-width:0;}
  .hbar{width:100%;border-radius:6px 6px 2px 2px;background:var(--surface3);min-height:3px;transition:background .15s;}
  .hcol.pico .hbar{background:linear-gradient(180deg,var(--accent),var(--accent2));}
  .hcol.sel .hbar{outline:2px solid var(--text);outline-offset:1px;}
  .hlab{font-size:0.6rem;color:var(--muted);margin-top:5px;font-weight:600;white-space:nowrap;}
  .hcol.pico .hlab{color:var(--accent);}
  .hora-box{margin-top:12px;background:rgba(212,168,67,0.08);border:1px solid rgba(212,168,67,0.3);border-radius:12px;padding:9px 11px;font-size:0.78rem;line-height:1.5;}
  /* ── PARTICIPAÇÃO ── */
  .prow{padding:9px 0;border-bottom:1px solid var(--border);}
  .prow:last-child{border-bottom:none;}
  .ptop{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
  .pnome{font-weight:700;font-size:0.86rem;}
  .pval{margin-left:auto;font-weight:700;font-size:0.84rem;white-space:nowrap;}
  .pval span{color:var(--muted);font-weight:500;}
  .ptrack{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden;}
  .pfill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent));}
  .pmeta{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:0.72rem;color:var(--muted);}
  .pmeta b{color:var(--text);}
  /* ── PAGAMENTOS ── */
  .pag{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.84rem;}
  .pag:last-child{border-bottom:none;}
  .pag .ico{width:30px;height:30px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .pag .nm{width:104px;font-weight:600;flex-shrink:0;font-size:0.82rem;}
  .pag .tr{flex:1;height:8px;background:var(--surface2);border-radius:5px;overflow:hidden;min-width:20px;}
  .pag .tr div{height:100%;border-radius:5px;}
  .pag .vl{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .pag .pc{width:34px;text-align:right;color:var(--muted);font-size:0.72rem;flex-shrink:0;}
  /* ── ITENS: ordenar ── */
  .ordem{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:0.74rem;color:var(--muted);}
  .seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:9px;overflow:hidden;}
  .seg button{background:none;border:none;color:var(--muted);padding:6px 10px;font-family:var(--font);font-size:0.74rem;font-weight:700;cursor:pointer;}
  .seg button.on{background:var(--surface3);color:var(--text);}
  .it-cat{display:block;font-size:0.66rem;color:var(--muted);margin-top:2px;}
  tr.it-buffet td{background:rgba(212,168,67,0.05);}
  .btn-atualizar{background:rgba(212,168,67,0.12);border:1px solid rgba(212,168,67,0.5);color:var(--accent);border-radius:10px;padding:8px 12px;font-family:var(--font);font-size:0.8rem;font-weight:700;cursor:pointer;white-space:nowrap;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

  /* ── DEBUG PANEL ── */
  #dbg-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;
    display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
  #dbg-overlay.show{display:flex;}
  #dbg-panel{background:var(--surface);border:1px solid var(--border2);border-bottom:none;
    border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:80vh;
    display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,0.6);}
  #dbg-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
    border-bottom:1px solid var(--border);font-weight:600;font-size:0.95rem;}
  .dbg-x{background:var(--surface2);border:1px solid var(--border2);color:var(--muted);
    width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:0.9rem;}
  #dbg-meta{padding:10px 18px;font-size:0.72rem;color:var(--muted);line-height:1.6;border-bottom:1px solid var(--border);}
  #dbg-log{flex:1;overflow:auto;padding:14px 18px;margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:0.7rem;line-height:1.55;color:#cde7c0;white-space:pre-wrap;word-break:break-word;background:#0c0c0c;}
  #dbg-actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--border);}
  #dbg-actions button{flex:1 1 45%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);
    border-radius:10px;padding:11px 8px;font-family:var(--font);font-size:0.78rem;font-weight:500;cursor:pointer;}
  #dbg-actions button:active{background:var(--surface3);}
</style>
</head>
<body>

<!-- APP -->
<div id="tela-app">
  <div class="app-header">
    <img src="relatorios-icon-512.png" style="width:38px;height:38px;border-radius:8px;object-fit:cover;" alt="Logo">
    <div>
      <div class="app-logo" id="app-logo" onclick="logoTap()" style="cursor:pointer;user-select:none;-webkit-user-select:none;">Relatórios</div>
      <div class="app-sub">Painel de vendas</div>
    </div>
    <div class="app-header-right">
      <button id="btn-instalar" onclick="deferredPrompt&&deferredPrompt.prompt()" style="display:none;background:rgba(212,168,67,0.15);border:1px solid #d4a843;color:#d4a843;border-radius:8px;padding:7px 14px;font-family:'Space Grotesk',sans-serif;font-size:0.78rem;cursor:pointer;align-items:center;gap:5px;"><span>📲</span> Instalar</button>
  <button onclick="location.reload()" class="btn-atualizar" title="Atualizar">↻ Atualizar</button>
    </div>
  </div>

  <div class="container">
    <!-- RESTAURANTE -->
    <div class="restaurante-bar" id="restaurante-bar" style="display:none;"></div>

    <!-- PERÍODO -->
    <div class="periodo-bar" id="periodo-bar">
      <button class="periodo-btn active" onclick="setPeriodo('hoje',this)">Hoje</button>
      <button class="periodo-btn" onclick="setPeriodo('ontem',this)">Ontem</button>
      <button class="periodo-btn" onclick="setPeriodo('semana',this)">7 dias</button>
      <button class="periodo-btn" onclick="setPeriodo('mes',this)">Este mês</button>
      <button class="periodo-btn" onclick="setPeriodo('mes_passado',this)">Mês passado</button>
      <button class="periodo-btn" onclick="setPeriodo('custom',this)">Personalizado</button>
    </div>
    <div id="custom-periodo" style="display:none;margin-bottom:14px;" class="periodo-custom">
      <span style="font-size:0.78rem;color:var(--muted);">De</span>
      <input type="date" id="data-inicio">
      <span style="font-size:0.78rem;color:var(--muted);">até</span>
      <input type="date" id="data-fim">
      <button class="btn-buscar" onclick="carregarDados()">Buscar</button>
    </div>

    <!-- CONTEÚDO -->

var fbDb = null;

var _kpiModo = 'pedidos';    // 'pedidos' (padrão) ou 'itens'
var _almocos = [];           // [{rest, ms, valor}] — almoço manual (registro_almoco)

// ── DEBUG ──
var _dbg = [];

function dlog(msg, obj){

// ── INIT ──
try {

} catch(e){ dlog('ERRO ao inicializar Firebase: '+e.message); }

// Sem SDK de Auth: o Firestore faz a leitura sem autenticação.
// Se as regras exigirem login, a consulta retorna "permission-denied" (erro claro, sem travar).
dlog('Modo direto: sem SDK de Auth (leitura não autenticada).');
_authReady = true;

// Verifica sessão salva
mostrarApp();
registrarAcesso();

// ── LOGIN ──
function sair(){ location.reload(); }

function mostrarApp(){
  document.getElementById('tela-app').style.display='block';
  setPeriodo('hoje', document.querySelector('.periodo-btn.active'));
}

// ── PERÍODO ──
function setPeriodo(p, btn){
  _periodo = p;
  document.querySelectorAll('.periodo-btn').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');
  var custom = document.getElementById('custom-periodo');
  if(p === 'custom'){
    custom.style.display = 'flex';
    var hoje = new Date();
    document.getElementById('data-inicio').value = fmt(hoje);
    document.getElementById('data-fim').value = fmt(hoje);

  }
  custom.style.display = 'none';
  _calcPeriodo();
  carregarDados();
}

function fmt(d){ return d.toISOString().slice(0,10); }

function _calcPeriodo(){
  var agora = new Date();
  var ini, fim;
  if(_periodo === 'hoje'){
    ini = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
    fim = new Date(ini); fim.setDate(fim.getDate()+1);
  } else if(_periodo === 'ontem'){
    ini = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate()-1);
    fim = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
  } else if(_periodo === 'semana'){
    ini = new Date(agora); ini.setDate(ini.getDate()-6); ini.setHours(0,0,0,0);
    fim = new Date(agora); fim.setHours(23,59,59,999); fim.setDate(fim.getDate()+1);
  } else if(_periodo === 'mes'){
    ini = new Date(agora.getFullYear(), agora.getMonth(), 1);
    fim = new Date(agora.getFullYear(), agora.getMonth()+1, 1);
  } else if(_periodo === 'mes_passado'){
    ini = new Date(agora.getFullYear(), agora.getMonth()-1, 1);
    fim = new Date(agora.getFullYear(), agora.getMonth(), 1);
  }
  _dataInicio = ini;
  _dataFim = fim;
}

// ── CARREGAR DADOS ──
function carregarDados(){
  if(_periodo === 'custom'){
    var di = document.getElementById('data-inicio').value;
    var df = document.getElementById('data-fim').value;
    if(!di || !df) return;
    _dataInicio = new Date(di+'T00:00:00');
    _dataFim = new Date(df+'T23:59:59');
  }
  // período mais antigo que o que já foi lido → amplia a janela e busca de novo
  // (inclui o período anterior usado na comparação ▲/▼ — ex.: "Mês passado" compara com o retrasado)
  var _precisaDesde = _dataInicio ? Math.min(_dataInicio.getTime(), _faixaAnterior().ini) : 0;
  if(_precisaDesde && _precisaDesde < _janela()){ _janelaIni = _precisaDesde; _todasContas = null; }
  // Já temos os dados → só refiltra (instantâneo)
  if(_todasContas){ _aplicarFiltros(); return; }

  document.getElementById('relatorio-content').innerHTML =
    '<div class="loading"><div class="spinner"></div>Carregando dados...</div>';
  dlog('Buscando contas do tenant…', {tenant:TENANT_ID});

  esperarAuth(function(ok){
    if(!ok) dlog('Login não confirmado — tentando consulta mesmo assim.');
    _buscarTudo('cache');    // aparece na hora com o que está salvo no aparelho
    _buscarTudo('server');   // e atualiza com o servidor
  });
}

function recarregarTudo(){ _todasContas = null; carregarDados(); }

// Janela de dados lidos: do começo do mês passado até hoje (cobre todos os botões de período).
// Período personalizado mais antigo → aumenta a janela e busca de novo.
function _inicioJanelaPadrao(){ var a = new Date(); return new Date(a.getFullYear(), a.getMonth()-1, 1).getTime(); }
// (o app começa a carregar antes desta linha rodar — por isso tudo aqui é "var" sem depender da ordem)
var _janelaIni, _buscaSeq, _servidorOk, _ultimaAtualizacao;
function _janela(){ if(!_janelaIni) _janelaIni = _inicioJanelaPadrao(); return _janelaIni; }
function _mostrarAtualizado(txt){ var el = document.getElementById('rel-atualizado'); if(el) el.innerHTML = txt; }
// Atualiza sozinho: ao voltar pro app e a cada 5 minutos com ele aberto
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && _todasContas && Date.now() - (_ultimaAtualizacao||0) > 60000) _atualizarServidor();
});
setInterval(function(){ if(document.visibilityState === 'visible' && _todasContas) _atualizarServidor(); }, 5*60000);
function _atualizarServidor(){ _mostrarAtualizado('🔄 Atualizando…'); _buscarTudo('server'); }

function esperarAuth(cb){
  if(_authReady) return cb(true);
  var esperou = 0;
  var iv = setInterval(function(){
    if(_authReady){ clearInterval(iv); return cb(true); }
    esperou += 200;
    if(esperou >= 8000){ clearInterval(iv); dlog('esperarAuth: tempo esgotado (8s) sem login'); return cb(false); }
  }, 200);
}

// Converte vários formatos de data para milissegundos
function toMillis(v){
  if(v == null) return 0;
  if(typeof v === 'number') return v < 1e12 ? v * 1000 : v; // segundos vs ms
  if(typeof v === 'string'){ var t = Date.parse(v); return isNaN(t) ? 0 : t; }
  if(typeof v === 'object'){
    if(typeof v.toMillis === 'function') return v.toMillis();           // Firestore Timestamp
    if(typeof v.seconds === 'number') return v.seconds * 1000 + (v.nanoseconds ? Math.floor(v.nanoseconds/1e6) : 0);
    if(typeof v._seconds === 'number') return v._seconds * 1000;
  }
  return 0;
}

function labelRest(id){
  var nomes = { 'default':'Bávaro', 'prinzen':'Prinzen', 'omar_cafe':'Omar Café' };
  return nomes[id] || (id.charAt(0).toUpperCase()+id.slice(1));
}

// Lê as DUAS fontes: contas_fechadas (Principal/garçom) + pedidos_totem pagos (Prinzen/totem)
function _buscarTudo(fonte){
  fonte = fonte || 'server';
  var doCache = fonte === 'cache';
  var opt = { source: fonte };
  var janela = _janela();
  var _respondeu = false;
  // Internet lenta: avisa com calma e continua esperando (antes dava "erro" e mandava tocar 5×)
  var _watchdog = doCache ? null : setTimeout(function(){
    if(_respondeu) return;
    dlog('Consulta demorando mais de 12s — continuando a esperar.');
    if(!_todasContas){
      document.getElementById('relatorio-content').innerHTML =
        '<div class="loading"><div class="spinner"></div>Carregando… a internet está lenta, só mais um pouquinho.</div>';
    } else _mostrarAtualizado('🔄 Atualizando… (internet lenta)');
  }, 12000);

  var tref = fbDb.collection('tenants').doc(TENANT_ID);

  // Só lê o período que interessa (antes lia TODO o histórico a cada abertura — por isso demorava)
  function lerContas(){
    return fbDb.collection('contas_fechadas').where('fechadoEm','>=',janela).get(opt)
      .then(function(s){ return {tipo:'contas', rid:null, snap:s}; })
      .catch(function(e){
        if(doCache) return {tipo:'contas', rid:null, snap:null};
        dlog('contas por data falhou ('+(e.code||'')+') — lendo do jeito antigo');
        return fbDb.collection('contas_fechadas').where('tenantId','==',TENANT_ID).get(opt)
          .then(function(s){ return {tipo:'contas', rid:null, snap:s}; })
          .catch(function(e2){ dlog('contas_fechadas falhou: '+(e2.code||'')+' — '+e2.message); return {tipo:'contas', rid:null, snap:null}; });
      });
  }
  function lerTotem(rid){
    var col = tref.collection('restaurantes').doc(rid).collection('pedidos_totem');
    return col.where('pagoEm','>=',janela).get(opt)
      .then(function(s){ return {tipo:'totem', rid:rid, snap:s}; })
      .catch(function(e){
        if(doCache) return {tipo:'totem', rid:rid, snap:null};
        dlog('totem/'+rid+' por data falhou ('+(e.code||'')+') — lendo tudo');
        return col.get(opt).then(function(s){ return {tipo:'totem', rid:rid, snap:s}; })
          .catch(function(e2){ dlog('totem/'+rid+' falhou: '+(e2.code||'')+' — '+e2.message); return {tipo:'totem', rid:rid, snap:null}; });
      });
  }

  // Lê o cardápio (principal + totem) de cada restaurante só pra montar o mapa
  // item → categoria. Os itens salvos nas contas não carregam a categoria junto,
  // então sem isso o filtro Pratos/Bebidas não teria como saber o que é o quê.
  function lerCardapio(rid){
    var base = tref.collection('restaurantes').doc(rid);
    function lerPar(colCard){
      return Promise.all([
        base.collection(colCard).doc('data').collection('categorias').get(opt).catch(function(){ return null; }),
        base.collection(colCard).doc('data').collection('itens').get(opt).catch(function(){ return null; })
      ]).then(function(r){
        var catsSnap = r[0], itensSnap = r[1];
        var catsPorId = {};
        if(catsSnap) catsSnap.forEach(function(d){ catsPorId[d.id] = (d.data()||{}).nome || d.id; });
        if(itensSnap) itensSnap.forEach(function(d){
          var v = d.data()||{};
          var catNome = catsPorId[v.categoriaId || v.categoria] || '';
          if(catNome){
            _mapaCatItem['id:'+d.id] = catNome;
            if(v.nome) _mapaCatItem['nome:'+String(v.nome).toLowerCase()] = catNome;
          }
        });
      });
    }
    return Promise.all([lerPar('cardapio'), lerPar('cardapio_totem')])
      .then(function(){ return {tipo:'cardapio', rid:rid}; })
      .catch(function(){ return {tipo:'cardapio', rid:rid}; });
  }

  // Status que NÃO contam como venda (pedido não concluído)
  var STATUS_NAO_VENDA = {'cancelado':1,'cancelada':1,'aguardando_pagamento':1,'pendente':1,'aberto':1,'aberta':1,'rejeitado':1,'rejeitada':1};

  // Lê o almoço manual (registro_almoco) por ID de documento (get), cobrindo os últimos 70 dias.
  // Buscar por ID contorna regras que bloqueiam consulta (list) mas liberam leitura simples (get).
  var _almocosNovos = [];
  function lerAlmocos(){
    var col = fbDb.collection('registro_almoco');
    var dias = Math.min(400, Math.ceil((Date.now() - janela) / 86400000) + 1), jobs = [];
    var base = new Date(); base.setHours(12,0,0,0);
    for(var i=0; i<dias; i++){
      (function(d){
        var ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        jobs.push(
          col.doc('almoco_default_'+ds).get(opt)
            .then(function(snap){ return {ds:ds, snap:snap, err:null}; })
            .catch(function(e){ return {ds:ds, snap:null, err:e}; })
        );
      })(new Date(base.getTime() - i*86400000));
    }
    return Promise.all(jobs).then(function(rs){
      var permErr=null, n=0;
      rs.forEach(function(r){
        if(r.err){ if(!permErr) permErr=r.err; return; }
        if(r.snap && r.snap.exists){
          var x = r.snap.data() || {};
          _almocosNovos.push({ rest:'default', ms:new Date(r.ds+'T12:00:00').getTime(), valor:x.valor||0 });
          n++;
        }
      });
      if(permErr && doCache) permErr = null;
      if(permErr) dlog('registro_almoco BLOQUEADO: '+(permErr.code||'')+' — '+permErr.message+' (libere leitura nas regras do Firestore)');
      dlog('registro_almoco: '+n+' lançamento(s) de almoço (últimos '+dias+' dias)');
      return {tipo:'almoco'};
    });
  }

  // 1) Descobre os restaurantes do tenant; 2) lê contas_fechadas + pedidos_totem de cada um
  tref.collection('restaurantes').get(opt)
    .then(function(rs){ var ids=[]; rs.forEach(function(d){ ids.push(d.id); }); return ids; })
    .catch(function(e){ dlog('lista de restaurantes falhou: '+(e.code||'')+' — '+e.message); return []; })
    .then(function(rids){
      if(rids.indexOf(RESTAURANTE_ID) < 0) rids.push(RESTAURANTE_ID);
      if(rids.indexOf('default') < 0) rids.push('default');
      if(rids.indexOf('omar_cafe') < 0) rids.push('omar_cafe');
      dlog('Restaurantes do tenant: '+rids.join(', '));
      var jobs = [ lerContas(), lerAlmocos() ].concat(rids.map(lerTotem)).concat(rids.map(lerCardapio));
      return Promise.all(jobs);
    })
    .then(function(resultados){
      _respondeu = true; if(_watchdog) clearTimeout(_watchdog);
      // cache que chegou depois do servidor, ou janela que mudou no meio → ignora
      if(doCache && _servidorOk) return;
      if(janela !== _janela()) return;

      var byKey = {}, mapRest = {}, statusPorRest = {};
      resultados.forEach(function(r){
        if(!r || r.tipo === 'almoco' || r.tipo === 'cardapio') return;
        var size = r.snap ? r.snap.size : 'erro';
        dlog('Fonte '+(r.tipo === 'contas' ? 'contas_fechadas' : 'totem/'+r.rid)+': '+size+' doc(s)');
        if(!r.snap) return;
        r.snap.forEach(function(d){
          var dados = d.data();

          if(r.tipo === 'totem'){
            // tally de status p/ diagnóstico
            var st = (dados.status || '(sem status)');
            statusPorRest[r.rid] = statusPorRest[r.rid] || {};
            statusPorRest[r.rid][st] = (statusPorRest[r.rid][st]||0) + 1;
            // ignora pedidos que não são venda concluída (cancelado/aguardando/etc.)
            if(STATUS_NAO_VENDA[String(st).toLowerCase()]) return;
          }

          if(r.tipo === 'contas' && dados.tenantId && dados.tenantId !== TENANT_ID) return;   // outra empresa
          if(r.tipo === 'contas' && !dados.tenantId) return;
          var key = (r.rid || 'cf') + '_' + d.id;
          if(byKey[key]) return;
          var c = Object.assign({_docId:d.id}, dados);
          if(r.tipo === 'totem'){
            c._rest = r.rid;
            c.fechadaEm = toMillis(dados.pagoEm) || toMillis(dados.data) || toMillis(dados.criadoEm);
          } else {
            c._rest = dados.restauranteId || dados.id || 'default';
            c.fechadaEm = toMillis(dados.fechadoEm) || toMillis(dados.fechadaEm) || toMillis(dados.criadoEm);
          }
          c.total = (typeof dados.total === 'number') ? dados.total : (dados.valorTotal || 0);
          byKey[key] = c;
          mapRest[c._rest] = (mapRest[c._rest]||0) + 1;
        });
      });

      // Log dos status encontrados em cada restaurante do totem
      Object.keys(statusPorRest).forEach(function(rid){
        var det = Object.keys(statusPorRest[rid]).map(function(s){ return s+'='+statusPorRest[rid][s]; }).join(', ');
        dlog('Status totem/'+rid+': '+det);
      });

      var lista = Object.keys(byKey).map(function(k){ return byKey[k]; });
      if(doCache){
        if(!lista.length){ dlog('Cache vazio — esperando o servidor'); return; }
        _mostrarAtualizado('🔄 Atualizando…');
      } else {
        _servidorOk = true; _ultimaAtualizacao = Date.now();
        _mostrarAtualizado('✓ Atualizado às ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) + ' · <a href="javascript:void(0)" onclick="_atualizarServidor()" style="color:var(--muted);">atualizar</a>');
      }
      _todasContas = lista;
      _almocos = _almocosNovos;
      dlog((doCache ? '[cache] ' : '')+'Total de vendas (únicas): '+_todasContas.length);

      _restaurantes = Object.keys(mapRest).map(function(id){ return {id:id, label:labelRest(id), count:mapRest[id]}; })
                                          .sort(function(a,b){ return b.count - a.count; });
      dlog('Restaurantes com vendas: '+(_restaurantes.map(function(r){ return r.id+' ('+r.count+')'; }).join(', ')||'nenhum'));

      if(_restauranteSel === null){
        var temPrinzen = _restaurantes.some(function(r){ return r.id === RESTAURANTE_ID; });
        _restauranteSel = temPrinzen ? RESTAURANTE_ID : (_restaurantes[0] ? _restaurantes[0].id : 'default');
      }
      _montarSeletorRestaurante();
      _aplicarFiltros();
    });
}

function _montarSeletorRestaurante(){
  var wrap = document.getElementById('restaurante-bar');
  if(!wrap) return;
  if(_restaurantes.length < 1){ wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  var totalGeral = _restaurantes.reduce(function(s,r){ return s + r.count; }, 0);
  var htmlBtns = '';
  if(_restaurantes.length > 1){
    var onTodos = _restauranteSel === '__todos__' ? ' active' : '';
    htmlBtns += '<button class="rest-btn'+onTodos+'" onclick="selecionarRestaurante(\'__todos__\', this)">'+
      '\ud83c\udfe0 Todos<span class="rest-count">'+totalGeral+'</span></button>';
  }
  htmlBtns += _restaurantes.map(function(r){
    var on = r.id === _restauranteSel ? ' active' : '';
    return '<button class="rest-btn'+on+'" onclick="selecionarRestaurante(\''+r.id+'\', this)">'+
             r.label+'<span class="rest-count">'+r.count+'</span></button>';
  }).join('');
  wrap.innerHTML = htmlBtns;
}

function selecionarRestaurante(id, btn){
  _restauranteSel = id;
  document.querySelectorAll('.rest-btn').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');
  dlog('Restaurante selecionado: '+id);
  _aplicarFiltros();
}

function alternarKpi(){
  _kpiModo = (_kpiModo === 'itens') ? 'pedidos' : 'itens';
  _aplicarFiltros();
}

// Filtra o cache por restaurante + período e renderiza
function _aplicarFiltros(){
  if(!_todasContas) return;
  var ini = _dataInicio.getTime(), fim = _dataFim.getTime();
  var todos = _restauranteSel === '__todos__';
  var contas = _todasContas.filter(function(c){
    return (todos || c._rest === _restauranteSel) && c.fechadaEm >= ini && c.fechadaEm <= fim;
  });
  // Soma do almoço manual (só o Bavaro/default usa) no período
  _almocoPeriodo = _almocos.filter(function(a){
    return (todos || a.rest === _restauranteSel) && a.ms >= ini && a.ms <= fim;
  }).reduce(function(s,a){ return s + (a.valor||0); }, 0);

  dlog('Filtro aplicado', {restaurante:_restauranteSel, periodo:_periodo, contas:contas.length, almoco:_almocoPeriodo});

  if(contas.length === 0 && _almocoPeriodo <= 0){
    var doRest = todos ? _todasContas.slice() : _todasContas.filter(function(c){ return c._rest === _restauranteSel; });
    var maxFe = doRest.reduce(function(m,c){ return c.fechadaEm > m ? c.fechadaEm : m; }, 0);
    document.getElementById('relatorio-content').innerHTML =
      '<div class="loading">📭 Sem vendas neste período para '+(todos ? 'nenhum restaurante' : labelRest(_restauranteSel))+'.<br>'+

// ═══ APOIO DOS QUADROS NOVOS ═══
function _semAcento(t){ return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim(); }
function _escH(t){ return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// Nome de categoria "do mesmo jeito" nas 3 lojas: "Buffet Kg", "Buffet Por KG" e "Buffet kg" viram a mesma
function _catChave(cat){ return _semAcento(cat).replace(/\bpor\b/g, ' ').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim() || 'sem categoria'; }
function _titulo(t){ return String(t || '').toLowerCase().replace(/(^|\s)(\S)/g, function(m, a, b){ return a + b.toUpperCase(); }).replace(/\b(De|Do|Da|Dos|Das|E|Por|Kg)\b/g, function(w, off){ return w === 'Kg' ? 'kg' : (off === 0 ? w : w.toLowerCase()); }); }
// Grupo do item pros filtros: buffet / bebidas / sobremesas / pratos / outros
function _grupoItem(it, cat, nome){
  var c = _semAcento(cat), n = _semAcento(nome);
  if(it && it.tipoVenda === 'kg') return 'buffet';
  if(/buffet|quilo|\bpor ?kg\b/.test(c) || /buffet/.test(n)) return 'buffet';
  if(c && c !== 'sem categoria' ? _ehCategoriaBebida(cat) : _ehCategoriaBebida(nome)) return 'bebidas';
  if(/sobremes|doce|sorvete|pudim|bolo|torta|acai|mousse|picole|brigadeiro|gelato|milk ?shake/.test(c + ' ' + n)) return 'sobremesas';
  if(c && c !== 'sem categoria') return 'pratos';
  if(/prato|file|frango|carne|alcatra|picanha|burger|lanche|massa|porcao|parmegian|grelhad|marmit|feijoada|strogonoff|peixe|tilapia|salada|executiv/.test(n)) return 'pratos';
  return 'outros';
}
var _GRUPOS = { buffet:'⚖️ Buffet', pratos:'🍽️ Pratos', bebidas:'🍺 Bebidas', sobremesas:'🍨 Sobremesas', outros:'Outros' };
// Forma de pagamento → pix / credito / debito / dinheiro / vale / (vazio = não informada)
function _formaPg(f){
  var t = _semAcento(f);
  if(!t) return '';
  if(t === '17' || /pix/.test(t)) return 'pix';
  if(t === '03' || /credit/.test(t)) return 'credito';
  if(t === '04' || /debit/.test(t)) return 'debito';
  if(t === '01' || /dinheiro|especie/.test(t)) return 'dinheiro';
  if(t === '10' || t === '11' || /vale|voucher|refei|alimenta|ticket|sodexo|alelo|vr\b/.test(t)) return 'vale';
  return 'outro';
}
var _FORMAS_PG = [ ['pix','📱','Pix','#22c55e'], ['credito','💳','Crédito','#3b82f6'], ['debito','💳','Débito','#a78bfa'], ['dinheiro','💵','Dinheiro','#d4a843'], ['vale','🎟️','Voucher / Vale','#f472b6'], ['outro','🧾','Outros','#94a3b8'], ['', '❔','Não informado','#4b5563'] ];
// Divide o total da venda entre as formas usadas (proporcional ao que foi pago em cada uma)
function _formasDaVenda(c){
  var total = c.total || c.valorTotal || 0, out = {};
  if(c._rest && c.formaPagamento !== undefined && !Array.isArray(c.pagamentos)){   // totem: uma forma só
    out[_formaPg(c.formaPagamento)] = total; return out;
  }
  if(c.formaPagamento){ out[_formaPg(c.formaPagamento)] = total; return out; }
  var pg = (c.pagamentos || []).filter(function(p){ return p && (Number(p.valor) || 0) > 0; });
  var comForma = pg.filter(function(p){ return p.forma; });   // "metodo: dinheiro" do app do garçom não é a forma real
  var lista = comForma.length ? comForma.map(function(p){ return { f:_formaPg(p.forma), v:Number(p.valor) || 0 }; }) : [];
  if(!lista.length && c.nfce && c.nfce.impressao && Array.isArray(c.nfce.impressao.pagamentos))
    lista = c.nfce.impressao.pagamentos.map(function(p){ return { f:_formaPg(p.forma), v:Number(p.valor) || 0 }; });
  var soma = lista.reduce(function(s, x){ return s + x.v; }, 0);
  if(!soma){ out[''] = total; return out; }
  lista.forEach(function(x){ out[x.f] = (out[x.f] || 0) + total * x.v / soma; });
  return out;
}
// Período anterior pra comparação (mesmo "pedaço" do dia/mês, pra comparar de forma justa)
function _faixaAnterior(){
  var ini = _dataInicio ? _dataInicio.getTime() : Date.now(), fim = _dataFim ? _dataFim.getTime() : Date.now();
  var agora = Date.now(), SEM = 7 * 86400000;
  if(_periodo === 'hoje' || _periodo === 'semana') return { ini: ini - SEM, fim: Math.min(fim, agora) - SEM };
  if(_periodo === 'ontem') return { ini: ini - SEM, fim: fim - SEM };
  if(_periodo === 'mes'){
    var a = new Date(), ultimoDia = new Date(a.getFullYear(), a.getMonth(), 0).getDate();
    var lim = new Date(a.getFullYear(), a.getMonth() - 1, Math.min(a.getDate(), ultimoDia), a.getHours(), a.getMinutes());
    return { ini: new Date(a.getFullYear(), a.getMonth() - 1, 1).getTime(), fim: lim.getTime() };
  }
  if(_periodo === 'mes_passado'){ var b = new Date(); return { ini: new Date(b.getFullYear(), b.getMonth() - 2, 1).getTime(), fim: new Date(b.getFullYear(), b.getMonth() - 1, 1).getTime() }; }
  var L = fim - ini; return { ini: ini - L, fim: ini };
}
function _rotuloAnterior(){
  var dias = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  if(_periodo === 'hoje'){ var d = new Date().getDay(); return 'vs. ' + dias[d] + (d === 0 || d === 6 ? ' passado' : ' passada') + ' até esta hora'; }
  if(_periodo === 'ontem'){ var o = new Date(Date.now() - 86400000).getDay(); return 'vs. ' + dias[o] + ' da semana anterior'; }
  if(_periodo === 'semana') return 'vs. 7 dias anteriores';
  if(_periodo === 'mes') return 'vs. mesmo período do mês passado';
  if(_periodo === 'mes_passado') return 'vs. mês anterior';
  return 'vs. período anterior';
}
// soma das vendas de uma faixa (mesmo filtro de restaurante da tela)
function _resumoFaixa(f){
  var todos = _restauranteSel === '__todos__', r = { fat:0, contas:0, porRest:{}, almoco:0 };
  (_todasContas || []).forEach(function(c){
    if(!(todos || c._rest === _restauranteSel) || c.fechadaEm < f.ini || c.fechadaEm > f.fim) return;
    var v = c.total || c.valorTotal || 0;
    r.fat += v; r.contas++;
    if(!r.porRest[c._rest]) r.porRest[c._rest] = { valor:0, contas:0 };
    r.porRest[c._rest].valor += v; r.porRest[c._rest].contas++;
  });
  (_almocos || []).forEach(function(a){ if((todos || a.rest === _restauranteSel) && a.ms >= f.ini && a.ms <= f.fim) r.almoco += a.valor || 0; });
  return r;
}
// "▲ 12%" — null quando não dá pra comparar (sem vendas no período anterior ou fora dos dados lidos)
function _delta(atual, anterior){
  if(!(anterior > 0)) return null;
  var p = Math.round((atual - anterior) / anterior * 100);
  return { p:p, cls: p > 0 ? 'up' : (p < 0 ? 'down' : 'eq'), txt: (p > 0 ? '▲ ' : (p < 0 ? '▼ ' : '= ')) + Math.abs(p) + '%' };
}
function _kpiDelta(d, legenda){
  if(!d) return '';
  return '<div class="kpi-delta ' + d.cls + '">' + d.txt + (legenda ? ' <small>' + legenda + '</small>' : '') + '</div>';
}
function _fmtMil(v){ v = v || 0; return v >= 1000 ? (v / 1000).toFixed(1).replace('.', ',') + ' mil' : String(Math.round(v)); }
function _fmtKg(g){ return ((g || 0) / 1000).toFixed(1).replace('.', ','); }

// ── RENDER ──
function fmtR(v){
  return 'R$ '+(v||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}
function fmtN(v){ return (v||0).toFixed(2).replace('.',','); }

function renderRelatorio(contas){
  if(!contas.length){
    document.getElementById('relatorio-content').innerHTML =
      '<div class="loading" style="padding:60px;">📭<br><br>Nenhuma venda no período selecionado.</div>';
    return;
  }

  // ── AGREGAR ──
  var totalVendas = 0, totalMesas = contas.length;
  var vendasPorDia = {}, itensMapa = {}, catMapa = {}, adicMapa = {};
  // novos quadros
  var buf = { pratos:0, valor:0, pesoG:0, comPeso:0, parcValor:0, parcPratos:0, porRest:{} };
  var porHora = {}, pedidosHora = {}, formas = {};

  contas.forEach(function(c){
    var val = c.total || c.valorTotal || 0;
    totalVendas += val;
    // por hora (hora em que a venda foi fechada/paga)
    var hh = new Date(c.fechadaEm).getHours();
    porHora[hh] = (porHora[hh] || 0) + val; pedidosHora[hh] = (pedidosHora[hh] || 0) + 1;
    // formas de pagamento
    var fv = _formasDaVenda(c); Object.keys(fv).forEach(function(f){ formas[f] = (formas[f] || 0) + fv[f]; });

    // Por dia
    var d = new Date(c.fechadaEm);
    var dKey = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    vendasPorDia[dKey] = (vendasPorDia[dKey]||0) + val;

    // Itens
    (c.itens||[]).forEach(function(it){
      if(it.status === 'cancelado') return;
      var nome = it.nome || 'Item';
      var qtd = it.qtd || 1;
      var vIt = (it.tipoVenda==='kg' ? (it.preco||0) : (it.preco||0)*qtd);

      // Por categoria: usa a do item se veio salva; senão resolve pelo cardápio;
      // senão tenta pelo próprio nome do item (útil pra itens fora do cardápio)
      var cat = it.categoriaNome
        || (it.id && _mapaCatItem['id:'+it.id])
        || (it.itemId && _mapaCatItem['id:'+it.itemId])
        || _mapaCatItem['nome:'+String(nome).toLowerCase()]
        || 'Sem categoria';
      var grupo = _grupoItem(it, cat, nome);
      var ehKg = it.tipoVenda === 'kg';

      // Itens iguais nas 3 lojas viram uma linha só (sem diferenciar maiúscula/acento);
      // todo prato pesado (por quilo) vira "Buffet por quilo"
      var chaveIt = ehKg ? '__buffet_kg__' : _semAcento(nome);
      if(!itensMapa[chaveIt]) itensMapa[chaveIt] = { nome: ehKg ? 'Buffet por quilo' : nome, qtd:0, valor:0, cat:'', grupo:grupo, pesoG:0, grafias:{} };
      if(!ehKg) itensMapa[chaveIt].grafias[nome] = (itensMapa[chaveIt].grafias[nome] || 0) + qtd;
      itensMapa[chaveIt].qtd += qtd;
      itensMapa[chaveIt].valor += vIt;
      itensMapa[chaveIt].cat = cat;
      if(ehKg) itensMapa[chaveIt].grupo = 'buffet';

      // Categorias com o mesmo nome escrito diferente viram uma só
      var chaveCat = ehKg ? 'buffet kg' : _catChave(cat);
      if(!catMapa[chaveCat]) catMapa[chaveCat] = { qtd:0, valor:0, nomes:{} };
      catMapa[chaveCat].qtd += qtd;
      catMapa[chaveCat].valor += vIt;
      catMapa[chaveCat].nomes[ehKg ? 'Buffet por quilo' : cat] = (catMapa[chaveCat].nomes[ehKg ? 'Buffet por quilo' : cat] || 0) + qtd;

      // ⚖️ Buffet por quilo
      if(ehKg){
        var g = Number(it.peso) || 0; if(g > 0 && g < 10) g = g * 1000;   // peso salvo em kg (raro) → gramas
        buf.pratos += qtd; buf.valor += vIt;
        if(g > 0){ buf.pesoG += g * qtd; buf.comPeso += qtd; }
        var dp = Number(it.descontoParceria) || 0;
        if(dp > 0){ buf.parcValor += dp * qtd; buf.parcPratos += qtd; }
        if(!buf.porRest[c._rest]) buf.porRest[c._rest] = { pratos:0, valor:0, pesoG:0 };
        buf.porRest[c._rest].pratos += qtd; buf.porRest[c._rest].valor += vIt; buf.porRest[c._rest].pesoG += g > 0 ? g * qtd : 0;
      }

      // Adicionais (seleções feitas no item: molhos, pontos da carne, extras...)
      // ⚠️ Formatos diferentes por app: garçom salva ARRAY de {grupo, opcao, precoExtra};
      // o totem salva um OBJETO {grupoId: [idx]} + um texto pronto em selecoesLabel.
      // Tratar só como array quebrava o relatório inteiro pros pedidos do totem.
      if(Array.isArray(it.selecoes)){
        it.selecoes.forEach(function(s){
          var nomeAdic = (s && (s.opcao || s.nome)) || '';
          if(!nomeAdic) return;
          var grupoAdic = s.grupo || '';
          var chaveAdic = (grupoAdic ? grupoAdic + ' › ' : '') + nomeAdic;
          var qtdAdic = (s.qtd || 1) * qtd; // ex: 2 lanches com bacon = 2 bacons
          var valAdic = (parseFloat(s.precoExtra || s.preco) || 0) * qtdAdic;
          if(!adicMapa[chaveAdic]) adicMapa[chaveAdic] = {qtd:0, valor:0};
          adicMapa[chaveAdic].qtd += qtdAdic;
          adicMapa[chaveAdic].valor += valAdic;
        });
      } else if(typeof it.selecoesLabel === 'string' && it.selecoesLabel){
        it.selecoesLabel.split(' · ').forEach(function(nomeAdic){
          nomeAdic = (nomeAdic||'').trim();
          if(!nomeAdic) return;
          if(!adicMapa[nomeAdic]) adicMapa[nomeAdic] = {qtd:0, valor:0};
          adicMapa[nomeAdic].qtd += qtd;
          // valor extra individual não vem discriminado no totem — fica só a contagem
        });
      }
    });
  });

  var ticketMedio = totalMesas > 0 ? totalVendas/totalMesas : 0;

  // ── PARTICIPAÇÃO POR RESTAURANTE (modo "Todos") ──
  var porRest = {};
  contas.forEach(function(c){
    var r = c._rest || '?';
    if(!porRest[r]) porRest[r] = {valor:0, contas:0};
    porRest[r].valor += (c.total || c.valorTotal || 0);

  // ── TOP ITENS ──
  function _melhorGrafia(g, padrao){

    if(!boas.length) return _titulo(l[0]);

  }
  var topItens = Object.keys(itensMapa).map(function(k){ var m = itensMapa[k]; return {nome:k === '__buffet_kg__' ? m.nome : _melhorGrafia(m.grafias, m.nome), qtd:m.qtd, valor:m.valor, cat:m.cat||'', grupo:m.grupo, buffet:k === '__buffet_kg__'}; });
  topItens.sort(function(a,b){ return b.valor-a.valor; });
  _topItensCache = topItens; // guarda pra re-filtrar sem recalcular tudo
  if(buf.comPeso){ var tb = topItens.filter(function(i){ return i.buffet; })[0]; if(tb) tb.extra = _fmtKg(buf.pesoG) + ' kg'; }

  // ── TOP CATEGORIAS ──

    return {nome: melhor === 'Buffet por quilo' ? melhor : _titulo(melhor), qtd:catMapa[k].qtd, valor:catMapa[k].valor};
  });
  topCats.sort(function(a,b){ return b.valor-a.valor; });

  // ── VENDAS POR DIA ──

  var maxDia = Math.max.apply(null, diasOrdenados.map(function(d){ return vendasPorDia[d]; })) || 1;

  // ── COMPARATIVO SEMANA ──
  var diasSemana = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  var semanaAtual = {}, semanaAnterior = {};
  var agora = new Date();
  contas.forEach(function(c){
    var d = new Date(c.fechadaEm);
    var diffDias = Math.floor((agora - d) / 86400000);
    if(diffDias < 7) semanaAtual[d.getDay()] = (semanaAtual[d.getDay()]||0) + (c.total||0);
    else if(diffDias < 14) semanaAnterior[d.getDay()] = (semanaAnterior[d.getDay()]||0) + (c.total||0);
  });

  // ── HTML ──
  var html = '';

  var almoco = _almocoPeriodo || 0;
  var janta = totalVendas;            // contas_fechadas / vendas do app
  var totalGeral = janta + almoco;    // total do período (inclui almoço manual)

  // ▲/▼ Comparação com o período anterior (só quando ele está dentro dos dados lidos)
  var fAnt = _faixaAnterior(), ant = (fAnt.ini >= _janela()) ? _resumoFaixa(fAnt) : null;
  var dFat = ant ? _delta(totalGeral, ant.fat + ant.almoco) : null;
  var dTicket = ant && ant.contas ? _delta(ticketMedio, ant.fat / ant.contas) : null;
  var dPed = ant ? _delta(totalMesas, ant.contas) : null;
  var rotAnt = _rotuloAnterior();

  // KPIs
  html += '<div class="kpi-grid">';
  html += '<div class="kpi-card full"><div class="kpi-label">Faturamento no período</div>'+
    '<div class="kpi-value">'+fmtR(totalGeral)+'</div>'+
    '<div class="kpi-sub">'+totalMesas+' conta'+(totalMesas!==1?'s':'')+' fechada'+(totalMesas!==1?'s':'')+
    (almoco>0 ? ' · inclui almoço manual' : '')+'</div>'+
    _kpiDelta(dFat, rotAnt + (ant ? ' (' + fmtR(ant.fat + ant.almoco) + ')' : ''))+'</div>';
  html += '<div class="kpi-card"><div class="kpi-label">Ticket médio</div>'+

  var kpiLabel = _kpiModo === 'itens' ? 'Itens vendidos' : 'Pedidos feitos';

  // ⚖️ BUFFET POR QUILO

    '</div>';
    if(todosB && lojasB.length > 1){
      html += '<div class="sub-tit">Por loja</div>';
      lojasB.forEach(function(r){
        var b = buf.porRest[r];

      });
    }
    html += '</div>';
  }

  // ⏰ VENDAS POR HORA
  var horasCom = Object.keys(porHora).map(Number).sort(function(a,b){ return a-b; });
  if(horasCom.length){
    var hIni = horasCom[0], hFim = horasCom[horasCom.length-1], maxH = 0, hPico = hIni;
    for(var hx = hIni; hx <= hFim; hx++){ if((porHora[hx]||0) > maxH){ maxH = porHora[hx]; hPico = hx; } }
    // as 3 horas seguidas que mais vendem (o "rush")
    var melhor3 = 0, ini3 = hIni;
    for(var h3 = hIni; h3 <= hFim; h3++){ var s3 = (porHora[h3]||0)+(porHora[h3+1]||0)+(porHora[h3+2]||0); if(s3 > melhor3){ melhor3 = s3; ini3 = h3; } }
    _horasCache = { porHora:porHora, pedidos:pedidosHora, total:totalVendas, pico:hPico, ini3:ini3, pct3: Math.round(melhor3 / (totalVendas||1) * 100), varios: diasOrdenados.length > 1 };

    html += '</div><div class="hora-box" id="hora-box"></div>'+
      (almoco > 0 ? '<div style="font-size:0.66rem;color:var(--muted);margin-top:6px;">Não inclui o almoço lançado à mão (ele não tem horário).</div>' : '')+'</div>';

  // ☀️ Almoço + 🌙 Janta (só aparece quando há almoço manual lançado)
  if(almoco > 0){
    html += '<div class="caixa-dia">'+
      '<div class="cd-cell alm"><div class="cd-lbl">☀️ Almoço</div><div class="cd-val">'+fmtR(almoco)+'</div></div>'+
      '<div class="cd-cell jan"><div class="cd-lbl">🌙 Janta</div><div class="cd-val">'+fmtR(janta)+'</div></div>'+

  // Vendas por dia
  if(diasOrdenados.length > 1){
    html += '<div class="secao"><div class="secao-titulo">Vendas por dia</div><div class="bar-chart">';

  // Participação de cada restaurante no faturamento (só no modo "Todos")
  if(_restauranteSel === '__todos__'){
    var listaRest = Object.keys(porRest).map(function(r){
      return {id:r, label:labelRest(r), valor:porRest[r].valor, contas:porRest[r].contas};
    }).sort(function(a,b){ return b.valor - a.valor; });
    var maxRest = listaRest.length ? (listaRest[0].valor || 1) : 1;

  // 💳 Formas de pagamento

    if(almoco > 0) html += '<div style="font-size:0.66rem;color:var(--muted);margin-top:4px;">Não inclui o almoço lançado à mão.</div>';

  }

  // Top itens mais vendidos — filtro por grupo (Buffet, Pratos, Bebidas, Sobremesas, Outros) e ordenação
  html += '<div class="secao"><div class="secao-titulo">🏆 Itens mais vendidos</div>';

  var topAdics = Object.keys(adicMapa).map(function(k){ return {nome:k, qtd:adicMapa[k].qtd, valor:adicMapa[k].valor}; });

        '<td class="num">'+a.qtd+'</td>'+
        '<td class="num" style="font-size:0.85rem;color:var(--success);">'+(a.valor > 0 ? fmtR(a.valor) : '—')+'</td></tr>';

    html += '</tbody></table>';
    html += '<div style="font-size:0.68rem;color:var(--muted);margin-top:6px;">"Receita extra" = valor cobrado a mais pelos adicionais pagos. Adicionais grátis (ponto da carne, etc) mostram —.</div>';
    html += '</div>';
  }

  // Vendas por categoria
  if(topCats.length > 0){
    var maxCat = topCats[0].valor || 1;
    html += '<div class="secao"><div class="secao-titulo">📂 Vendas por categoria</div><div class="bar-chart">';
    topCats.forEach(function(c){
      var pct = Math.max(4, Math.round(c.valor/maxCat*100));
      html += '<div class="bar-row">'+
        '<div class="bar-label wide" title="'+c.nome+'">'+c.nome+'</div>'+
        '<div class="bar-track">'+
          '<div class="bar-fill" style="width:'+pct+'%">'+
            (pct > 25 ? '<span class="bar-val">'+fmtR(c.valor)+'</span>' : '')+
          '</div>'+
          (pct <= 25 ? '<span class="bar-val outside" style="--w:'+pct+'%">'+fmtR(c.valor)+'</span>' : '')+
        '</div>'+
        '<span style="font-size:0.68rem;color:var(--muted);flex-shrink:0;">'+c.qtd+'x</span>'+
      '</div>';
    });
    html += '</div></div>';
  }

  // Comparativo semana atual vs anterior (só mostra se período >= 7 dias)
  if(_periodo === 'semana' || _periodo === 'mes' || _periodo === 'mes_passado'){
    html += '<div class="secao"><div class="secao-titulo">📊 Comparativo por dia da semana<span style="font-size:0.65rem;color:var(--muted);">Atual vs Anterior</span></div>';
    for(var d=0;d<7;d++){

      if(delta !== null){
        var cls = delta > 0 ? 'up' : delta < 0 ? 'down' : 'eq';

// ⏰ detalhe da hora tocada (ou o resumo do pico)
var _horasCache = null;
function _horaDetalhe(h){
  var hc = _horasCache, box = document.getElementById('hora-box'); if(!hc || !box) return;
  document.querySelectorAll('.hcol').forEach(function(el){ el.classList.toggle('sel', h !== null && +el.getAttribute('data-h') === h); });
  var alvo = h === null ? hc.pico : h, v = hc.porHora[alvo] || 0, n = hc.pedidos[alvo] || 0;
  var pct = Math.round(v / (hc.total || 1) * 100);
  var txt = (h === null ? '🔥 <b>Pico: ' : '🕐 <b>') + alvo + 'h–' + (alvo + 1) + 'h</b> · ' + fmtR(v) + ' (' + pct + '% do período) · ' + n + ' pedido' + (n !== 1 ? 's' : '');
  if(hc.varios) txt += ' <span style="color:var(--muted);">(soma dos dias)</span>';
  if(h === null && hc.pct3 > 0) txt += '<br><span style="color:var(--muted);">Das ' + hc.ini3 + 'h às ' + (hc.ini3 + 3) + 'h saem ' + hc.pct3 + '% das vendas.</span>';
  box.innerHTML = txt;
}

// ── TOP ITENS: FILTRO PRATOS/BEBIDAS/CATEGORIA ──
var _topItensCache = [];
var _filtroTopItens = 'todos'; // 'todos' | 'buffet' | 'pratos' | 'bebidas' | 'sobremesas' | 'outros'
var _ordemTopItens = 'valor';  // 'valor' (faturamento) | 'qtd'
var _mapaCatItem = {}; // 'id:xyz' ou 'nome:abc' → nome da categoria (montado ao carregar o cardápio)

// Heurística: decide se uma categoria é de bebida pelo nome
function _ehCategoriaBebida(cat){
  var c = (cat||'').toLowerCase();
  var palavras = ['bebida','chopp','chope','cerveja','refri','suco','drink','vinho','dose','long neck','longneck','água','agua','tônica','tonica','energétic','energetic','café','cafe','caipirinha','whisky','vodka','gin','coquetel','destilado','licor','champanhe','espumante','soda','guaraná','guarana','cola','mate','chá','cha'];
  for(var i=0;i<palavras.length;i++){
    if(c.indexOf(palavras[i]) >= 0) return true;
  }
  return false;
}

function _filtrarTopItens(){
  var l = _filtrarTopItensGrupo().slice();
  l.sort(_ordemTopItens === 'qtd' ? function(a,b){ return b.qtd - a.qtd || b.valor - a.valor; } : function(a,b){ return b.valor - a.valor; });
  return l;
}
function setOrdemTopItens(o){ _ordemTopItens = o; renderTopItensFiltros(); renderTopItensTabela(); }
function _filtrarTopItensGrupo(){
  if(_filtroTopItens === 'todos') return _topItensCache;
  if(_GRUPOS[_filtroTopItens]) return _topItensCache.filter(function(it){ return it.grupo === _filtroTopItens; });
  // Classifica pela categoria; se a categoria for desconhecida ("Sem categoria"),
  // tenta pelo próprio nome do item — cobre restaurantes cujos itens não estão
  // no cardápio cadastrado (ex: vendas por quilo / itens avulsos).
  function ehBeb(it){
    if(it.cat && it.cat !== 'Sem categoria') return _ehCategoriaBebida(it.cat);
    return _ehCategoriaBebida(it.nome);
  }
  if(_filtroTopItens === 'bebidas') return _topItensCache.filter(ehBeb);
  if(_filtroTopItens === 'pratos') return _topItensCache.filter(function(it){ return !ehBeb(it); });
  if(_filtroTopItens.indexOf('cat:') === 0){
    var cat = _filtroTopItens.slice(4);
    return _topItensCache.filter(function(it){ return it.cat === cat; });
  }
  return _topItensCache;
}

function setFiltroTopItens(f){
  _filtroTopItens = f;
  renderTopItensFiltros();
  renderTopItensTabela();
}

function renderTopItensFiltros(){
  var box = document.getElementById('top-itens-filtros');
  if(!box) return;
  function chip(valor, rotulo){
    var ativo = _filtroTopItens === valor;
    return '<button onclick="setFiltroTopItens(\''+valor.replace(/'/g,"\\'")+'\')" style="padding:6px 12px;border-radius:16px;font-size:0.74rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;'+
      'background:'+(ativo?'var(--accent)':'var(--surface2)')+';color:'+(ativo?'#000':'var(--text)')+';border:1px solid '+(ativo?'var(--accent)':'var(--border)')+';">'+rotulo+'</button>';
  }
  // só os grupos que têm item no período (a categoria de cada loja fica no quadro "Vendas por categoria")
  var tem = {}; _topItensCache.forEach(function(it){ tem[it.grupo] = true; });
  if(_filtroTopItens !== 'todos' && !tem[_filtroTopItens]) _filtroTopItens = 'todos';
  var htmlChips = chip('todos','Todos');
  ['buffet','pratos','bebidas','sobremesas','outros'].forEach(function(g){ if(tem[g]) htmlChips += chip(g, _GRUPOS[g]); });
  box.innerHTML = htmlChips;
  var ord = document.getElementById('top-itens-ordem');
  if(ord) ord.innerHTML = '<button class="'+(_ordemTopItens === 'valor' ? 'on' : '')+'" onclick="setOrdemTopItens(\'valor\')">💰 Faturamento</button>'+
    '<button class="'+(_ordemTopItens === 'qtd' ? 'on' : '')+'" onclick="setOrdemTopItens(\'qtd\')">🔢 Quantidade</button>';
}

function renderTopItensTabela(){
  var box = document.getElementById('top-itens-tabela');
  if(!box) return;
  var lista = _filtrarTopItens();
  if(!lista.length){
    box.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:0.85rem;">Nenhum item nesse filtro no período.</div>';
    return;
  }
  var totalQtd = lista.reduce(function(a,i){ return a+i.qtd; },0);
  var totalVal = lista.reduce(function(a,i){ return a+i.valor; },0);
  var t = '<table class="tabela"><thead><tr><th>#</th><th>Item</th><th style="text-align:right;">Qtd</th><th style="text-align:right;">Total</th></tr></thead><tbody>';
  lista.slice(0,15).forEach(function(it, i){
    var sub = it.buffet ? (_GRUPOS.buffet + (it.extra ? ' · ' + it.extra : '') + ' · todas as balanças') : (_GRUPOS[it.grupo] || '') + (it.cat && it.cat !== 'Sem categoria' ? ' · ' + _titulo(it.cat) : '');
    t += '<tr'+(it.buffet ? ' class="it-buffet"' : '')+'><td class="rank">'+(i+1)+'</td><td>'+(it.buffet ? '<b>'+_escH(it.nome)+'</b>' : _escH(it.nome))+
      '<span class="it-cat">'+_escH(sub)+'</span></td>'+
      '<td class="num">'+it.qtd+'</td>'+
      '<td class="num" style="font-size:0.85rem;color:var(--success);">'+fmtR(it.valor)+'</td></tr>';
  });
  t += '</tbody></table>';
  t += '<div style="text-align:right;font-size:0.72rem;color:var(--muted);margin-top:6px;">'+lista.length+' itens distintos · '+totalQtd+' unidades · '+fmtR(totalVal)+'</div>';
  box.innerHTML = t;
}

// Identifica o aparelho de forma amigável a partir do userAgent
function _apelhoAparelho(){
  var ua = navigator.userAgent || '';
  var so = /iPhone/.test(ua) ? 'iPhone'
         : /iPad/.test(ua) ? 'iPad'
         : /Android/.test(ua) ? 'Android'
         : /Windows/.test(ua) ? 'Windows'
         : /Mac/.test(ua) ? 'Mac'
         : 'Outro';
  var nav = /CriOS|Chrome/.test(ua) ? 'Chrome'
          : /FxiOS|Firefox/.test(ua) ? 'Firefox'
          : /Safari/.test(ua) ? 'Safari'
          : 'Navegador';
  return so + ' · ' + nav;
}

// Grava um acesso (silencioso). Throttle de 5 min p/ não contar recarregamentos seguidos.
function registrarAcesso(){
  if(!fbDb) return;
  try {
    var agora = Date.now();
    var ultimo = parseInt(localStorage.getItem('rel_last_acesso') || '0', 10);
    if(agora - ultimo < 5*60*1000){ dlog('Acesso já registrado há pouco (throttle).'); return; }
    localStorage.setItem('rel_last_acesso', String(agora));
  } catch(e){ /* localStorage indisponível: registra mesmo assim */ }

  fbDb.collection('acessos_relatorio').add({
    ts: Date.now(),
    quando: new Date().toLocaleString('pt-BR'),
    aparelho: _apelhoAparelho(),
    ua: (navigator.userAgent || '').slice(0, 180)
  }).then(function(){ dlog('Acesso registrado ('+_apelhoAparelho()+').'); })
    .catch(function(e){ dlog('Não registrou acesso: '+(e.code||'')+' — '+e.message); });
}

// Lê e mostra os últimos acessos no log do debug
function verAcessos(){
  if(!fbDb){ dlog('ERRO: Firestore não inicializado'); return; }
  dlog('Buscando acessos…');
  fbDb.collection('acessos_relatorio').limit(300).get()
    .then(function(snap){
      var arr = [];
      snap.forEach(function(d){ arr.push(d.data()); });
      arr.sort(function(a,b){ return (b.ts||0) - (a.ts||0); });
      if(arr.length === 0){ dlog('ACESSOS: nenhum registro ainda.'); return; }
      var ultimo = arr[0];
      dlog('ACESSOS: '+arr.length+' no total · último: '+(ultimo.quando||'?')+' ('+(ultimo.aparelho||'?')+')');
      // conta por aparelho
      var porAp = {};
      arr.forEach(function(a){ var k=a.aparelho||'?'; porAp[k]=(porAp[k]||0)+1; });
      dlog('Por aparelho: '+Object.keys(porAp).map(function(k){ return k+'='+porAp[k]; }).join(' · '));
      dlog('— Últimos 15 acessos —');
      arr.slice(0,15).forEach(function(a){ dlog('• '+(a.quando||'?')+'  '+(a.aparelho||'?')); });
    })
    .catch(function(e){ dlog('Erro ao ler acessos: '+(e.code||'')+' — '+e.message+' (libere leitura de acessos_relatorio nas regras)'); });
}

function testarLogin(){
  dlog('Teste REST de login anônimo… (online: '+navigator.onLine+')');
  var url = 'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+firebaseConfig.apiKey;
  var ctrl = new AbortController();
  var to = setTimeout(function(){ ctrl.abort(); }, 8000);
  var t0 = Date.now();
  fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({returnSecureToken:true}), signal:ctrl.signal})
    .then(function(r){ return r.json().then(function(j){ return {status:r.status, body:j}; }); })
    .then(function(res){
      clearTimeout(to);
      var dt = Date.now()-t0;
      if(res.status===200 && res.body.idToken){
        dlog('REST OK ('+dt+'ms): login anônimo FUNCIONA pela rede. O travamento é do SDK/ambiente (ex.: file://, cookies de terceiros, webview).');
      } else {
        var err = (res.body && res.body.error && res.body.error.message) || '';
        dlog('REST status '+res.status+' ('+dt+'ms): '+err);
        if(/ADMIN_ONLY_OPERATION|OPERATION_NOT_ALLOWED/.test(err))
          dlog('  → "Anonymous" está DESATIVADO. Ative em Authentication → Sign-in method.');
        else if(/API key|API_KEY|invalid/i.test(err))
          dlog('  → Problema na apiKey ou restrições da chave (Google Cloud → Credentials).');
      }
    })
    .catch(function(e){
      clearTimeout(to);
      dlog('REST FALHOU: '+(e.name==='AbortError'?'timeout 8s':e.message));
      dlog('  → Sem resposta nem pelo REST = é REDE/CONEXÃO (offline, firewall, proxy, ou file://). Não é config do Firebase.');
    });
}

// ── UTILS ──
function showToast(msg, cor){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.color = cor||'var(--text)';
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}
</script>

<script>
// Service Worker DESATIVADO: estava servindo versões em cache (cache-first) e
// impedindo que atualizações aparecessem. Aqui removemos qualquer SW e cache antigos.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations()
    .then(function(regs){ regs.forEach(function(r){ r.unregister(); }); })
    .catch(function(){});
}
if(window.caches && caches.keys){
  caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); }).catch(function(){});
}

// Install prompt
var deferredPrompt;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('btn-instalar').style.display = 'flex';
});
window.addEventListener('appinstalled', function(){
  document.getElementById('btn-instalar').style.display = 'none';
});
</script>
