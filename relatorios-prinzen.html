<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Prinzen · Relatórios</title>
<link rel="manifest" id="pwa-manifest">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Relatórios">
<link rel="apple-touch-icon" href="relatorios-icon-512.png">
<script>
// Injeta manifest dinamicamente com ícone base64
var iconB64 = new URL('relatorios-icon-512.png', location.href).href;
var manifest = {
  name: 'Prinzen · Relatórios',
  short_name: 'Relatórios',
  description: 'Relatórios de vendas Prinzen',
  start_url: '.',
  display: 'standalone',
  background_color: '#080808',
  theme_color: '#080808',
  orientation: 'portrait',
  icons: [
    {src: iconB64, sizes: '512x512', type: 'image/png', purpose: 'any maskable'},
    {src: iconB64, sizes: '192x192', type: 'image/png'}
  ]
};
var blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);
</script>
<link rel="apple-touch-icon" href="relatorios-icon-512.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Bebas+Neue&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#080808;--surface:#121212;--surface2:#1a1a1a;--surface3:#222;
    --border:#242424;--border2:#333;--text:#f0ede8;--muted:#8a8a8a;
    --accent:#d4a843;--accent2:#b8922e;--success:#4ade80;--danger:#f87171;
    --blue1:#3b82f6;--blue2:#1d4ed8;--green1:#22c55e;--green2:#15803d;
    --font:'Space Grotesk',sans-serif;--display:'Bebas Neue',sans-serif;
  }
  html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased;}

  /* ── HEADER ── */
  .app-header{
    background:rgba(8,8,8,0.85);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:14px 18px;display:flex;align-items:center;gap:12px;
    position:sticky;top:0;z-index:50;
  }
  .app-logo{font-family:var(--display);font-size:1.6rem;color:var(--accent);letter-spacing:0.04em;line-height:1;}
  .app-sub{font-size:0.72rem;color:var(--muted);margin-top:2px;}
  .app-header-right{margin-left:auto;display:flex;align-items:center;gap:10px;}

  /* ── CONTAINER ── */
  .container{max-width:480px;margin:0 auto;padding:18px 16px 60px;}

  /* ── RESTAURANTE ── */
  .restaurante-bar{
    display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin-bottom:6px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--border);
  }
  .restaurante-bar::-webkit-scrollbar{display:none;}
  .rest-btn{
    flex:0 0 auto;display:flex;align-items:center;gap:7px;
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    border-radius:14px;padding:9px 14px;font-family:var(--font);font-size:0.85rem;font-weight:600;
    cursor:pointer;white-space:nowrap;transition:all .15s;
  }
  .rest-btn:hover{border-color:var(--border2);}
  .rest-btn.active{
    background:linear-gradient(135deg,var(--blue1),var(--blue2));border-color:transparent;color:#fff;
    box-shadow:0 6px 18px -8px rgba(37,99,235,0.6);
  }
  .rest-count{
    font-size:0.7rem;font-weight:700;background:rgba(255,255,255,0.18);color:inherit;
    padding:1px 7px;border-radius:9px;line-height:1.5;
  }
  .rest-btn:not(.active) .rest-count{background:var(--surface3);color:var(--muted);}

  /* ── PERÍODO ── */
  .periodo-bar{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .periodo-bar::-webkit-scrollbar{display:none;}
  .periodo-btn{
    flex:0 0 auto;background:var(--surface2);border:1px solid var(--border);
    color:var(--muted);border-radius:999px;padding:8px 16px;font-family:var(--font);
    font-size:0.8rem;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s;
  }
  .periodo-btn:hover{border-color:var(--border2);color:var(--text);}
  .periodo-btn.active{
    background:var(--accent);border-color:var(--accent);color:#0a0a0a;font-weight:600;
  }
  .periodo-custom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);
    border:1px solid var(--border);border-radius:14px;padding:12px;}
  .periodo-custom input[type=date]{
    background:var(--surface2);border:1px solid var(--border2);color:var(--text);
    border-radius:8px;padding:8px 10px;font-family:var(--font);font-size:0.8rem;color-scheme:dark;
  }
  .btn-buscar{background:var(--accent);border:none;color:#0a0a0a;border-radius:8px;
    padding:9px 16px;font-family:var(--font);font-size:0.8rem;font-weight:600;cursor:pointer;}

  /* ── KPI CARDS ── */
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;}
  .kpi-card{
    position:relative;overflow:hidden;border-radius:20px;padding:18px;
    background:var(--surface);border:1px solid var(--border);
    display:flex;flex-direction:column;justify-content:space-between;min-height:104px;
  }
  .kpi-card.full{grid-column:1 / -1;min-height:130px;
    background:linear-gradient(135deg,var(--blue1),var(--blue2));border:none;
    box-shadow:0 8px 28px -10px rgba(37,99,235,0.55);}
  .kpi-card.green{
    background:linear-gradient(135deg,var(--green1),var(--green2));border:none;
    box-shadow:0 8px 28px -12px rgba(34,197,94,0.5);}
  .kpi-card:not(.full):not(.green){
    background:linear-gradient(135deg,#2a2415,#181612);border:1px solid #3a3322;}
  .kpi-card.full::after,.kpi-card.green::after{
    content:'';position:absolute;top:-40%;right:-20%;width:160px;height:160px;border-radius:50%;
    background:rgba(255,255,255,0.12);}
  .kpi-label{font-size:0.74rem;font-weight:500;letter-spacing:0.02em;opacity:0.85;position:relative;}
  .kpi-card.full .kpi-label,.kpi-card.green .kpi-label{color:rgba(255,255,255,0.9);}
  .kpi-card:not(.full):not(.green) .kpi-label{color:var(--accent);}
  .kpi-value{font-family:var(--display);font-size:2rem;line-height:1;margin-top:10px;position:relative;letter-spacing:0.01em;}
  .kpi-card.full .kpi-value{font-size:2.6rem;color:#fff;}
  .kpi-card.green .kpi-value,.kpi-card:not(.full):not(.green) .kpi-value{color:#fff;}
  .kpi-sub{font-size:0.74rem;margin-top:8px;color:rgba(255,255,255,0.8);position:relative;}

  /* ── CAIXA DO DIA (Almoço/Janta/Total) ── */
  .caixa-dia{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:2px 0 4px;}
  .cd-cell{border-radius:15px;padding:13px 8px;border:1px solid var(--border);background:var(--surface);text-align:center;}
  .cd-cell.alm{background:linear-gradient(135deg,rgba(251,191,36,0.16),rgba(251,191,36,0.04));border-color:rgba(251,191,36,0.35);}
  .cd-cell.jan{background:linear-gradient(135deg,rgba(129,140,248,0.16),rgba(129,140,248,0.04));border-color:rgba(129,140,248,0.35);}
  .cd-cell.tot{background:linear-gradient(135deg,var(--blue1),var(--blue2));border-color:transparent;box-shadow:0 6px 18px -10px rgba(37,99,235,0.6);}
  .cd-lbl{font-size:0.7rem;color:var(--muted);font-weight:600;margin-bottom:5px;}
  .cd-cell.tot .cd-lbl{color:rgba(255,255,255,0.85);}
  .cd-val{font-family:var(--display);font-size:1.15rem;letter-spacing:0.01em;color:var(--text);line-height:1.1;}
  .cd-cell.alm .cd-val{color:#fbbf24;}
  .cd-cell.jan .cd-val{color:#a5b4fc;}
  .cd-cell.tot .cd-val{color:#fff;font-size:1.3rem;}

  /* ── SEÇÃO ── */
  .secao{
    background:var(--surface);border:1px solid var(--border);border-radius:20px;
    padding:18px;margin-top:14px;
  }
  .secao-titulo{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:0.95rem;font-weight:600;margin-bottom:16px;color:var(--text);
  }

  /* ── BAR CHART ── */
  .bar-chart{display:flex;flex-direction:column;gap:11px;}
  .bar-row{display:flex;align-items:center;gap:10px;}
  .bar-label{flex:0 0 42px;font-size:0.72rem;color:var(--muted);font-weight:500;}
  .bar-label.wide{flex:0 0 84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
  .bar-track{flex:1;position:relative;height:22px;background:var(--surface2);border-radius:7px;overflow:visible;}
  .bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--accent2),var(--accent));
    display:flex;align-items:center;justify-content:flex-end;padding-right:8px;min-width:7px;transition:width .5s ease;}
  .bar-val{font-size:0.68rem;font-weight:600;color:#0a0a0a;white-space:nowrap;}
  .bar-val.outside{position:absolute;top:50%;transform:translateY(-50%);left:calc(var(--w) + 8px);color:var(--text);}

  /* ── TABELA ── */
  .tabela{width:100%;border-collapse:collapse;}
  .tabela th{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);
    font-weight:600;text-align:left;padding:0 0 10px;border-bottom:1px solid var(--border);}
  .tabela td{padding:11px 0;border-bottom:1px solid var(--border);font-size:0.85rem;}
  .tabela tr:last-child td{border-bottom:none;}
  .tabela td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .tabela td.rank{color:var(--accent);font-weight:700;width:26px;font-family:var(--display);font-size:1rem;}

  /* ── COMPARATIVO ── */
  .comp-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .comp-row:last-child{border-bottom:none;}
  .comp-dia{font-size:0.82rem;font-weight:600;}
  .comp-val{font-family:var(--display);font-size:1.05rem;color:var(--accent);}
  .comp-delta{font-size:0.7rem;padding:2px 7px;border-radius:10px;font-weight:600;}
  .comp-delta.up{background:rgba(74,222,128,0.15);color:var(--success);}
  .comp-delta.down{background:rgba(248,113,113,0.15);color:var(--danger);}
  .comp-delta.eq{background:var(--surface2);color:var(--muted);}

  /* ── LOADING ── */
  .loading{text-align:center;padding:48px 20px;color:var(--muted);font-size:0.9rem;line-height:1.6;}
  .spinner{width:34px;height:34px;border:3px solid var(--surface3);border-top-color:var(--accent);
    border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── TOAST ── */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--surface2);border:1px solid var(--border2);color:var(--text);
    padding:12px 20px;border-radius:12px;font-size:0.85rem;opacity:0;pointer-events:none;
    transition:all .3s;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.4);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

  /* ── DEBUG PANEL ── */
  #dbg-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;
    display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
  #dbg-overlay.show{display:flex;}
  #dbg-panel{background:var(--surface);border:1px solid var(--border2);border-bottom:none;
    border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:80vh;
    display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,0.6);}
  #dbg-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
    border-bottom:1px solid var(--border);font-weight:600;font-size:0.95rem;}
  .dbg-x{background:var(--surface2);border:1px solid var(--border2);color:var(--muted);
    width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:0.9rem;}
  #dbg-meta{padding:10px 18px;font-size:0.72rem;color:var(--muted);line-height:1.6;border-bottom:1px solid var(--border);}
  #dbg-log{flex:1;overflow:auto;padding:14px 18px;margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:0.7rem;line-height:1.55;color:#cde7c0;white-space:pre-wrap;word-break:break-word;background:#0c0c0c;}
  #dbg-actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--border);}
  #dbg-actions button{flex:1 1 45%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);
    border-radius:10px;padding:11px 8px;font-family:var(--font);font-size:0.78rem;font-weight:500;cursor:pointer;}
  #dbg-actions button:active{background:var(--surface3);}
</style>
</head>
<body>

<!-- APP -->
<div id="tela-app">
  <div class="app-header">
    <img src="relatorios-icon-512.png" style="width:38px;height:38px;border-radius:8px;object-fit:cover;" alt="Logo">
    <div>
      <div class="app-logo" id="app-logo" onclick="logoTap()" style="cursor:pointer;user-select:none;-webkit-user-select:none;">Relatórios</div>
      <div class="app-sub">Painel de vendas</div>
    </div>
    <div class="app-header-right">
      <button id="btn-instalar" onclick="deferredPrompt&&deferredPrompt.prompt()" style="display:none;background:rgba(212,168,67,0.15);border:1px solid #d4a843;color:#d4a843;border-radius:8px;padding:7px 14px;font-family:'Space Grotesk',sans-serif;font-size:0.78rem;cursor:pointer;align-items:center;gap:5px;"><span>📲</span> Instalar</button>
  <button onclick="location.reload()" style="background:#1a1a1a;border:1px solid #333;color:#888;border-radius:8px;padding:7px 14px;font-family:'Space Grotesk',sans-serif;font-size:0.8rem;cursor:pointer;">↺</button>
    </div>
  </div>

  <div class="container">
    <!-- RESTAURANTE -->
    <div class="restaurante-bar" id="restaurante-bar" style="display:none;"></div>

    <!-- PERÍODO -->
    <div class="periodo-bar" id="periodo-bar">
      <button class="periodo-btn active" onclick="setPeriodo('hoje',this)">Hoje</button>
      <button class="periodo-btn" onclick="setPeriodo('ontem',this)">Ontem</button>
      <button class="periodo-btn" onclick="setPeriodo('semana',this)">7 dias</button>
      <button class="periodo-btn" onclick="setPeriodo('mes',this)">Este mês</button>
      <button class="periodo-btn" onclick="setPeriodo('mes_passado',this)">Mês passado</button>
      <button class="periodo-btn" onclick="setPeriodo('custom',this)">Personalizado</button>
    </div>
    <div id="custom-periodo" style="display:none;margin-bottom:14px;" class="periodo-custom">
      <span style="font-size:0.78rem;color:var(--muted);">De</span>
      <input type="date" id="data-inicio">
      <span style="font-size:0.78rem;color:var(--muted);">até</span>
      <input type="date" id="data-fim">
      <button class="btn-buscar" onclick="carregarDados()">Buscar</button>
    </div>

    <!-- CONTEÚDO -->
    <div id="relatorio-content">
      <div class="loading"><div class="spinner"></div>Carregando...</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- DEBUG PANEL -->
<div id="dbg-overlay" onclick="if(event.target===this)fecharDebug()">
  <div id="dbg-panel">
    <div id="dbg-head">
      <span>🛠️ Debug</span>
      <button onclick="fecharDebug()" class="dbg-x">✕</button>
    </div>
    <div id="dbg-meta"></div>
    <pre id="dbg-log"></pre>
    <div id="dbg-actions">
      <button onclick="verAcessos()">👁️ Acessos</button>
      <button onclick="testarConexao()">Testar Firestore</button>
      <button onclick="recarregarTudo()">Recarregar</button>
      <button onclick="copiarDebug()">Copiar log</button>
    </div>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>

<script>
// ── CONFIG ──
var TENANT_ID = 'tnt_molrfz1k_rznlgl';
var RESTAURANTE_ID = 'prinzen';

var firebaseConfig = {
  apiKey: "AIzaSyBmuVAH50RHsNZ7nAcMCdzulJZf3e86f74",
  authDomain: "gestao-reataurante.firebaseapp.com",
  projectId: "gestao-reataurante",
  storageBucket: "gestao-reataurante.firebasestorage.app",
  messagingSenderId: "510785409925",
  appId: "1:510785409925:web:e687e387509fb0605b6aec"
};

var fbDb = null;
var _periodo = 'hoje';
var _dataInicio = null;
var _dataFim = null;
var _todasContas = null;     // cache de todas as contas do tenant (normalizadas)
var _restauranteSel = null;  // restauranteId selecionado
var _restaurantes = [];      // [{id, label, count}]
var _kpiModo = 'pedidos';    // 'pedidos' (padrão) ou 'itens'
var _almocos = [];           // [{rest, ms, valor}] — almoço manual (registro_almoco)
var _almocoPeriodo = 0;      // soma do almoço no período/restaurante atual

// ── DEBUG ──
var _dbg = [];
var _authReady = false;
function dlog(msg, obj){
  var t = new Date().toISOString().slice(11,23);
  var line = '['+t+'] '+msg + (obj!==undefined ? ' '+JSON.stringify(obj) : '');
  _dbg.push(line);
  if(_dbg.length > 200) _dbg.shift();
  console.log(line);
  var box = document.getElementById('dbg-log');
  if(box){ box.textContent = _dbg.join('\n'); box.scrollTop = box.scrollHeight; }
}
dlog('App iniciado', {restaurante: RESTAURANTE_ID, tenant: TENANT_ID});

// ── INIT ──
try {
  firebase.initializeApp(firebaseConfig);
  fbDb = firebase.firestore();
  try {
    fbDb.settings({ experimentalForceLongPolling: true, experimentalAutoDetectLongPolling: false });
    dlog('Firestore: long-polling forçado.');
  } catch(e){ dlog('settings() falhou: '+e.message); }
  dlog('Firebase inicializado', {projectId: firebaseConfig.projectId});
} catch(e){ dlog('ERRO ao inicializar Firebase: '+e.message); }

// Sem SDK de Auth: o Firestore faz a leitura sem autenticação.
// Se as regras exigirem login, a consulta retorna "permission-denied" (erro claro, sem travar).
dlog('Modo direto: sem SDK de Auth (leitura não autenticada).');
_authReady = true;

// Verifica sessão salva
mostrarApp();
registrarAcesso();

// ── LOGIN ──
function sair(){ location.reload(); }

function mostrarApp(){
  document.getElementById('tela-app').style.display='block';
  setPeriodo('hoje', document.querySelector('.periodo-btn.active'));
}

// ── PERÍODO ──
function setPeriodo(p, btn){
  _periodo = p;
  document.querySelectorAll('.periodo-btn').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');
  var custom = document.getElementById('custom-periodo');
  if(p === 'custom'){
    custom.style.display = 'flex';
    var hoje = new Date();
    document.getElementById('data-inicio').value = fmt(hoje);
    document.getElementById('data-fim').value = fmt(hoje);
    return;
  }
  custom.style.display = 'none';
  _calcPeriodo();
  carregarDados();
}

function fmt(d){ return d.toISOString().slice(0,10); }

function _calcPeriodo(){
  var agora = new Date();
  var ini, fim;
  if(_periodo === 'hoje'){
    ini = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
    fim = new Date(ini); fim.setDate(fim.getDate()+1);
  } else if(_periodo === 'ontem'){
    ini = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate()-1);
    fim = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
  } else if(_periodo === 'semana'){
    ini = new Date(agora); ini.setDate(ini.getDate()-6); ini.setHours(0,0,0,0);
    fim = new Date(agora); fim.setHours(23,59,59,999); fim.setDate(fim.getDate()+1);
  } else if(_periodo === 'mes'){
    ini = new Date(agora.getFullYear(), agora.getMonth(), 1);
    fim = new Date(agora.getFullYear(), agora.getMonth()+1, 1);
  } else if(_periodo === 'mes_passado'){
    ini = new Date(agora.getFullYear(), agora.getMonth()-1, 1);
    fim = new Date(agora.getFullYear(), agora.getMonth(), 1);
  }
  _dataInicio = ini;
  _dataFim = fim;
}

// ── CARREGAR DADOS ──
function carregarDados(){
  if(_periodo === 'custom'){
    var di = document.getElementById('data-inicio').value;
    var df = document.getElementById('data-fim').value;
    if(!di || !df) return;
    _dataInicio = new Date(di+'T00:00:00');
    _dataFim = new Date(df+'T23:59:59');
  }
  // Já temos os dados em cache → só refiltra (instantâneo)
  if(_todasContas){ _aplicarFiltros(); return; }

  document.getElementById('relatorio-content').innerHTML =
    '<div class="loading"><div class="spinner"></div>Carregando dados...</div>';
  dlog('Buscando contas do tenant…', {tenant:TENANT_ID});

  esperarAuth(function(ok){
    if(!ok) dlog('Login não confirmado — tentando consulta mesmo assim.');
    _buscarTudo();
  });
}

function recarregarTudo(){ _todasContas = null; carregarDados(); }

function esperarAuth(cb){
  if(_authReady) return cb(true);
  var esperou = 0;
  var iv = setInterval(function(){
    if(_authReady){ clearInterval(iv); return cb(true); }
    esperou += 200;
    if(esperou >= 8000){ clearInterval(iv); dlog('esperarAuth: tempo esgotado (8s) sem login'); return cb(false); }
  }, 200);
}

// Converte vários formatos de data para milissegundos
function toMillis(v){
  if(v == null) return 0;
  if(typeof v === 'number') return v < 1e12 ? v * 1000 : v; // segundos vs ms
  if(typeof v === 'string'){ var t = Date.parse(v); return isNaN(t) ? 0 : t; }
  if(typeof v === 'object'){
    if(typeof v.toMillis === 'function') return v.toMillis();           // Firestore Timestamp
    if(typeof v.seconds === 'number') return v.seconds * 1000 + (v.nanoseconds ? Math.floor(v.nanoseconds/1e6) : 0);
    if(typeof v._seconds === 'number') return v._seconds * 1000;
  }
  return 0;
}

function labelRest(id){
  var nomes = { 'default':'Bavaro', 'prinzen':'Prinzen', 'omar_cafe':'Omar Café' };
  return nomes[id] || (id.charAt(0).toUpperCase()+id.slice(1));
}

// Lê as DUAS fontes: contas_fechadas (Principal/garçom) + pedidos_totem pagos (Prinzen/totem)
function _buscarTudo(){
  var _respondeu = false;
  var _watchdog = setTimeout(function(){
    if(_respondeu) return;
    dlog('TIMEOUT: consulta não retornou em 12s.');
    document.getElementById('relatorio-content').innerHTML =
      '<div class="loading" style="color:var(--danger);">⏱️ A consulta não respondeu.<br><small style="color:var(--muted);">Toque 5× no título "Relatórios" para ver o debug.</small></div>';
  }, 12000);

  var tref = fbDb.collection('tenants').doc(TENANT_ID);

  function lerContas(){
    return fbDb.collection('contas_fechadas').where('tenantId','==',TENANT_ID).get()
      .then(function(s){ return {tipo:'contas', rid:null, snap:s}; })
      .catch(function(e){ dlog('contas_fechadas falhou: '+(e.code||'')+' — '+e.message); return {tipo:'contas', rid:null, snap:null}; });
  }
  function lerTotem(rid){
    return tref.collection('restaurantes').doc(rid).collection('pedidos_totem')
      .get()
      .then(function(s){ return {tipo:'totem', rid:rid, snap:s}; })
      .catch(function(e){ dlog('totem/'+rid+' falhou: '+(e.code||'')+' — '+e.message); return {tipo:'totem', rid:rid, snap:null}; });
  }

  // Status que NÃO contam como venda (pedido não concluído)
  var STATUS_NAO_VENDA = {'cancelado':1,'cancelada':1,'aguardando_pagamento':1,'pendente':1,'aberto':1,'aberta':1,'rejeitado':1,'rejeitada':1};

  // Lê o almoço manual (registro_almoco) por ID de documento (get), cobrindo os últimos 70 dias.
  // Buscar por ID contorna regras que bloqueiam consulta (list) mas liberam leitura simples (get).
  function lerAlmocos(){
    _almocos = [];
    var col = fbDb.collection('registro_almoco');
    var dias = 70, jobs = [];
    var base = new Date(); base.setHours(12,0,0,0);
    for(var i=0; i<dias; i++){
      (function(d){
        var ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        jobs.push(
          col.doc('almoco_default_'+ds).get()
            .then(function(snap){ return {ds:ds, snap:snap, err:null}; })
            .catch(function(e){ return {ds:ds, snap:null, err:e}; })
        );
      })(new Date(base.getTime() - i*86400000));
    }
    return Promise.all(jobs).then(function(rs){
      var permErr=null, n=0;
      rs.forEach(function(r){
        if(r.err){ if(!permErr) permErr=r.err; return; }
        if(r.snap && r.snap.exists){
          var x = r.snap.data() || {};
          _almocos.push({ rest:'default', ms:new Date(r.ds+'T12:00:00').getTime(), valor:x.valor||0 });
          n++;
        }
      });
      if(permErr) dlog('registro_almoco BLOQUEADO: '+(permErr.code||'')+' — '+permErr.message+' (libere leitura nas regras do Firestore)');
      dlog('registro_almoco: '+n+' lançamento(s) de almoço (últimos '+dias+' dias)');
      return {tipo:'almoco'};
    });
  }

  // 1) Descobre os restaurantes do tenant; 2) lê contas_fechadas + pedidos_totem de cada um
  tref.collection('restaurantes').get()
    .then(function(rs){ var ids=[]; rs.forEach(function(d){ ids.push(d.id); }); return ids; })
    .catch(function(e){ dlog('lista de restaurantes falhou: '+(e.code||'')+' — '+e.message); return []; })
    .then(function(rids){
      if(rids.indexOf(RESTAURANTE_ID) < 0) rids.push(RESTAURANTE_ID);
      if(rids.indexOf('default') < 0) rids.push('default');
      if(rids.indexOf('omar_cafe') < 0) rids.push('omar_cafe');
      dlog('Restaurantes do tenant: '+rids.join(', '));
      var jobs = [ lerContas(), lerAlmocos() ].concat(rids.map(lerTotem));
      return Promise.all(jobs);
    })
    .then(function(resultados){
      _respondeu = true; clearTimeout(_watchdog);

      var byKey = {}, mapRest = {}, statusPorRest = {};
      resultados.forEach(function(r){
        if(!r || r.tipo === 'almoco') return;
        var size = r.snap ? r.snap.size : 'erro';
        dlog('Fonte '+(r.tipo === 'contas' ? 'contas_fechadas' : 'totem/'+r.rid)+': '+size+' doc(s)');
        if(!r.snap) return;
        r.snap.forEach(function(d){
          var dados = d.data();

          if(r.tipo === 'totem'){
            // tally de status p/ diagnóstico
            var st = (dados.status || '(sem status)');
            statusPorRest[r.rid] = statusPorRest[r.rid] || {};
            statusPorRest[r.rid][st] = (statusPorRest[r.rid][st]||0) + 1;
            // ignora pedidos que não são venda concluída (cancelado/aguardando/etc.)
            if(STATUS_NAO_VENDA[String(st).toLowerCase()]) return;
          }

          var key = (r.rid || 'cf') + '_' + d.id;
          if(byKey[key]) return;
          var c = Object.assign({_docId:d.id}, dados);
          if(r.tipo === 'totem'){
            c._rest = r.rid;
            c.fechadaEm = toMillis(dados.pagoEm) || toMillis(dados.data) || toMillis(dados.criadoEm);
          } else {
            c._rest = dados.restauranteId || dados.id || 'default';
            c.fechadaEm = toMillis(dados.fechadoEm) || toMillis(dados.fechadaEm) || toMillis(dados.criadoEm);
          }
          c.total = (typeof dados.total === 'number') ? dados.total : (dados.valorTotal || 0);
          byKey[key] = c;
          mapRest[c._rest] = (mapRest[c._rest]||0) + 1;
        });
      });

      // Log dos status encontrados em cada restaurante do totem
      Object.keys(statusPorRest).forEach(function(rid){
        var det = Object.keys(statusPorRest[rid]).map(function(s){ return s+'='+statusPorRest[rid][s]; }).join(', ');
        dlog('Status totem/'+rid+': '+det);
      });

      _todasContas = Object.keys(byKey).map(function(k){ return byKey[k]; });
      dlog('Total de vendas (únicas): '+_todasContas.length);

      _restaurantes = Object.keys(mapRest).map(function(id){ return {id:id, label:labelRest(id), count:mapRest[id]}; })
                                          .sort(function(a,b){ return b.count - a.count; });
      dlog('Restaurantes com vendas: '+(_restaurantes.map(function(r){ return r.id+' ('+r.count+')'; }).join(', ')||'nenhum'));

      if(_restauranteSel === null){
        var temPrinzen = _restaurantes.some(function(r){ return r.id === RESTAURANTE_ID; });
        _restauranteSel = temPrinzen ? RESTAURANTE_ID : (_restaurantes[0] ? _restaurantes[0].id : 'default');
      }
      _montarSeletorRestaurante();
      _aplicarFiltros();
    });
}

function _montarSeletorRestaurante(){
  var wrap = document.getElementById('restaurante-bar');
  if(!wrap) return;
  if(_restaurantes.length < 1){ wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  wrap.innerHTML = _restaurantes.map(function(r){
    var on = r.id === _restauranteSel ? ' active' : '';
    return '<button class="rest-btn'+on+'" onclick="selecionarRestaurante(\''+r.id+'\', this)">'+
             r.label+'<span class="rest-count">'+r.count+'</span></button>';
  }).join('');
}

function selecionarRestaurante(id, btn){
  _restauranteSel = id;
  document.querySelectorAll('.rest-btn').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');
  dlog('Restaurante selecionado: '+id);
  _aplicarFiltros();
}

function alternarKpi(){
  _kpiModo = (_kpiModo === 'itens') ? 'pedidos' : 'itens';
  _aplicarFiltros();
}

// Filtra o cache por restaurante + período e renderiza
function _aplicarFiltros(){
  if(!_todasContas) return;
  var ini = _dataInicio.getTime(), fim = _dataFim.getTime();
  var contas = _todasContas.filter(function(c){
    return c._rest === _restauranteSel && c.fechadaEm >= ini && c.fechadaEm <= fim;
  });
  // Soma do almoço manual (só o Bavaro/default usa) no período
  _almocoPeriodo = _almocos.filter(function(a){
    return a.rest === _restauranteSel && a.ms >= ini && a.ms <= fim;
  }).reduce(function(s,a){ return s + (a.valor||0); }, 0);

  dlog('Filtro aplicado', {restaurante:_restauranteSel, periodo:_periodo, contas:contas.length, almoco:_almocoPeriodo});

  if(contas.length === 0 && _almocoPeriodo <= 0){
    var doRest = _todasContas.filter(function(c){ return c._rest === _restauranteSel; });
    var maxFe = doRest.reduce(function(m,c){ return c.fechadaEm > m ? c.fechadaEm : m; }, 0);
    document.getElementById('relatorio-content').innerHTML =
      '<div class="loading">📭 Sem vendas neste período para '+labelRest(_restauranteSel)+'.<br>'+
      '<small style="color:var(--muted);">'+
      (doRest.length
        ? 'Última venda: '+(maxFe?new Date(maxFe).toLocaleDateString('pt-BR'):'—')+' · '+doRest.length+' conta(s) no histórico'
        : 'Nenhuma venda registrada para este restaurante')+
      '</small></div>';
    return;
  }
  renderRelatorio(contas);
}

// ── RENDER ──
function fmtR(v){
  return 'R$ '+(v||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}
function fmtN(v){ return (v||0).toFixed(2).replace('.',','); }

function renderRelatorio(contas){
  if(!contas.length){
    document.getElementById('relatorio-content').innerHTML =
      '<div class="loading" style="padding:60px;">📭<br><br>Nenhuma venda no período selecionado.</div>';
    return;
  }

  // ── AGREGAR ──
  var totalVendas = 0, totalMesas = contas.length;
  var vendasPorDia = {}, itensMapa = {}, catMapa = {};

  contas.forEach(function(c){
    var val = c.total || c.valorTotal || 0;
    totalVendas += val;

    // Por dia
    var d = new Date(c.fechadaEm);
    var dKey = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    vendasPorDia[dKey] = (vendasPorDia[dKey]||0) + val;

    // Itens
    (c.itens||[]).forEach(function(it){
      if(it.status === 'cancelado') return;
      var nome = it.nome || 'Item';
      var qtd = it.qtd || 1;
      var vIt = (it.tipoVenda==='kg' ? (it.preco||0) : (it.preco||0)*qtd);
      if(!itensMapa[nome]) itensMapa[nome] = {qtd:0, valor:0};
      itensMapa[nome].qtd += qtd;
      itensMapa[nome].valor += vIt;

      // Por categoria
      var cat = it.categoriaNome || it.categoriaId || 'Sem categoria';
      if(!catMapa[cat]) catMapa[cat] = {qtd:0, valor:0};
      catMapa[cat].qtd += qtd;
      catMapa[cat].valor += vIt;
    });
  });

  var ticketMedio = totalMesas > 0 ? totalVendas/totalMesas : 0;

  // ── TOP ITENS ──
  var topItens = Object.keys(itensMapa).map(function(k){ return {nome:k, qtd:itensMapa[k].qtd, valor:itensMapa[k].valor}; });
  topItens.sort(function(a,b){ return b.qtd-a.qtd; });

  // ── TOP CATEGORIAS ──
  var topCats = Object.keys(catMapa).map(function(k){ return {nome:k, qtd:catMapa[k].qtd, valor:catMapa[k].valor}; });
  topCats.sort(function(a,b){ return b.valor-a.valor; });

  // ── VENDAS POR DIA ──
  var diasOrdenados = Object.keys(vendasPorDia).sort();
  var maxDia = Math.max.apply(null, diasOrdenados.map(function(d){ return vendasPorDia[d]; })) || 1;

  // ── COMPARATIVO SEMANA ──
  var diasSemana = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  var semanaAtual = {}, semanaAnterior = {};
  var agora = new Date();
  contas.forEach(function(c){
    var d = new Date(c.fechadaEm);
    var diffDias = Math.floor((agora - d) / 86400000);
    if(diffDias < 7) semanaAtual[d.getDay()] = (semanaAtual[d.getDay()]||0) + (c.total||0);
    else if(diffDias < 14) semanaAnterior[d.getDay()] = (semanaAnterior[d.getDay()]||0) + (c.total||0);
  });

  // ── HTML ──
  var html = '';

  var almoco = _almocoPeriodo || 0;
  var janta = totalVendas;            // contas_fechadas / vendas do app
  var totalGeral = janta + almoco;    // total do período (inclui almoço manual)

  // KPIs
  html += '<div class="kpi-grid">';
  html += '<div class="kpi-card full"><div class="kpi-label">Total no período</div>'+
    '<div class="kpi-value">'+fmtR(totalGeral)+'</div>'+
    '<div class="kpi-sub">'+totalMesas+' conta'+(totalMesas!==1?'s':'')+' fechada'+(totalMesas!==1?'s':'')+
    (almoco>0 ? ' · inclui almoço manual' : '')+'</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Ticket médio</div>'+
    '<div class="kpi-value" style="font-size:1.3rem;">'+fmtR(ticketMedio)+'</div></div>';
  var totalItensVendidos = topItens.reduce(function(a,i){ return a+i.qtd; }, 0);
  var kpiLabel = _kpiModo === 'itens' ? 'Itens vendidos' : 'Pedidos feitos';
  var kpiVal   = _kpiModo === 'itens' ? totalItensVendidos : totalMesas;
  html += '<div class="kpi-card green" onclick="alternarKpi()" style="cursor:pointer;">'+
    '<div class="kpi-label">'+kpiLabel+'</div>'+
    '<div class="kpi-value">'+kpiVal+'</div>'+
    '<div class="kpi-sub" style="opacity:0.75;">toque p/ '+(_kpiModo==='itens'?'pedidos':'itens')+'</div></div>';
  html += '</div>';

  // ☀️ Almoço + 🌙 Janta (só aparece quando há almoço manual lançado)
  if(almoco > 0){
    html += '<div class="caixa-dia">'+
      '<div class="cd-cell alm"><div class="cd-lbl">☀️ Almoço</div><div class="cd-val">'+fmtR(almoco)+'</div></div>'+
      '<div class="cd-cell jan"><div class="cd-lbl">🌙 Janta</div><div class="cd-val">'+fmtR(janta)+'</div></div>'+
      '<div class="cd-cell tot"><div class="cd-lbl">Total</div><div class="cd-val">'+fmtR(totalGeral)+'</div></div>'+
    '</div>';
  }

  // Vendas por dia
  if(diasOrdenados.length > 1){
    html += '<div class="secao"><div class="secao-titulo">Vendas por dia</div><div class="bar-chart">';
    diasOrdenados.forEach(function(d){
      var v = vendasPorDia[d];
      var pct = Math.max(4, Math.round(v/maxDia*100));
      var parts = d.split('-');
      var label = parts[2]+'/'+parts[1];
      html += '<div class="bar-row">'+
        '<div class="bar-label">'+label+'</div>'+
        '<div class="bar-track">'+
          '<div class="bar-fill" style="width:'+pct+'%">'+
            (pct > 20 ? '<span class="bar-val">'+fmtR(v)+'</span>' : '')+
          '</div>'+
          (pct <= 20 ? '<span class="bar-val outside" style="--w:'+pct+'%">'+fmtR(v)+'</span>' : '')+
        '</div>'+
      '</div>';
    });
    html += '</div></div>';
  }

  // Top itens mais vendidos
  html += '<div class="secao"><div class="secao-titulo">🏆 Itens mais vendidos</div>';
  html += '<table class="tabela"><thead><tr><th>#</th><th>Item</th><th style="text-align:right;">Qtd</th><th style="text-align:right;">Total</th></tr></thead><tbody>';
  topItens.slice(0,15).forEach(function(it, i){
    html += '<tr><td class="rank">'+(i+1)+'</td><td>'+it.nome+'</td>'+
      '<td class="num">'+it.qtd+'</td>'+
      '<td class="num" style="font-size:0.85rem;color:var(--success);">'+fmtR(it.valor)+'</td></tr>';
  });
  html += '</tbody></table></div>';

  // Vendas por categoria
  if(topCats.length > 0){
    var maxCat = topCats[0].valor || 1;
    html += '<div class="secao"><div class="secao-titulo">📂 Vendas por categoria</div><div class="bar-chart">';
    topCats.forEach(function(c){
      var pct = Math.max(4, Math.round(c.valor/maxCat*100));
      html += '<div class="bar-row">'+
        '<div class="bar-label wide" title="'+c.nome+'">'+c.nome+'</div>'+
        '<div class="bar-track">'+
          '<div class="bar-fill" style="width:'+pct+'%">'+
            (pct > 25 ? '<span class="bar-val">'+fmtR(c.valor)+'</span>' : '')+
          '</div>'+
          (pct <= 25 ? '<span class="bar-val outside" style="--w:'+pct+'%">'+fmtR(c.valor)+'</span>' : '')+
        '</div>'+
        '<span style="font-size:0.68rem;color:var(--muted);flex-shrink:0;">'+c.qtd+'x</span>'+
      '</div>';
    });
    html += '</div></div>';
  }

  // Comparativo semana atual vs anterior (só mostra se período >= 7 dias)
  if(_periodo === 'semana' || _periodo === 'mes' || _periodo === 'mes_passado'){
    html += '<div class="secao"><div class="secao-titulo">📊 Comparativo por dia da semana<span style="font-size:0.65rem;color:var(--muted);">Atual vs Anterior</span></div>';
    for(var d=0;d<7;d++){
      var vAtual = semanaAtual[d]||0;
      var vAnt = semanaAnterior[d]||0;
      var delta = vAnt > 0 ? Math.round((vAtual-vAnt)/vAnt*100) : null;
      var deltaHtml = '';
      if(delta !== null){
        var cls = delta > 0 ? 'up' : delta < 0 ? 'down' : 'eq';
        deltaHtml = '<span class="comp-delta '+cls+'">'+(delta>0?'+':'')+delta+'%</span>';
      }
      html += '<div class="comp-row">'+
        '<div class="comp-dia">'+diasSemana[d]+'</div>'+
        '<div style="display:flex;align-items:center;gap:8px;">'+
          '<span style="font-size:0.72rem;color:var(--muted);">'+fmtR(vAnt)+'</span>'+
          '<span style="color:var(--muted);">→</span>'+
          '<span class="comp-val">'+fmtR(vAtual)+'</span>'+
          deltaHtml+
        '</div>'+
      '</div>';
    }
    html += '</div>';
  }

  document.getElementById('relatorio-content').innerHTML = html;
}

// Identifica o aparelho de forma amigável a partir do userAgent
function _apelhoAparelho(){
  var ua = navigator.userAgent || '';
  var so = /iPhone/.test(ua) ? 'iPhone'
         : /iPad/.test(ua) ? 'iPad'
         : /Android/.test(ua) ? 'Android'
         : /Windows/.test(ua) ? 'Windows'
         : /Mac/.test(ua) ? 'Mac'
         : 'Outro';
  var nav = /CriOS|Chrome/.test(ua) ? 'Chrome'
          : /FxiOS|Firefox/.test(ua) ? 'Firefox'
          : /Safari/.test(ua) ? 'Safari'
          : 'Navegador';
  return so + ' · ' + nav;
}

// Grava um acesso (silencioso). Throttle de 5 min p/ não contar recarregamentos seguidos.
function registrarAcesso(){
  if(!fbDb) return;
  try {
    var agora = Date.now();
    var ultimo = parseInt(localStorage.getItem('rel_last_acesso') || '0', 10);
    if(agora - ultimo < 5*60*1000){ dlog('Acesso já registrado há pouco (throttle).'); return; }
    localStorage.setItem('rel_last_acesso', String(agora));
  } catch(e){ /* localStorage indisponível: registra mesmo assim */ }

  fbDb.collection('acessos_relatorio').add({
    ts: Date.now(),
    quando: new Date().toLocaleString('pt-BR'),
    aparelho: _apelhoAparelho(),
    ua: (navigator.userAgent || '').slice(0, 180)
  }).then(function(){ dlog('Acesso registrado ('+_apelhoAparelho()+').'); })
    .catch(function(e){ dlog('Não registrou acesso: '+(e.code||'')+' — '+e.message); });
}

// Lê e mostra os últimos acessos no log do debug
function verAcessos(){
  if(!fbDb){ dlog('ERRO: Firestore não inicializado'); return; }
  dlog('Buscando acessos…');
  fbDb.collection('acessos_relatorio').limit(300).get()
    .then(function(snap){
      var arr = [];
      snap.forEach(function(d){ arr.push(d.data()); });
      arr.sort(function(a,b){ return (b.ts||0) - (a.ts||0); });
      if(arr.length === 0){ dlog('ACESSOS: nenhum registro ainda.'); return; }
      var ultimo = arr[0];
      dlog('ACESSOS: '+arr.length+' no total · último: '+(ultimo.quando||'?')+' ('+(ultimo.aparelho||'?')+')');
      // conta por aparelho
      var porAp = {};
      arr.forEach(function(a){ var k=a.aparelho||'?'; porAp[k]=(porAp[k]||0)+1; });
      dlog('Por aparelho: '+Object.keys(porAp).map(function(k){ return k+'='+porAp[k]; }).join(' · '));
      dlog('— Últimos 15 acessos —');
      arr.slice(0,15).forEach(function(a){ dlog('• '+(a.quando||'?')+'  '+(a.aparelho||'?')); });
    })
    .catch(function(e){ dlog('Erro ao ler acessos: '+(e.code||'')+' — '+e.message+' (libere leitura de acessos_relatorio nas regras)'); });
}

function testarLogin(){
  dlog('Teste REST de login anônimo… (online: '+navigator.onLine+')');
  var url = 'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+firebaseConfig.apiKey;
  var ctrl = new AbortController();
  var to = setTimeout(function(){ ctrl.abort(); }, 8000);
  var t0 = Date.now();
  fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({returnSecureToken:true}), signal:ctrl.signal})
    .then(function(r){ return r.json().then(function(j){ return {status:r.status, body:j}; }); })
    .then(function(res){
      clearTimeout(to);
      var dt = Date.now()-t0;
      if(res.status===200 && res.body.idToken){
        dlog('REST OK ('+dt+'ms): login anônimo FUNCIONA pela rede. O travamento é do SDK/ambiente (ex.: file://, cookies de terceiros, webview).');
      } else {
        var err = (res.body && res.body.error && res.body.error.message) || '';
        dlog('REST status '+res.status+' ('+dt+'ms): '+err);
        if(/ADMIN_ONLY_OPERATION|OPERATION_NOT_ALLOWED/.test(err))
          dlog('  → "Anonymous" está DESATIVADO. Ative em Authentication → Sign-in method.');
        else if(/API key|API_KEY|invalid/i.test(err))
          dlog('  → Problema na apiKey ou restrições da chave (Google Cloud → Credentials).');
      }
    })
    .catch(function(e){
      clearTimeout(to);
      dlog('REST FALHOU: '+(e.name==='AbortError'?'timeout 8s':e.message));
      dlog('  → Sem resposta nem pelo REST = é REDE/CONEXÃO (offline, firewall, proxy, ou file://). Não é config do Firebase.');
    });
}

function showToast(msg, cor){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.color = cor||'var(--text)';
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

<script>
// Service Worker DESATIVADO: estava servindo versões em cache (cache-first) e
// impedindo que atualizações aparecessem. Aqui removemos qualquer SW e cache antigos.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations()
    .then(function(regs){ regs.forEach(function(r){ r.unregister(); }); })
    .catch(function(){});
}
if(window.caches && caches.keys){
  caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); }).catch(function(){});
}

// Install prompt
var deferredPrompt;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('btn-instalar').style.display = 'flex';
});
window.addEventListener('appinstalled', function(){
  document.getElementById('btn-instalar').style.display = 'none';
});
</script>
