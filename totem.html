<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bávaro — Autoatendimento</title>
<link rel="manifest" href="/manifest-totem.json">
<link rel="apple-touch-icon" href="/icone-totem-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icone-totem-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icone-totem-512.png">
<meta name="theme-color" content="#d4a843">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bávaro Totem">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#0a0a0c;
    --surface:#16161c;
    --surface2:#1d1d24;
    --border:rgba(255,255,255,0.08);
    --text:#f5f5f7;
    --muted:#8a8a93;
    --accent:#d4a843;
    --verde:#22c55e;
    --vermelho:#ef4444;
    /* Variáveis de layout (configuráveis pelo painel secreto) */
    --lateral-width:140px;
    --colunas:2;
    --foto-ratio:16/10;
    --item-radius:11px;
  }
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',sans-serif;
    user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;
  }

  /* ═══ TELA INICIAL ═══ */
  .tela-inicial{
    position:fixed;inset:0;z-index:100;
    background:linear-gradient(135deg,#0a0a0c 0%,#1a1410 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
    transition:opacity 0.4s;
  }
  .tela-inicial.escondida{opacity:0;pointer-events:none;}
  .ti-logo{
    font-family:'Bebas Neue',sans-serif;
    font-size:7rem;letter-spacing:0.06em;
    color:var(--accent);line-height:1;
    margin-bottom:14px;
    text-shadow:0 4px 30px rgba(212,168,67,0.3);
  }
  .ti-sub{
    font-size:1.4rem;color:var(--muted);
    margin-bottom:60px;font-weight:300;
  }
  .ti-bater{
    font-size:2.2rem;font-weight:700;
    color:var(--accent);
    padding:24px 60px;
    border:3px solid var(--accent);
    border-radius:18px;
    animation:pulse 1.8s ease infinite;
  }
  .ti-instrucao{
    margin-top:30px;font-size:1.1rem;color:var(--muted);
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(212,168,67,0.4);}
    50%{transform:scale(1.04);box-shadow:0 0 0 20px rgba(212,168,67,0);}
  }

  /* ═══ APP PRINCIPAL — LAYOUT COM MENU LATERAL ═══ */
  #app{height:100%;display:flex;flex-direction:row;}

  /* ── MENU LATERAL ESQUERDO ── */
  .lateral{
    width:var(--lateral-width);flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .lateral-topo{
    padding:14px 8px 12px;
    border-bottom:1px solid var(--border);
    text-align:center;
  }
  .lateral-topo .logo{
    font-family:'Bebas Neue',sans-serif;
    font-size:1.6rem;color:var(--accent);letter-spacing:0.05em;line-height:1;
  }
  .lateral-topo .sub{font-size:0.66rem;color:var(--muted);margin-top:2px;}
  .lateral-cats{
    flex:1;overflow-y:auto;padding:8px 5px;
  }
  .lateral-cats::-webkit-scrollbar{width:0;}
  .cat-side{
    width:100%;
    background:transparent;border:none;
    color:var(--text);
    padding:11px 5px;margin-bottom:3px;
    border-radius:11px;
    cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;
    transition:background 0.15s;
  }
  .cat-side .ico{
    font-size:1.65rem;line-height:1;
  }
  .cat-side .nm{
    font-size:0.74rem;font-weight:600;text-align:center;
    line-height:1.15;
    word-break:break-word;
  }
  .cat-side:active{transform:scale(0.96);}
  .cat-side.ativa{
    background:var(--accent);
    color:#000;
  }

  /* ── CONTEÚDO À DIREITA ── */
  .main{
    flex:1;display:flex;flex-direction:column;
    min-width:0;
    background:var(--bg);
  }

  /* TOPO: título da categoria + cancelar */
  .topo{
    display:flex;align-items:center;
    padding:12px 18px 6px;
    gap:12px;flex-shrink:0;
  }
  .topo .titulo-cat{
    flex:1;font-size:1.35rem;font-weight:700;
    line-height:1;
  }
  .topo .voltar{
    background:var(--surface2);border:1px solid var(--border);
    color:var(--text);padding:8px 14px;border-radius:9px;
    font-size:0.82rem;font-weight:600;cursor:pointer;font-family:inherit;
  }

  /* BUSCA */
  .busca-box{
    margin:6px 18px 10px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:10px;
    padding:9px 13px;
    display:flex;align-items:center;gap:8px;
    flex-shrink:0;
  }
  .busca-box .ico{font-size:1rem;color:var(--muted);}
  .busca-box input{
    flex:1;background:transparent;border:none;
    color:var(--text);font-size:0.88rem;
    outline:none;font-family:inherit;
  }
  .busca-box input::placeholder{color:var(--muted);}

  /* GRADE DE ITENS */
  .conteudo{
    flex:1;overflow-y:auto;
    padding:4px 18px 100px;
  }
  .conteudo::-webkit-scrollbar{width:6px;}
  .conteudo::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .grade{
    display:grid;
    grid-template-columns:repeat(var(--colunas), 1fr);
    gap:10px;
  }
  .item{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--item-radius);
    overflow:hidden;
    cursor:pointer;
    transition:transform 0.15s, border-color 0.15s;
    display:flex;flex-direction:column;
    position:relative;
  }
  .item:active{transform:scale(0.97);border-color:var(--accent);}
  .item .foto{
    width:100%;aspect-ratio:var(--foto-ratio);
    background:linear-gradient(135deg,#1d1d24,#13131a);
    display:flex;align-items:center;justify-content:center;
    font-size:1.8rem;color:#3a3a45;
    overflow:hidden;
  }
  .item .foto img{width:100%;height:100%;object-fit:cover;}
  .item .info{padding:8px 10px 10px;flex:1;display:flex;flex-direction:column;}
  .item .nome{font-size:0.82rem;font-weight:700;line-height:1.2;margin-bottom:3px;}
  .item .desc{font-size:0.66rem;color:var(--muted);line-height:1.25;margin-bottom:3px;}
  .item .preco{
    margin-top:auto;
    font-family:'Bebas Neue',sans-serif;
    font-size:1.05rem;color:var(--accent);letter-spacing:0.02em;
  }
  .item .badge-cart{
    position:absolute;top:6px;right:6px;
    background:var(--verde);color:#fff;
    font-size:0.72rem;font-weight:800;
    width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    z-index:2;box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }

  /* VAZIO */
  .vazio{
    grid-column:1/-1;
    text-align:center;padding:50px 20px;color:var(--muted);
  }
  .vazio .ico{font-size:3rem;margin-bottom:12px;}
  .vazio .titulo{font-size:1rem;font-weight:600;margin-bottom:4px;}
  .vazio .desc{font-size:0.82rem;}

  /* ═══ BARRA INFERIOR (CARRINHO) ═══ */
  .barra-carrinho{
    position:fixed;left:var(--lateral-width);right:0;bottom:0;z-index:50;
    background:linear-gradient(180deg,#16161c,#0e0e12);
    border-top:1px solid var(--border);
    padding:11px 18px;
    display:flex;align-items:center;gap:12px;
    box-shadow:0 -4px 20px rgba(0,0,0,0.4);
  }
  .barra-info{
    flex:1;cursor:pointer;
    text-align:center;
  }
  .barra-titulo{font-size:0.72rem;color:var(--muted);}
  .barra-total{
    font-family:'Bebas Neue',sans-serif;
    font-size:1.55rem;color:var(--accent);letter-spacing:0.02em;line-height:1;
  }
  .btn-voltar{
    background:transparent;border:1.5px solid var(--accent);
    color:var(--accent);padding:11px 22px;border-radius:10px;
    font-size:0.92rem;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .btn-voltar:disabled{
    border-color:var(--border);color:var(--muted);
    cursor:not-allowed;opacity:0.5;
  }
  .btn-finalizar{
    background:var(--accent);border:none;
    color:#000;padding:11px 22px;border-radius:10px;
    font-size:0.92rem;font-weight:800;cursor:pointer;font-family:inherit;
  }
  .btn-finalizar:active{transform:scale(0.96);}

  /* ═══ MODAL CARRINHO ═══ */
  .modal-bg{
    position:fixed;inset:0;z-index:200;
    background:rgba(0,0,0,0.85);
    display:none;
    align-items:center;justify-content:center;
    padding:20px;
  }
  .modal-bg.aberto{display:flex;}
  .modal-cart{
    background:var(--surface);border:1px solid var(--border);
    border-radius:20px;
    max-width:640px;width:100%;
    max-height:85vh;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .modal-cab{
    padding:20px 24px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  .modal-cab h2{font-size:1.4rem;font-weight:700;}
  .modal-fechar{
    background:var(--surface2);border:none;color:var(--text);
    width:42px;height:42px;border-radius:50%;
    font-size:1.5rem;cursor:pointer;font-family:inherit;
  }
  .modal-body{flex:1;overflow-y:auto;padding:16px 24px;}
  .cart-vazio{
    text-align:center;padding:40px 20px;color:var(--muted);
    font-size:1.05rem;
  }
  .cart-item{
    display:flex;align-items:center;gap:14px;
    padding:14px 0;border-bottom:1px solid var(--border);
  }
  .cart-item .foto-mini{
    width:60px;height:60px;border-radius:10px;
    background:var(--surface2);
    display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;color:var(--muted);overflow:hidden;flex-shrink:0;
  }
  .cart-item .foto-mini img{width:100%;height:100%;object-fit:cover;}
  .cart-item .info{flex:1;min-width:0;}
  .cart-item .nome{font-weight:700;font-size:0.98rem;line-height:1.2;}
  .cart-item .preco{color:var(--accent);font-weight:700;font-size:0.92rem;margin-top:2px;}
  .cart-qtd{display:flex;align-items:center;gap:10px;}
  .cart-qtd button{
    width:36px;height:36px;border-radius:50%;
    background:var(--surface2);border:1px solid var(--border);
    color:var(--text);font-size:1.2rem;font-weight:700;cursor:pointer;
    font-family:inherit;
  }
  .cart-qtd .n{font-weight:700;min-width:24px;text-align:center;font-size:1rem;}
  .cart-rodape{
    padding:18px 24px;border-top:1px solid var(--border);
    background:rgba(0,0,0,0.2);
  }
  .cart-total-linha{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:14px;
  }
  .cart-total-lbl{font-size:1rem;color:var(--muted);}
  .cart-total-val{
    font-family:'Bebas Neue',sans-serif;
    font-size:2rem;color:var(--accent);letter-spacing:0.02em;
  }
  .cart-rodape .btn-finalizar{width:100%;padding:18px;font-size:1.1rem;}

  /* ═══ MODAL DE PERSONALIZAÇÃO DE ITEM ═══ */
  .modal-item{
    background:var(--surface);border:1px solid var(--border);
    border-radius:20px;
    max-width:560px;width:100%;
    max-height:92vh;
    display:flex;flex-direction:column;
    overflow:hidden;position:relative;
  }
  .mi-fechar-x{
    position:absolute;top:14px;right:14px;z-index:3;
    background:rgba(0,0,0,0.5);
  }
  .mi-foto{
    width:100%;aspect-ratio:16/9;
    background:linear-gradient(135deg,#1d1d24,#13131a);
    display:flex;align-items:center;justify-content:center;
    font-size:5rem;color:#3a3a45;
    overflow:hidden;flex-shrink:0;
  }
  .mi-foto img{width:100%;height:100%;object-fit:cover;}
  .mi-corpo{
    flex:1;overflow-y:auto;
    padding:20px 24px;
  }
  .mi-nome{font-size:1.5rem;font-weight:700;line-height:1.2;margin-bottom:4px;}
  .mi-desc{font-size:0.92rem;color:var(--muted);line-height:1.4;margin-bottom:16px;}
  /* Grupos no modal */
  #mi-grupos{margin-top:6px;}
  .grupo-box{
    margin-bottom:18px;
    animation:slideIn 0.25s ease;
  }
  @keyframes slideIn{
    from{opacity:0;transform:translateY(-8px);}
    to{opacity:1;transform:translateY(0);}
  }
  .grupo-cab{margin-bottom:8px;}
  .grupo-nome{font-size:1.05rem;font-weight:700;}
  .grupo-sub{font-size:0.78rem;color:var(--muted);margin-top:2px;}
  .grupo-opcoes{display:flex;flex-direction:column;gap:8px;}
  .opcao{
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;
    background:var(--surface2);border:1.5px solid var(--border);
    border-radius:12px;cursor:pointer;
    transition:all 0.15s;
  }
  .opcao:active{transform:scale(0.98);}
  .opcao.selecionada{
    background:rgba(212,168,67,0.12);border-color:var(--accent);
  }
  .op-radio,.op-check{
    width:24px;height:24px;border-radius:50%;
    border:2px solid var(--border);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:all 0.15s;
  }
  .op-check{border-radius:6px;font-weight:800;font-size:0.9rem;color:#000;}
  .op-radio.on{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--surface2);}
  .op-check.on{background:var(--accent);border-color:var(--accent);}
  .op-nome{flex:1;font-size:1rem;font-weight:600;}
  .op-preco{color:var(--accent);font-weight:700;font-size:0.92rem;}

  /* Quantidade */
  .mi-qtd-box{
    margin-top:12px;
    padding:14px 16px;background:var(--surface2);border-radius:12px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .mi-qtd-lbl{font-size:1rem;font-weight:600;}
  .mi-qtd-ctrl{display:flex;align-items:center;gap:14px;}
  .mi-qtd-ctrl button{
    width:42px;height:42px;border-radius:50%;
    background:var(--surface);border:1.5px solid var(--border);
    color:var(--text);font-size:1.4rem;font-weight:700;cursor:pointer;
    font-family:inherit;
  }
  .mi-qtd-ctrl .n{font-size:1.3rem;font-weight:700;min-width:30px;text-align:center;}

  /* Rodapé do modal de item */
  .mi-rodape{
    padding:16px 24px;border-top:1px solid var(--border);
    background:rgba(0,0,0,0.2);flex-shrink:0;
  }
  .mi-total-linha{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:14px;
  }
  .mi-total-lbl{font-size:1rem;color:var(--muted);}
  .mi-total-val{
    font-family:'Bebas Neue',sans-serif;
    font-size:2rem;color:var(--accent);letter-spacing:0.02em;
  }
  .mi-add{width:100%;padding:18px;font-size:1.1rem;}
  .mi-add.desabilitado{
    background:var(--surface2)!important;
    color:var(--muted)!important;
    cursor:not-allowed;
  }

  /* Tag de "obrigatório" no grupo */
  .grupo-obrigatorio-tag{
    background:rgba(239,68,68,0.15);color:#f87171;
    font-size:0.66rem;font-weight:800;
    padding:3px 8px;border-radius:5px;
    margin-left:8px;letter-spacing:0.04em;
    text-transform:uppercase;vertical-align:middle;
  }

  /* Grupo destacado quando faltando seleção obrigatória */
  .grupo-box.faltando{
    animation:tremer 0.4s ease;
  @keyframes fadeIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}
  }
  .grupo-box.faltando .grupo-nome{
    color:var(--vermelho);
  }
  .grupo-box.faltando .grupo-opcoes{
    border:2px solid var(--vermelho);
    border-radius:12px;
    padding:6px;
    background:rgba(239,68,68,0.05);
  }
  @keyframes tremer{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  /* Label de opções no carrinho */
  .cart-item .sel-label{
    font-size:0.78rem;color:var(--muted);
    margin-top:2px;line-height:1.3;
  }

  /* ═══ TIMER DE INATIVIDADE (volta pra tela inicial) ═══ */
  .toast-vazio{
    position:fixed;top:80px;left:50%;transform:translateX(-50%);
    background:var(--surface);border:1px solid var(--border);
    color:var(--text);padding:12px 24px;border-radius:12px;
    font-size:0.9rem;z-index:300;
    display:none;
  }

  /* ═══ TELA DE ERRO/CARREGANDO ═══ */
  .carregando{
    position:fixed;inset:0;z-index:90;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;
  }
  .carregando.escondido{display:none;}
  .spinner{
    width:50px;height:50px;border:4px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;
    animation:girar 0.8s linear infinite;
  }
  @keyframes girar{to{transform:rotate(360deg);}}
  @keyframes fadeInTela{from{opacity:0;}to{opacity:1;}}
  /* Animações do wizard (passo a passo) */
  @keyframes wizSlideInRight{
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes wizSlideInLeft{
    from { opacity: 0; transform: translateX(-40px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes wizSlideOutLeft{
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(-40px); }
  }
  @keyframes wizSlideOutRight{
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(40px); }
  }
  .wiz-anim-in-right { animation: wizSlideInRight 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
  .wiz-anim-in-left { animation: wizSlideInLeft 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
  .wiz-anim-out-left { animation: wizSlideOutLeft 0.22s cubic-bezier(0.55, 0, 0.68, 0.06) forwards; }
  .wiz-anim-out-right { animation: wizSlideOutRight 0.22s cubic-bezier(0.55, 0, 0.68, 0.06) forwards; }
  /* Confirmação ao tocar (escolha única avança) */
  @keyframes wizPulseGreen{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); box-shadow: 0 0 0 8px rgba(74, 222, 128, 0.3); }
  }
  .wiz-card-confirmado { animation: wizPulseGreen 0.25s ease-out; }
  .carregando .txt{color:var(--muted);font-size:1rem;}

  /* ═══ Responsivo: tablet em retrato ═══ */
  @media(max-width:900px){
    .ti-logo{font-size:5rem;}
    .ti-sub{font-size:1.1rem;}
    .ti-bater{font-size:1.6rem;padding:18px 40px;}
    .grade{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;}
    .conteudo{padding:14px 16px 130px;}
    .topo,.cats{padding-left:16px;padding-right:16px;}
    .item .nome{font-size:0.95rem;}
    .item .preco{font-size:1.25rem;}
    .cat{padding:11px 18px;font-size:0.92rem;}
  }
</style>
</head>
<body>

<!-- Código de Debug Integrado -->
<script>
  var _debugToques = 0;
  var _debugTimer = null;

  function verificarDebug(event) {
    _debugToques++;
    
    // Reseta o contador se demorar muito entre os cliques (ex: 1 segundo)
    clearTimeout(_debugTimer);
    _debugTimer = setTimeout(() => { _debugToques = 0; }, 1000);

    if (_debugToques === 3) {
      _debugToques = 0;
      // Força a exibição do painel de debug
      var panel = document.getElementById('debug-panel');
      panel.style.display = 'block';
      console.log("Debug ativado pelo usuário.");
    }
  }
</script>

<!-- Tela inicial — cliente toca pra começar -->
<div class="tela-inicial" id="tela-inicial" onclick="comecarPedido(); verificarDebug(event);">
  <div class="ti-logo">&#8203;</div>
  <div class="ti-sub">Carregando...</div>
  <div class="ti-bater">TOQUE PARA INICIAR</div>
  <div class="ti-instrucao">Faça seu pedido por aqui 👆</div>
</div>

<!-- DEBUG PANEL -->
<div id="debug-panel" style="
  position:fixed;bottom:0;left:0;right:0;z-index:9999;
  background:rgba(0,0,0,0.92);border-top:2px solid #d4a843;
  font-family:monospace;font-size:11px;color:#a3e635;
  padding:10px 12px;max-height:45vh;overflow-y:auto;
  display:none;
">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <span style="color:#d4a843;font-weight:bold;font-size:13px;">🐛 DEBUG TOTEM</span>
    <button onclick="document.getElementById('debug-panel').style.display='none'"
      style="background:#333;border:1px solid #555;color:#fff;border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;">✕ fechar</button>
  </div>
  <div id="debug-log" style="white-space:pre-wrap;line-height:1.6;"></div>
  <button onclick="
    var t=document.getElementById('debug-log').textContent;
    if(navigator.clipboard){navigator.clipboard.writeText(t);}
    this.textContent='✅ Copiado!';setTimeout(()=>this.textContent='📋 Copiar tudo',2000);
  " style="margin-top:8px;background:#d4a843;color:#000;border:none;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;width:100%;">📋 Copiar tudo</button>
</div>

</body>
</html>
