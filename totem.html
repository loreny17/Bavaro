<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bávaro — Autoatendimento</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#0a0a0c;
    --surface:#16161c;
    --surface2:#1d1d24;
    --border:rgba(255,255,255,0.08);
    --text:#f5f5f7;
    --muted:#8a8a93;
    --accent:#d4a843;
    --verde:#22c55e;
    --vermelho:#ef4444;
  }
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',sans-serif;
    user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;
  }

  /* ═══ TELA INICIAL ═══ */
  .tela-inicial{
    position:fixed;inset:0;z-index:100;
    background:linear-gradient(135deg,#0a0a0c 0%,#1a1410 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
    transition:opacity 0.4s;
  }
  .tela-inicial.escondida{opacity:0;pointer-events:none;}
  .ti-logo{
    font-family:'Bebas Neue',sans-serif;
    font-size:7rem;letter-spacing:0.06em;
    color:var(--accent);line-height:1;
    margin-bottom:14px;
    text-shadow:0 4px 30px rgba(212,168,67,0.3);
  }
  .ti-sub{
    font-size:1.4rem;color:var(--muted);
    margin-bottom:60px;font-weight:300;
  }
  .ti-bater{
    font-size:2.2rem;font-weight:700;
    color:var(--accent);
    padding:24px 60px;
    border:3px solid var(--accent);
    border-radius:18px;
    animation:pulse 1.8s ease infinite;
  }
  .ti-instrucao{
    margin-top:30px;font-size:1.1rem;color:var(--muted);
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(212,168,67,0.4);}
    50%{transform:scale(1.04);box-shadow:0 0 0 20px rgba(212,168,67,0);}
  }

  /* ═══ APP PRINCIPAL ═══ */
  #app{height:100%;display:flex;flex-direction:column;}

  /* CABEÇALHO */
  .topo{
    display:flex;align-items:center;
    padding:14px 26px;background:var(--surface);
    border-bottom:1px solid var(--border);
    gap:18px;flex-shrink:0;
  }
  .topo .logo{
    font-family:'Bebas Neue',sans-serif;
    font-size:2rem;color:var(--accent);letter-spacing:0.05em;line-height:1;
  }
  .topo .sub{font-size:0.78rem;color:var(--muted);}
  .topo .voltar{
    margin-left:auto;
    background:var(--surface2);border:1px solid var(--border);
    color:var(--text);padding:10px 18px;border-radius:10px;
    font-size:0.86rem;font-weight:600;cursor:pointer;font-family:inherit;
  }

  /* ABAS DE CATEGORIAS */
  .cats{
    display:flex;gap:10px;
    padding:14px 26px;background:var(--surface);
    border-bottom:1px solid var(--border);
    overflow-x:auto;flex-shrink:0;
  }
  .cats::-webkit-scrollbar{height:0;}
  .cat{
    padding:14px 26px;border-radius:14px;
    background:var(--surface2);border:1px solid var(--border);
    font-size:1.05rem;font-weight:700;color:var(--text);
    cursor:pointer;white-space:nowrap;flex-shrink:0;
    font-family:inherit;
  }
  .cat.ativa{background:var(--accent);color:#000;border-color:var(--accent);}

  /* GRADE DE ITENS */
  .conteudo{
    flex:1;overflow-y:auto;
    padding:20px 26px 140px;
  }
  .conteudo::-webkit-scrollbar{width:12px;}
  .conteudo::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
  .grade{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:18px;
  }
  .item{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    cursor:pointer;
    transition:transform 0.15s, border-color 0.15s;
    display:flex;flex-direction:column;
  }
  .item:active{transform:scale(0.97);border-color:var(--accent);}
  .item .foto{
    width:100%;aspect-ratio:4/3;
    background:linear-gradient(135deg,#1d1d24,#13131a);
    display:flex;align-items:center;justify-content:center;
    font-size:3.5rem;color:#3a3a45;
    overflow:hidden;
  }
  .item .foto img{width:100%;height:100%;object-fit:cover;}
  .item .info{padding:14px 14px 16px;flex:1;display:flex;flex-direction:column;}
  .item .nome{
    font-size:1.05rem;font-weight:700;line-height:1.25;
    margin-bottom:6px;
  }
  .item .desc{
    font-size:0.8rem;color:var(--muted);line-height:1.3;
    margin-bottom:8px;
  }
  .item .preco{
    margin-top:auto;
    font-family:'Bebas Neue',sans-serif;
    font-size:1.5rem;color:var(--accent);letter-spacing:0.02em;
  }
  .item .badge-cart{
    position:absolute;
    background:var(--verde);color:#fff;
    font-size:0.8rem;font-weight:800;
    width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin:8px;
  }

  /* VAZIO */
  .vazio{
    grid-column:1/-1;
    text-align:center;padding:80px 20px;color:var(--muted);
  }
  .vazio .ico{font-size:4rem;margin-bottom:16px;}
  .vazio .titulo{font-size:1.2rem;font-weight:600;margin-bottom:6px;}
  .vazio .desc{font-size:0.9rem;}

  /* ═══ BARRA INFERIOR (CARRINHO) ═══ */
  .barra-carrinho{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:linear-gradient(180deg,#16161c,#0e0e12);
    border-top:1px solid var(--border);
    padding:16px 26px;
    display:flex;align-items:center;gap:16px;
    box-shadow:0 -4px 20px rgba(0,0,0,0.4);
    transform:translateY(110%);
    transition:transform 0.3s ease;
  }
  .barra-carrinho.visivel{transform:translateY(0);}
  .barra-info{flex:1;}
  .barra-titulo{font-size:0.82rem;color:var(--muted);}
  .barra-total{
    font-family:'Bebas Neue',sans-serif;
    font-size:2rem;color:var(--accent);letter-spacing:0.02em;line-height:1;
  }
  .barra-btns{display:flex;gap:10px;}
  .btn-ver-carrinho{
    background:var(--surface2);border:1px solid var(--border);
    color:var(--text);padding:14px 24px;border-radius:12px;
    font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .btn-finalizar{
    background:var(--accent);border:none;
    color:#000;padding:16px 36px;border-radius:12px;
    font-size:1.05rem;font-weight:800;cursor:pointer;font-family:inherit;
  }
  .btn-finalizar:active{transform:scale(0.96);}

  /* ═══ MODAL CARRINHO ═══ */
  .modal-bg{
    position:fixed;inset:0;z-index:200;
    background:rgba(0,0,0,0.85);
    display:none;
    align-items:center;justify-content:center;
    padding:20px;
  }
  .modal-bg.aberto{display:flex;}
  .modal-cart{
    background:var(--surface);border:1px solid var(--border);
    border-radius:20px;
    max-width:640px;width:100%;
    max-height:85vh;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .modal-cab{
    padding:20px 24px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  .modal-cab h2{font-size:1.4rem;font-weight:700;}
  .modal-fechar{
    background:var(--surface2);border:none;color:var(--text);
    width:42px;height:42px;border-radius:50%;
    font-size:1.5rem;cursor:pointer;font-family:inherit;
  }
  .modal-body{flex:1;overflow-y:auto;padding:16px 24px;}
  .cart-vazio{
    text-align:center;padding:40px 20px;color:var(--muted);
    font-size:1.05rem;
  }
  .cart-item{
    display:flex;align-items:center;gap:14px;
    padding:14px 0;border-bottom:1px solid var(--border);
  }
  .cart-item .foto-mini{
    width:60px;height:60px;border-radius:10px;
    background:var(--surface2);
    display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;color:var(--muted);overflow:hidden;flex-shrink:0;
  }
  .cart-item .foto-mini img{width:100%;height:100%;object-fit:cover;}
  .cart-item .info{flex:1;min-width:0;}
  .cart-item .nome{font-weight:700;font-size:0.98rem;line-height:1.2;}
  .cart-item .preco{color:var(--accent);font-weight:700;font-size:0.92rem;margin-top:2px;}
  .cart-qtd{display:flex;align-items:center;gap:10px;}
  .cart-qtd button{
    width:36px;height:36px;border-radius:50%;
    background:var(--surface2);border:1px solid var(--border);
    color:var(--text);font-size:1.2rem;font-weight:700;cursor:pointer;
    font-family:inherit;
  }
  .cart-qtd .n{font-weight:700;min-width:24px;text-align:center;font-size:1rem;}
  .cart-rodape{
    padding:18px 24px;border-top:1px solid var(--border);
    background:rgba(0,0,0,0.2);
  }
  .cart-total-linha{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:14px;
  }
  .cart-total-lbl{font-size:1rem;color:var(--muted);}
  .cart-total-val{
    font-family:'Bebas Neue',sans-serif;
    font-size:2rem;color:var(--accent);letter-spacing:0.02em;
  }
  .cart-rodape .btn-finalizar{width:100%;padding:18px;font-size:1.1rem;}

  /* ═══ MODAL DE PERSONALIZAÇÃO DE ITEM ═══ */
  .modal-item{
    background:var(--surface);border:1px solid var(--border);
    border-radius:20px;
    max-width:560px;width:100%;
    max-height:92vh;
    display:flex;flex-direction:column;
    overflow:hidden;position:relative;
  }
  .mi-fechar-x{
    position:absolute;top:14px;right:14px;z-index:3;
    background:rgba(0,0,0,0.5);
  }
  .mi-foto{
    width:100%;aspect-ratio:16/9;
    background:linear-gradient(135deg,#1d1d24,#13131a);
    display:flex;align-items:center;justify-content:center;
    font-size:5rem;color:#3a3a45;
    overflow:hidden;flex-shrink:0;
  }
  .mi-foto img{width:100%;height:100%;object-fit:cover;}
  .mi-corpo{
    flex:1;overflow-y:auto;
    padding:20px 24px;
  }
  .mi-nome{font-size:1.5rem;font-weight:700;line-height:1.2;margin-bottom:4px;}
  .mi-desc{font-size:0.92rem;color:var(--muted);line-height:1.4;margin-bottom:16px;}
  /* Grupos no modal */
  #mi-grupos{margin-top:6px;}
  .grupo-box{
    margin-bottom:18px;
    animation:slideIn 0.25s ease;
  }
  @keyframes slideIn{
    from{opacity:0;transform:translateY(-8px);}
    to{opacity:1;transform:translateY(0);}
  }
  .grupo-cab{margin-bottom:8px;}
  .grupo-nome{font-size:1.05rem;font-weight:700;}
  .grupo-sub{font-size:0.78rem;color:var(--muted);margin-top:2px;}
  .grupo-opcoes{display:flex;flex-direction:column;gap:8px;}
  .opcao{
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;
    background:var(--surface2);border:1.5px solid var(--border);
    border-radius:12px;cursor:pointer;
    transition:all 0.15s;
  }
  .opcao:active{transform:scale(0.98);}
  .opcao.selecionada{
    background:rgba(212,168,67,0.12);border-color:var(--accent);
  }
  .op-radio,.op-check{
    width:24px;height:24px;border-radius:50%;
    border:2px solid var(--border);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:all 0.15s;
  }
  .op-check{border-radius:6px;font-weight:800;font-size:0.9rem;color:#000;}
  .op-radio.on{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--surface2);}
  .op-check.on{background:var(--accent);border-color:var(--accent);}
  .op-nome{flex:1;font-size:1rem;font-weight:600;}
  .op-preco{color:var(--accent);font-weight:700;font-size:0.92rem;}

  /* Quantidade */
  .mi-qtd-box{
    margin-top:12px;
    padding:14px 16px;background:var(--surface2);border-radius:12px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .mi-qtd-lbl{font-size:1rem;font-weight:600;}
  .mi-qtd-ctrl{display:flex;align-items:center;gap:14px;}
  .mi-qtd-ctrl button{
    width:42px;height:42px;border-radius:50%;
    background:var(--surface);border:1.5px solid var(--border);
    color:var(--text);font-size:1.4rem;font-weight:700;cursor:pointer;
    font-family:inherit;
  }
  .mi-qtd-ctrl .n{font-size:1.3rem;font-weight:700;min-width:30px;text-align:center;}

  /* Rodapé do modal de item */
  .mi-rodape{
    padding:16px 24px;border-top:1px solid var(--border);
    background:rgba(0,0,0,0.2);flex-shrink:0;
  }
  .mi-total-linha{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:14px;
  }
  .mi-total-lbl{font-size:1rem;color:var(--muted);}
  .mi-total-val{
    font-family:'Bebas Neue',sans-serif;
    font-size:2rem;color:var(--accent);letter-spacing:0.02em;
  }
  .mi-add{width:100%;padding:18px;font-size:1.1rem;}

  /* Label de opções no carrinho */
  .cart-item .sel-label{
    font-size:0.78rem;color:var(--muted);
    margin-top:2px;line-height:1.3;
  }

  /* ═══ TIMER DE INATIVIDADE (volta pra tela inicial) ═══ */
  .toast-vazio{
    position:fixed;top:80px;left:50%;transform:translateX(-50%);
    background:var(--surface);border:1px solid var(--border);
    color:var(--text);padding:12px 24px;border-radius:12px;
    font-size:0.9rem;z-index:300;
    display:none;
  }

  /* ═══ TELA DE ERRO/CARREGANDO ═══ */
  .carregando{
    position:fixed;inset:0;z-index:90;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;
  }
  .carregando.escondido{display:none;}
  .spinner{
    width:50px;height:50px;border:4px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;
    animation:girar 0.8s linear infinite;
  }
  @keyframes girar{to{transform:rotate(360deg);}}
  .carregando .txt{color:var(--muted);font-size:1rem;}

  /* ═══ Responsivo: tablet em retrato ═══ */
  @media(max-width:900px){
    .ti-logo{font-size:5rem;}
    .ti-sub{font-size:1.1rem;}
    .ti-bater{font-size:1.6rem;padding:18px 40px;}
    .grade{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;}
    .conteudo{padding:14px 16px 130px;}
    .topo,.cats{padding-left:16px;padding-right:16px;}
    .item .nome{font-size:0.95rem;}
    .item .preco{font-size:1.25rem;}
    .cat{padding:11px 18px;font-size:0.92rem;}
  }
</style>
</head>
<body>

<!-- Tela inicial — cliente toca pra começar -->
<div class="tela-inicial" id="tela-inicial" onclick="comecarPedido()">
  <div class="ti-logo">BÁVARO</div>
  <div class="ti-sub">Restaurante</div>
  <div class="ti-bater">TOQUE PARA INICIAR</div>
  <div class="ti-instrucao">Faça seu pedido por aqui 👆</div>
</div>

<!-- Loading -->
<div class="carregando" id="carregando">
  <div class="spinner"></div>
  <div class="txt" id="carregando-txt">Carregando cardápio...</div>
</div>

<!-- App principal (escondido até cliente tocar) -->
<div id="app" style="display:none;">

  <!-- Cabeçalho -->
  <div class="topo">
    <div>
      <div class="logo">BÁVARO</div>
      <div class="sub">Faça seu pedido</div>
    </div>
    <button class="voltar" onclick="voltarTelaInicial()">← Cancelar</button>
  </div>

  <!-- Categorias -->
  <div class="cats" id="cats"></div>

  <!-- Itens -->
  <div class="conteudo">
    <div class="grade" id="grade">
      <div class="vazio">
        <div class="ico">⏳</div>
        <div class="titulo">Carregando itens...</div>
      </div>
    </div>
  </div>
</div>

<!-- Barra do carrinho (fixa embaixo) -->
<div class="barra-carrinho" id="barra-carrinho">
  <div class="barra-info">
    <div class="barra-titulo" id="barra-resumo">0 itens</div>
    <div class="barra-total" id="barra-total">R$ 0,00</div>
  </div>
  <div class="barra-btns">
    <button class="btn-ver-carrinho" onclick="abrirCarrinho()">Ver carrinho</button>
    <button class="btn-finalizar" onclick="finalizarPedido()">Finalizar →</button>
  </div>
</div>

<!-- Modal de personalização do item -->
<div class="modal-bg" id="modal-item" onclick="if(event.target===this)fecharModalItem()">
  <div class="modal-item">
    <button class="modal-fechar mi-fechar-x" onclick="fecharModalItem()">×</button>
    <div class="mi-foto" id="mi-foto">🍽️</div>
    <div class="mi-corpo">
      <div class="mi-nome" id="mi-nome">—</div>
      <div class="mi-desc" id="mi-desc"></div>
      <div id="mi-grupos"></div>
      <div class="mi-qtd-box">
        <span class="mi-qtd-lbl">Quantidade</span>
        <div class="mi-qtd-ctrl">
          <button onclick="alterarQtdModal(-1)">−</button>
          <span class="n" id="mi-qtd">1</span>
          <button onclick="alterarQtdModal(1)">+</button>
        </div>
      </div>
    </div>
    <div class="mi-rodape">
      <div class="mi-total-linha">
        <span class="mi-total-lbl">Total</span>
        <span class="mi-total-val" id="mi-total">R$ 0,00</span>
      </div>
      <button class="btn-finalizar mi-add" onclick="confirmarAdicionarAoCarrinho()">Adicionar ao pedido →</button>
    </div>
  </div>
</div>

<!-- Modal carrinho -->
<div class="modal-bg" id="modal-carrinho" onclick="if(event.target===this)fecharCarrinho()">
  <div class="modal-cart">
    <div class="modal-cab">
      <h2>🛒 Seu Pedido</h2>
      <button class="modal-fechar" onclick="fecharCarrinho()">×</button>
    </div>
    <div class="modal-body" id="cart-itens">
      <div class="cart-vazio">Carrinho vazio</div>
    </div>
    <div class="cart-rodape">
      <div class="cart-total-linha">
        <span class="cart-total-lbl">Total</span>
        <span class="cart-total-val" id="cart-total-val">R$ 0,00</span>
      </div>
      <button class="btn-finalizar" onclick="fecharCarrinho();finalizarPedido();">Finalizar Pedido →</button>
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ════════════════════════════════════════════════════════════════
//  BÁVARO TOTEM — Autoatendimento (tablet do cliente)
//  Lê 2 fontes de cardápio:
//   - cardapio_totem/data/ (comidas próprias)
//   - cardapio/data/ (categorias selecionadas no PDV — bebidas, etc)
// ════════════════════════════════════════════════════════════════

var firebaseConfig = {
  apiKey: "AIzaSyBmuVAH50RHsNZ7nAcMCdzulJZf3e86f74",
  authDomain: "gestao-reataurante.firebaseapp.com",
  projectId: "gestao-reataurante",
  storageBucket: "gestao-reataurante.appspot.com",
  messagingSenderId: "1071289891873",
  appId: "1:1071289891873:web:bavaro-app"
};
var fbDb = null;

// Tenant/restaurante (via URL ou padrão)
var _params = new URLSearchParams(window.location.search);
var _tenantId = _params.get('tenant') || 'tnt_molrfz1k_rznlgl';
var _restauranteId = _params.get('rest') || 'default';

// Estado
var _totemItens = [];        // itens do cardapio_totem
var _totemCats = [];         // categorias do cardapio_totem
var _catsPrincipaisIds = []; // ids das categorias do principal escolhidas
var _itensPrincipal = [];    // itens do principal que entram (filtrados pelas cats)
var _catsPrincipal = [];     // categorias do principal (pra ter o nome)

var _carrinho = [];          // [{itemId, nome, preco, foto, qtd}]
var _grupos = [];            // grupos de adicionais (totem + principal mesclados)
var _catAtiva = '';          // id da categoria ativa (vazio = primeira)
var _timerInatividade = null;
var _itemAberto = null;      // item aberto no modal de personalização
var _selecoesTemp = {};      // {grupoId: [opcaoIdx, ...]} — escolhas no modal
var _qtdTemp = 1;

// ─── Inicialização ───
window.addEventListener('load', function(){
  try{
    firebase.initializeApp(firebaseConfig);
    fbDb = firebase.firestore();
    carregarTudo();
  }catch(e){
    mostrarErro('Erro ao iniciar: ' + e.message);
  }
});

function mostrarErro(msg){
  document.getElementById('carregando-txt').textContent = msg;
  document.getElementById('carregando').style.background = '#2a1010';
}

// Carrega o cardápio (totem próprio + categorias selecionadas do principal)
function carregarTudo(){
  var base = fbDb.collection('tenants').doc(_tenantId)
    .collection('restaurantes').doc(_restauranteId);

  // 1. Config do totem (categorias do principal escolhidas)
  var p1 = base.collection('cardapio_totem').doc('config').get().then(function(doc){
    if(doc.exists){
      var d = doc.data();
      _catsPrincipaisIds = d.categoriasPrincipais || [];
    }
  }).catch(function(e){ console.warn('config:', e); });

  // 2. Categorias do totem (próprias)
  var p2 = base.collection('cardapio_totem').doc('data').collection('categorias').get()
    .then(function(snap){
      _totemCats = [];
      snap.forEach(function(d){ _totemCats.push(Object.assign({id:d.id, fonte:'totem'}, d.data())); });
      _totemCats.sort(function(a,b){ return (a.ordem||0) - (b.ordem||0); });
    }).catch(function(e){ console.warn('cats totem:', e); _totemCats = []; });

  // 3. Itens do totem (próprios)
  var p3 = base.collection('cardapio_totem').doc('data').collection('itens').get()
    .then(function(snap){
      _totemItens = [];
      snap.forEach(function(d){
        var v = d.data();
        if(v.ativo === false) return; // só ativos
        _totemItens.push(Object.assign({id:d.id, fonte:'totem'}, v));
      });
    }).catch(function(e){ console.warn('itens totem:', e); _totemItens = []; });

  // 4. Categorias do cardápio PRINCIPAL (todas, depois filtra pelas escolhidas)
  var p4 = base.collection('cardapio').doc('data').collection('categorias').get()
    .then(function(snap){
      _catsPrincipal = [];
      snap.forEach(function(d){ _catsPrincipal.push(Object.assign({id:d.id, fonte:'principal'}, d.data())); });
    }).catch(function(e){ console.warn('cats principal:', e); _catsPrincipal = []; });

  // 5. Itens do cardápio principal (todos, depois filtra pelas categorias)
  var p5 = base.collection('cardapio').doc('data').collection('itens').get()
    .then(function(snap){
      _itensPrincipal = [];
      snap.forEach(function(d){
        var v = d.data();
        if(v.disponivel === false) return; // só disponíveis
        _itensPrincipal.push(Object.assign({id:d.id, fonte:'principal'}, v));
      });
    }).catch(function(e){ console.warn('itens principal:', e); _itensPrincipal = []; });

  // 6. Grupos do TOTEM
  var p6 = base.collection('cardapio_totem').doc('data').collection('grupos_opcoes').get()
    .then(function(snap){
      snap.forEach(function(d){ _grupos.push(Object.assign({id:d.id, fonte:'totem'}, d.data())); });
    }).catch(function(e){ console.warn('grupos totem:', e); });

  // 7. Grupos do PRINCIPAL (pras bebidas e categorias importadas)
  var p7 = base.collection('cardapio').doc('data').collection('grupos_opcoes').get()
    .then(function(snap){
      snap.forEach(function(d){ _grupos.push(Object.assign({id:d.id, fonte:'principal'}, d.data())); });
    }).catch(function(e){ console.warn('grupos principal:', e); });

  Promise.all([p1, p2, p3, p4, p5, p6, p7]).then(function(){
    montarCardapio();
  });
}

// Junta tudo e renderiza
function montarCardapio(){
  // Filtra categorias do principal que foram selecionadas
  var catsPrincSelecionadas = _catsPrincipal.filter(function(c){
    return _catsPrincipaisIds.indexOf(c.id) >= 0;
  });
  // Filtra itens do principal que estão nas categorias selecionadas
  var itensPrincFiltrados = _itensPrincipal.filter(function(it){
    return _catsPrincipaisIds.indexOf(it.categoria) >= 0;
  });

  // Junta as categorias (próprias do totem primeiro, depois do principal)
  window._cardapioCats = _totemCats.concat(catsPrincSelecionadas);
  // Junta os itens
  window._cardapioItens = _totemItens.concat(itensPrincFiltrados.map(function(it){
    // Normaliza: principal usa "categoria", totem usa "categoriaId"
    return Object.assign({}, it, { categoriaId: it.categoria });
  }));

  if(!window._cardapioCats.length){
    document.getElementById('carregando-txt').textContent =
      'Nenhum item cadastrado no cardápio do totem.\nCadastre pelo PDV em "Cardápio do Totem".';
    return;
  }

  // Esconde o carregando
  document.getElementById('carregando').classList.add('escondido');

  renderCategorias();
  renderItens();
}

// Renderiza as abas de categoria
function renderCategorias(){
  var box = document.getElementById('cats');
  if(!window._cardapioCats || !window._cardapioCats.length){
    box.innerHTML = '';
    return;
  }
  if(!_catAtiva) _catAtiva = window._cardapioCats[0].id;

  box.innerHTML = window._cardapioCats.map(function(c){
    return '<button class="cat' + (c.id === _catAtiva ? ' ativa' : '') +
      '" onclick="trocarCategoria(\'' + c.id + '\')">' +
      escapar(c.nome || '') + '</button>';
  }).join('');
}

function trocarCategoria(id){
  _catAtiva = id;
  renderCategorias();
  renderItens();
  resetTimerInatividade();
}

// Renderiza a grade de itens da categoria ativa
function renderItens(){
  var grade = document.getElementById('grade');
  if(!window._cardapioItens){
    grade.innerHTML = '';
    return;
  }
  var itens = window._cardapioItens.filter(function(it){
    return it.categoriaId === _catAtiva;
  });
  if(!itens.length){
    grade.innerHTML = '<div class="vazio">' +
      '<div class="ico">🍽️</div>' +
      '<div class="titulo">Sem itens nesta categoria</div>' +
    '</div>';
    return;
  }
  grade.innerHTML = itens.map(function(it){
    var fotoHtml = it.foto
      ? '<img src="' + it.foto + '" alt="" onerror="this.parentNode.textContent=\'🍽️\';">'
      : '🍽️';
    var preco = (it.preco||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
    var qtdNoCart = _carrinho.filter(function(c){ return c.itemId === it.id; }).reduce(function(s,c){ return s + c.qtd; }, 0);
    var badge = qtdNoCart > 0 ? '<div class="badge-cart">' + qtdNoCart + '</div>' : '';
    return '<div class="item" onclick="adicionarItem(\'' + it.id + '\',\'' + it.fonte + '\')">' +
      badge +
      '<div class="foto">' + fotoHtml + '</div>' +
      '<div class="info">' +
        '<div class="nome">' + escapar(it.nome||'') + '</div>' +
        (it.descricao ? '<div class="desc">' + escapar(it.descricao) + '</div>' : '') +
        '<div class="preco">R$ ' + preco + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ─── Tocar num item: abre o modal de personalização ───
function adicionarItem(itemId, fonte){
  var it = window._cardapioItens.find(function(x){ return x.id === itemId && x.fonte === fonte; });
  if(!it) return;
  _itemAberto = it;
  _qtdTemp = 1;
  _selecoesTemp = {};
  abrirModalItem();
  resetTimerInatividade();
}

// Verifica se um grupo (vinculado) realmente existe e tem opções
function _grupoValido(grupoId){
  var g = _grupos.find(function(x){ return x.id === grupoId; });
  return g && g.opcoes && g.opcoes.length;
}

// Pega os grupos vinculados a um item — FIXOS (do item) + CONDICIONAIS (das opções escolhidas)
function _gruposDoItem(item){
  if(!item) return [];
  var resultado = [];
  var jaIncluidos = {};

  // 1. Grupos fixos do item (sempre aparecem)
  (item.gruposIds || []).forEach(function(gid){
    var g = _grupos.find(function(x){ return x.id === gid; });
    if(g && g.opcoes && g.opcoes.length && !jaIncluidos[gid]){
      resultado.push(g);
      jaIncluidos[gid] = true;
    }
  });

  // 2. Grupos CONDICIONAIS — abertos pelas opções selecionadas
  // (ex: cliente escolheu "Executivo" → adiciona "Sem ingrediente Executivo")
  // Faz em loop pra suportar cadeias: opção abre grupo, opção desse grupo abre outro, etc
  var mudou = true;
  var seguranca = 0;
  while(mudou && seguranca++ < 10){
    mudou = false;
    resultado.forEach(function(grupo){
      var sel = _selecoesTemp[grupo.id] || [];
      sel.forEach(function(idx){
        var op = (grupo.opcoes||[])[idx];
        if(!op || !op.abreGrupos) return;
        op.abreGrupos.forEach(function(gid){
          if(jaIncluidos[gid]) return;
          var g = _grupos.find(function(x){ return x.id === gid; });
          if(g && g.opcoes && g.opcoes.length){
            resultado.push(g);
            jaIncluidos[gid] = true;
            mudou = true;
          }
        });
      });
    });
  }

  return resultado;
}

// Quando o cliente troca uma seleção, alguns grupos condicionais podem deixar de existir.
// Limpa as seleções dos grupos que não estão mais "abertos".
function _limparSelecoesOrfas(){
  if(!_itemAberto) return;
  var gruposAtivos = _gruposDoItem(_itemAberto);
  var idsAtivos = {};
  gruposAtivos.forEach(function(g){ idsAtivos[g.id] = true; });
  Object.keys(_selecoesTemp).forEach(function(gid){
    if(!idsAtivos[gid]) delete _selecoesTemp[gid];
  });
}

// Calcula o preço total com adicionais
function _precoComExtras(item, selecoes){
  var base = item.preco || 0;
  var extras = 0;
  Object.keys(selecoes||{}).forEach(function(gid){
    var g = _grupos.find(function(x){ return x.id === gid; });
    if(!g) return;
    (selecoes[gid]||[]).forEach(function(idx){
      var op = (g.opcoes||[])[idx];
      if(op && op.preco) extras += op.preco;
    });
  });
  return base + extras;
}

// Adiciona o item personalizado ao carrinho
function confirmarAdicionarAoCarrinho(){
  if(!_itemAberto) return;
  var it = _itemAberto;
  // Valida: grupos de escolha ÚNICA precisam ter algo selecionado (se obrigatório? por enquanto não obriga)
  var grupos = _gruposDoItem(it);

  // Monta a lista legível de opções
  var labelSelecoes = [];
  grupos.forEach(function(g){
    var sel = (_selecoesTemp[g.id]||[]).map(function(idx){
      return g.opcoes[idx] ? g.opcoes[idx].nome : '';
    }).filter(Boolean);
    if(sel.length){
      labelSelecoes.push(g.nome + ': ' + sel.join(', '));
    }
  });

  var precoUnit = _precoComExtras(it, _selecoesTemp);

  // Cada combinação vira uma linha nova no carrinho (sem agrupar com outros itens iguais
  // que podem ter opções diferentes)
  _carrinho.push({
    itemId: it.id,
    fonte: it.fonte,
    nome: it.nome,
    preco: precoUnit,
    precoBase: it.preco || 0,
    foto: it.foto || '',
    qtd: _qtdTemp,
    selecoes: _selecoesTemp,  // {grupoId: [idxOpcao,...]}
    selecoesLabel: labelSelecoes.join(' · '),
    gruposIds: it.gruposIds || []
  });

  fecharModalItem();
  atualizarBarra();
  renderItens();
  try{ if(navigator.vibrate) navigator.vibrate(20); }catch(e){}
  resetTimerInatividade();
}

// ─── Modal de personalização do item ───
function abrirModalItem(){
  renderModalItem();
  document.getElementById('modal-item').classList.add('aberto');
}
function fecharModalItem(){
  document.getElementById('modal-item').classList.remove('aberto');
  _itemAberto = null;
  _selecoesTemp = {};
  _qtdTemp = 1;
}

function renderModalItem(){
  if(!_itemAberto) return;
  var it = _itemAberto;
  var grupos = _gruposDoItem(it);

  // Foto
  var foto = it.foto
    ? '<img src="' + it.foto + '" alt="" onerror="this.parentNode.textContent=\'🍽️\';">'
    : '🍽️';
  document.getElementById('mi-foto').innerHTML = foto;
  document.getElementById('mi-nome').textContent = it.nome || '';
  document.getElementById('mi-desc').textContent = it.descricao || '';
  document.getElementById('mi-desc').style.display = it.descricao ? 'block' : 'none';

  // Grupos
  var boxGrupos = document.getElementById('mi-grupos');
  if(!grupos.length){
    boxGrupos.innerHTML = '';
    boxGrupos.style.display = 'none';
  } else {
    boxGrupos.style.display = 'block';
    boxGrupos.innerHTML = grupos.map(function(g){
      var ehUnica = g.tipo !== 'multipla';
      var selDoGrupo = _selecoesTemp[g.id] || [];
      var opcoesHtml = (g.opcoes||[]).map(function(op, idx){
        var marcado = selDoGrupo.indexOf(idx) >= 0;
        var precoTxt = op.preco
          ? '<span class="op-preco">+R$ ' + (op.preco).toLocaleString('pt-BR',{minimumFractionDigits:2}) + '</span>'
          : '';
        var icone = ehUnica
          ? '<div class="op-radio' + (marcado?' on':'') + '"></div>'
          : '<div class="op-check' + (marcado?' on':'') + '">' + (marcado?'✓':'') + '</div>';
        return '<div class="opcao' + (marcado?' selecionada':'') + '" onclick="selecionarOpcao(\'' + g.id + '\',' + idx + ')">' +
          icone +
          '<div class="op-nome">' + escapar(op.nome||'') + '</div>' +
          precoTxt +
        '</div>';
      }).join('');
      var subtitulo = ehUnica ? 'Escolha 1 opção' : 'Pode escolher várias';
      return '<div class="grupo-box">' +
        '<div class="grupo-cab">' +
          '<div class="grupo-nome">' + escapar(g.nome||'') + '</div>' +
          '<div class="grupo-sub">' + subtitulo + '</div>' +
        '</div>' +
        '<div class="grupo-opcoes">' + opcoesHtml + '</div>' +
      '</div>';
    }).join('');
  }

  // Quantidade
  document.getElementById('mi-qtd').textContent = _qtdTemp;

  // Total (preço * qtd)
  atualizarTotalModal();
}

function atualizarTotalModal(){
  if(!_itemAberto) return;
  var unit = _precoComExtras(_itemAberto, _selecoesTemp);
  var total = unit * _qtdTemp;
  document.getElementById('mi-total').textContent = 'R$ ' + total.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function selecionarOpcao(grupoId, idx){
  var g = _grupos.find(function(x){ return x.id === grupoId; });
  if(!g) return;
  var ehUnica = g.tipo !== 'multipla';
  if(!_selecoesTemp[grupoId]) _selecoesTemp[grupoId] = [];
  var atual = _selecoesTemp[grupoId];
  if(ehUnica){
    // Escolha única: substitui
    _selecoesTemp[grupoId] = [idx];
  } else {
    // Múltipla: alterna
    var pos = atual.indexOf(idx);
    if(pos >= 0) atual.splice(pos, 1);
    else atual.push(idx);
  }
  // Se a mudança "fechou" algum grupo condicional, remove as seleções dele
  _limparSelecoesOrfas();
  renderModalItem();
  resetTimerInatividade();
}

function alterarQtdModal(delta){
  _qtdTemp = Math.max(1, _qtdTemp + delta);
  document.getElementById('mi-qtd').textContent = _qtdTemp;
  atualizarTotalModal();
  resetTimerInatividade();
}

function alterarQtd(idxCart, delta){
  if(idxCart < 0 || idxCart >= _carrinho.length) return;
  _carrinho[idxCart].qtd += delta;
  if(_carrinho[idxCart].qtd <= 0) _carrinho.splice(idxCart, 1);
  atualizarBarra();
  renderCarrinhoModal();
  renderItens();
  resetTimerInatividade();
}

function atualizarBarra(){
  var barra = document.getElementById('barra-carrinho');
  var totalItens = _carrinho.reduce(function(s,c){ return s + c.qtd; }, 0);
  var totalValor = _carrinho.reduce(function(s,c){ return s + (c.preco * c.qtd); }, 0);

  if(totalItens === 0){
    barra.classList.remove('visivel');
    return;
  }
  barra.classList.add('visivel');
  document.getElementById('barra-resumo').textContent = totalItens + (totalItens === 1 ? ' item' : ' itens');
  document.getElementById('barra-total').textContent = 'R$ ' + totalValor.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function abrirCarrinho(){
  renderCarrinhoModal();
  document.getElementById('modal-carrinho').classList.add('aberto');
  resetTimerInatividade();
}
function fecharCarrinho(){
  document.getElementById('modal-carrinho').classList.remove('aberto');
}

function renderCarrinhoModal(){
  var box = document.getElementById('cart-itens');
  if(!_carrinho.length){
    box.innerHTML = '<div class="cart-vazio">Carrinho vazio</div>';
    document.getElementById('cart-total-val').textContent = 'R$ 0,00';
    return;
  }
  box.innerHTML = _carrinho.map(function(c, idx){
    var foto = c.foto
      ? '<img src="' + c.foto + '" alt="" onerror="this.parentNode.textContent=\'🍽️\';">'
      : '🍽️';
    var subtotal = (c.preco * c.qtd).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
    var labelOpcoes = c.selecoesLabel
      ? '<div class="sel-label">' + escapar(c.selecoesLabel) + '</div>'
      : '';
    return '<div class="cart-item">' +
      '<div class="foto-mini">' + foto + '</div>' +
      '<div class="info">' +
        '<div class="nome">' + escapar(c.nome) + '</div>' +
        labelOpcoes +
        '<div class="preco">R$ ' + subtotal + '</div>' +
      '</div>' +
      '<div class="cart-qtd">' +
        '<button onclick="alterarQtd(' + idx + ',-1)">−</button>' +
        '<div class="n">' + c.qtd + '</div>' +
        '<button onclick="alterarQtd(' + idx + ',1)">+</button>' +
      '</div>' +
    '</div>';
  }).join('');
  var total = _carrinho.reduce(function(s,c){ return s + (c.preco * c.qtd); }, 0);
  document.getElementById('cart-total-val').textContent = 'R$ ' + total.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

// ─── Finalizar (placeholder pra próxima etapa) ───
function finalizarPedido(){
  if(!_carrinho.length){
    alert('Adicione itens ao carrinho primeiro');
    return;
  }
  // Por enquanto só mostra um resumo. Na próxima etapa: gera senha + imprime.
  var total = _carrinho.reduce(function(s,c){ return s + (c.preco * c.qtd); }, 0);
  var resumo = '✅ PEDIDO PRONTO PARA FINALIZAR\n\n';
  _carrinho.forEach(function(c){
    resumo += c.qtd + 'x ' + c.nome + ' — R$ ' + (c.preco * c.qtd).toFixed(2) + '\n';
  });
  resumo += '\nTOTAL: R$ ' + total.toFixed(2);
  resumo += '\n\n(Próxima etapa vai gerar senha e imprimir)';
  alert(resumo);
}

// ─── Tela inicial / fluxo ───
function comecarPedido(){
  document.getElementById('tela-inicial').classList.add('escondida');
  setTimeout(function(){
    document.getElementById('tela-inicial').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
  }, 400);
  iniciarTimerInatividade();
}

function voltarTelaInicial(){
  if(_carrinho.length){
    if(!confirm('Cancelar o pedido? Os itens do carrinho serão perdidos.')) return;
  }
  _carrinho = [];
  _catAtiva = '';
  atualizarBarra();
  fecharCarrinho();
  fecharModalItem();
  document.getElementById('tela-inicial').style.display = 'flex';
  setTimeout(function(){
    document.getElementById('tela-inicial').classList.remove('escondida');
  }, 30);
  document.getElementById('app').style.display = 'none';
  pararTimerInatividade();
}

// Volta pra tela inicial após 90s sem mexer
function iniciarTimerInatividade(){
  resetTimerInatividade();
}
function resetTimerInatividade(){
  pararTimerInatividade();
  _timerInatividade = setTimeout(function(){
    voltarTelaInicial();
  }, 90000); // 90s
}
function pararTimerInatividade(){
  if(_timerInatividade){ clearTimeout(_timerInatividade); _timerInatividade = null; }
}

// Detecta toque em qualquer lugar pra resetar o timer
document.addEventListener('touchstart', resetTimerInatividade, {passive:true});
document.addEventListener('click', resetTimerInatividade);

// Util
function escapar(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
